<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>체중관리</title>
<style>
  :root{
    --bg:#F2F2F7; --surface:#FFFFFF; --raise:#ECECF1; --border:#E3E3E8;
    --text:#1C1C1E; --muted:#6E6E73; --dim:#AEAEB2;
    --acc:#30D158; --acc-bg:rgba(48,209,88,.12);
    --amber:#FF9F0A; --amber-bg:rgba(255,159,10,.14);
    --red:#FF3B30; --red-bg:rgba(255,59,48,.12);
    --blue:#0A84FF; --blue-bg:rgba(10,132,255,.12);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
  body{padding-bottom:78px; -webkit-font-smoothing:antialiased;}
  button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ===== 헤더 ===== */
  header{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--border);
    padding:calc(11px + env(safe-area-inset-top,0px)) 14px 12px;}
  .h-row{display:flex; align-items:center; gap:10px;}
  .h-left{flex:1; min-width:0;}
  .h-title{font-size:17px; font-weight:700;}
  .h-date{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:2px;}
  .shift-badge{flex:none; padding:7px 13px; border-radius:11px; text-align:center;
    font-size:15px; font-weight:700; line-height:1.15;}
  .shift-badge .s{display:block; font-size:9.5px; font-weight:600; opacity:.85; margin-top:1px;}
  .sb-ju{background:var(--acc-bg); color:var(--acc);}
  .sb-ya{background:var(--amber-bg); color:var(--amber);}
  .sb-bi{background:var(--raise); color:var(--dim);}
  .ic-btn{flex:none; width:34px; height:34px; border-radius:10px; background:var(--raise);
    border:1px solid var(--border); color:var(--muted); font-size:14px;}

  .bar-wrap{margin-top:11px; display:flex; align-items:center; gap:10px;}
  .mo-wrap{margin-top:10px; display:flex; gap:8px;}
  .mo-chip{flex:1; background:var(--raise); border:1.5px solid transparent; border-radius:12px;
    padding:8px 10px 9px;}
  .mo-chip.ok{border-color:var(--acc); background:var(--acc-bg);}
  .mo-top{display:flex; align-items:baseline; gap:6px;}
  .mo-top .ic{font-size:13px;}
  .mo-top .lbl{flex:1; font-size:11px; font-weight:800; color:var(--muted);}
  .mo-chip.ok .lbl{color:var(--acc);}
  .mo-top .cnt{font-family:var(--mono); font-size:12.5px; font-weight:800; color:var(--text);}
  .mo-chip.ok .mo-top .cnt{color:var(--acc);}
  .mo-bar{height:5px; border-radius:4px; background:var(--border); overflow:hidden; margin-top:5px;}
  .mo-bar-fill{height:100%; background:var(--blue); border-radius:4px;}
  .mo-chip.ok .mo-bar-fill{background:var(--acc);}
  .bar{flex:1; height:9px; border-radius:6px; background:var(--raise);
    border:1px solid var(--border); overflow:hidden;}
  .bar-fill{height:100%; width:0; background:var(--acc); border-radius:6px; transition:width .4s ease;}
  .bar-txt{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap;}

  /* ===== 페이지 공통 ===== */
  main{display:block;}
  .page{display:none; padding:14px 14px 4px;}
  .page.on{display:block;}
  .sec-t{display:flex; align-items:center; gap:9px; margin:18px 2px 9px;
    font-size:11.5px; font-weight:800; letter-spacing:.05em; color:var(--dim);}
  .sec-t:first-child{margin-top:2px;}
  .sec-t::after{content:""; flex:1; height:1px; background:var(--border);}
  .card{background:var(--surface); border:.5px solid var(--border); border-radius:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
    padding:14px; margin-bottom:10px;}
  .hint{font-size:11.5px; color:var(--dim); line-height:1.65; margin:8px 2px 0;}
  .empty{text-align:center; color:var(--dim); font-size:13px; padding:34px 16px; line-height:1.8;}

  /* ===== 체중 입력 ===== */
  /* ===== 칼로리 계산기 목표 카드 ===== */
  .calc-card{background:linear-gradient(135deg,#1C1C1E,#2C2C2E); border:none; border-radius:16px;
    padding:16px; margin-bottom:10px; color:#fff;}
  .calc-top{display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  .calc-top .t{flex:1; font-size:12px; font-weight:700; color:rgba(255,255,255,.6);}
  .calc-edit{flex:none; font-size:11.5px; font-weight:700; color:#fff;
    background:rgba(255,255,255,.14); padding:5px 11px; border-radius:20px;}
  .calc-kcal{font-size:30px; font-weight:800; font-family:var(--mono); letter-spacing:-.02em; margin:3px 0 12px;}
  .calc-kcal small{font-size:14px; font-weight:600; color:rgba(255,255,255,.55); margin-left:3px;}
  .calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .calc-grid div{background:rgba(255,255,255,.08); border-radius:11px; padding:8px 4px; text-align:center;}
  .calc-grid b{display:block; font-family:var(--mono); font-size:14px; font-weight:800;}
  .calc-grid span{display:block; font-size:10px; color:rgba(255,255,255,.55); margin-top:2px; font-weight:600;}
  .intake{margin-top:13px; padding-top:12px; border-top:1px solid rgba(255,255,255,.12);}
  .intake-bar{height:6px; border-radius:4px; background:rgba(255,255,255,.14); overflow:hidden;}
  .intake-fill{height:100%; background:#30D158; border-radius:4px; transition:width .4s ease;}
  .intake-tx{font-size:11.5px; color:rgba(255,255,255,.6); margin-top:8px; line-height:1.6;}
  .intake-tx b{color:#fff; font-family:var(--mono);}
  .intake-tx span{display:block; color:#30D158; font-weight:700; margin-top:2px;}
  .intake-tx span.over{color:#FF9F0A;}
  .net-row{display:flex; align-items:baseline; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .net-i{font-family:var(--mono); font-size:13px; font-weight:700; color:rgba(255,255,255,.85);}
  .net-b{font-family:var(--mono); font-size:13px; font-weight:700; color:#0A84FF;}
  .net-op{font-size:12px; color:rgba(255,255,255,.4);}
  .net-t{margin-left:auto; font-family:var(--mono); font-size:22px; font-weight:800; color:#fff;}
  .net-t small{font-size:11px; font-weight:600; color:rgba(255,255,255,.5); margin-left:2px;}
  .calc-empty{display:flex; align-items:center; gap:12px; background:var(--surface);
    border:.5px solid var(--border); border-radius:16px; padding:14px; margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .calc-empty .ic{font-size:22px;}
  .calc-empty .tx{flex:1; font-size:12.5px; color:var(--muted); line-height:1.5;}
  .calc-empty button{flex:none; background:var(--acc); color:#fff; font-size:12.5px; font-weight:700;
    padding:9px 14px; border-radius:11px;}
  .w-now{display:flex; align-items:baseline; gap:8px; margin-bottom:11px;}
  .w-now .big{font-size:30px; font-weight:800; font-family:var(--mono); letter-spacing:-.02em;}
  .w-now .delta{font-size:13px; font-weight:800;}
  .w-now .delta.dn{color:var(--acc);} .w-now .delta.up{color:var(--red);}
  .w-now .sub{font-size:11.5px; color:var(--dim); margin-left:auto;}
  .w-row{display:flex; gap:8px; align-items:flex-end;}
  .fld{flex:1; min-width:0;}
  .fld label{display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:5px;}
  .fld input{width:100%; background:var(--raise); border:1.5px solid transparent;
    border-radius:11px; padding:11px 12px; color:var(--text);
    font-size:17px; font-weight:700; font-family:var(--mono); outline:none;}
  .fld input:focus{border-color:var(--blue); background:var(--surface);}
  .save-btn{flex:none; padding:12px 16px; border-radius:11px; background:var(--acc);
    color:#fff; font-size:14px; font-weight:800;}

  /* ===== 운동 ===== */
  .slot-t{font-size:12px; font-weight:800; color:var(--muted); margin:0 0 8px 2px;}
  .slot-t span{font-family:var(--mono); font-size:10.5px; color:var(--dim); font-weight:600; margin-left:5px;}
  .ex-row{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px;}
  .ex-row:last-child{margin-bottom:0;}
  .ex{padding:12px 1px; border-radius:12px; text-align:center;
    background:var(--raise); border:1.5px solid transparent;
    font-size:11.5px; font-weight:700; color:var(--muted); transition:.15s;
    letter-spacing:-.02em; white-space:nowrap;}
  .ex .em{display:block; font-size:17px; margin-bottom:3px;}
  .ex-sub{display:block; font-size:9.5px; font-weight:700; color:var(--acc);
    margin-top:3px; font-family:var(--mono);}
  .ex-total{margin-top:12px; padding-top:11px; border-top:.5px solid var(--border);
    font-size:12.5px; color:var(--muted); text-align:right;}
  .ex-total b{font-family:var(--mono); font-size:15px; color:var(--blue);}
  .ex-total.mut{text-align:left; font-size:11.5px; color:var(--dim);}
  .lv-seg{display:flex; gap:7px; margin-bottom:14px;}
  .lv-seg button{flex:1; padding:11px 2px; border-radius:11px; font-size:13px; font-weight:700;
    background:var(--raise); border:1.5px solid transparent; color:var(--muted);}
  .lv-seg button.on{background:var(--acc-bg); border-color:var(--acc); color:var(--acc);}
  .ex-prev{font-size:13px; color:var(--text); padding:11px 13px; border-radius:11px;
    background:var(--raise); line-height:1.5;}
  .ex-prev b{font-family:var(--mono); font-size:19px; color:var(--blue);}
  .ex-prev .mut{color:var(--dim); font-size:11.5px;}
  .ex.on{background:var(--acc-bg); border-color:var(--acc); color:var(--acc);}
  .ex:active{transform:scale(.97);}

  /* ===== 체크리스트 ===== */
  .chk-row{display:flex; align-items:flex-start; gap:11px; padding:11px 2px;
    border-top:.5px solid var(--border);}
  .chk-row:first-child{border-top:none;}
  .box{flex:none; width:23px; height:23px; border-radius:50%; border:2px solid var(--dim);
    background:none; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .box svg{width:13px; height:13px; opacity:0; transform:scale(.5); transition:.16s;}
  .chk-row.done .box{background:var(--acc); border-color:var(--acc);}
  .chk-row.done .box svg{opacity:1; transform:scale(1);}
  .chk-txt{flex:1; min-width:0; font-size:14.5px; line-height:1.5; word-break:keep-all;}
  .chk-row.done .chk-txt{color:var(--dim); text-decoration:line-through;}
  .chk-del{flex:none; color:var(--dim); font-size:15px; padding:0 3px;}
  .chk-edit{flex:none; color:var(--dim); font-size:14px; padding:0 3px;}
  .chk-input{flex:1; min-width:0; background:var(--surface); border:1.5px solid var(--blue);
    border-radius:9px; padding:9px 11px; color:var(--text); font-size:14.5px; outline:none;}
  .chk-ok{flex:none; font-size:12px; font-weight:700; color:#fff; background:var(--acc);
    padding:8px 12px; border-radius:9px;}
  .chk-cancel{flex:none; font-size:12px; font-weight:600; color:var(--muted); padding:8px 6px;}

  /* 식단 영양 칩 */
  .nut-row{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-bottom:5px;}
  .nut-kcal{font-family:var(--mono); font-size:13.5px; font-weight:800; color:var(--text);}
  .nut-chip{font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px;
    background:var(--blue-bg); color:var(--blue);}

  /* 하루 영양 요약 */
  .sum-card{background:var(--surface); border:.5px solid var(--border); border-radius:16px;
    padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .sum-head{display:flex; align-items:baseline; gap:8px; margin-bottom:12px;}
  .sum-day{font-size:14px; font-weight:800;}
  .sum-meta{margin-left:auto; font-size:11px; color:var(--dim); font-weight:600;}
  .sum-fast{font-size:10px; font-weight:800; padding:2px 8px; border-radius:9px;
    background:var(--blue-bg); color:var(--blue);}
  .sum-row{display:flex; align-items:center; gap:9px; padding:9px 0; border-top:.5px solid var(--border);}
  .sum-eq{display:flex; align-items:baseline; gap:7px; padding:11px 12px; margin-bottom:10px;
    background:var(--raise); border-radius:12px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .sum-eq b{font-family:var(--mono); font-size:13.5px; color:var(--text); font-weight:800;}
  .sum-eq b.burn{color:var(--blue);}
  .sum-eq .op{color:var(--dim);}
  .sum-eq .tot{margin-left:auto; font-family:var(--mono); font-size:19px; font-weight:800; color:var(--text);}
  .sum-eq .tot em{font-style:normal; font-size:10.5px; color:var(--dim); margin-left:2px;}
  .sum-row:first-of-type{border-top:none;}
  .sum-name{flex:none; width:52px; font-size:12.5px; font-weight:700; color:var(--muted);}
  .sum-val{flex:none; font-family:var(--mono); font-size:13px; font-weight:700; width:88px;}
  .sum-val em{font-style:normal; color:var(--dim); font-weight:600;}
  .sum-track{flex:1; height:6px; border-radius:4px; background:var(--raise); overflow:hidden; min-width:24px;}
  .sum-fill{height:100%; border-radius:4px;}
  .sum-tag{flex:none; font-size:11px; font-weight:800; width:76px; text-align:right;}
  .t-good{color:var(--acc);} .t-warn{color:var(--amber);} .t-bad{color:var(--red);} .t-mut{color:var(--dim);}
  .f-good{background:var(--acc);} .f-warn{background:var(--amber);} .f-bad{background:var(--red);}
  .sum-none{font-size:12px; color:var(--dim); line-height:1.6; padding:4px 2px;}
  .sum-note{font-size:10.5px; color:var(--dim); line-height:1.6; margin-top:10px;
    padding-top:10px; border-top:.5px solid var(--border);}

  /* 동기부여 보드 */
  .mv-add{display:flex; gap:7px; margin-bottom:12px;}
  .mv-add button{flex:1; padding:11px 2px; border-radius:12px; font-size:12.5px; font-weight:700;
    background:var(--raise); border:1.5px dashed var(--border); color:var(--muted);}
  .mv-card{background:var(--surface); border:.5px solid var(--border); border-radius:16px;
    overflow:hidden; margin-bottom:11px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .mv-car{position:relative; overflow:hidden; background:#000;}
  .mv-track{display:flex; transition:transform .28s cubic-bezier(.22,.61,.36,1);}
  .mv-cell{flex:0 0 100%; width:100%; display:flex; align-items:center; justify-content:center;
    background:#000; max-height:62vh;}
  .mv-cell img, .mv-cell video{width:100%; max-height:62vh; object-fit:contain; display:block;}
  .mv-dots{position:absolute; left:0; right:0; bottom:9px; display:flex; justify-content:center;
    gap:5px; pointer-events:none;}
  .mv-dots i{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.45);
    transition:.18s;}
  .mv-dots i.on{background:#fff; transform:scale(1.25);}
  .mv-count{position:absolute; top:9px; right:10px; font-size:10.5px; font-weight:700;
    color:#fff; background:rgba(0,0,0,.5); padding:3px 9px; border-radius:20px;
    pointer-events:none; font-family:var(--mono);}
  .mv-nav{position:absolute; top:50%; transform:translateY(-50%); width:34px; height:52px;
    background:rgba(0,0,0,.34); color:#fff; font-size:24px; line-height:1;
    display:flex; align-items:center; justify-content:center;}
  .mv-nav.l{left:0; border-radius:0 10px 10px 0;}
  .mv-nav.r{right:0; border-radius:10px 0 0 10px;}
  .lb-stage{max-width:100%; max-height:100%; display:flex; align-items:center; justify-content:center;}
  .lb-stage img, .lb-stage video{max-width:100vw; max-height:88vh; object-fit:contain;}
  .lb-count{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); left:0; right:0;
    text-align:center; color:#fff; font-size:12px; font-weight:700; font-family:var(--mono);}
  .mv-body{padding:12px 13px 13px;}
  .mv-note{width:100%; background:none; border:none; color:var(--text); font-size:14px;
    line-height:1.6; outline:none; resize:none; padding:0; font-family:inherit;
    overflow:hidden; display:block; min-height:2.2em;}
  .mv-note::placeholder{color:var(--dim);}
  .mv-link{display:flex; align-items:center; gap:8px; margin-top:9px; padding:10px 12px;
    background:var(--blue-bg); border-radius:11px; color:var(--blue);
    font-size:12.5px; font-weight:700; text-decoration:none; word-break:break-all;}
  .mv-foot{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .mv-date{flex:1; font-family:var(--mono); font-size:10.5px; color:var(--dim); font-weight:600;}
  .mv-btn{font-size:11.5px; font-weight:700; color:var(--muted); background:var(--raise);
    padding:6px 11px; border-radius:20px;}
  .mv-btn.del{color:var(--red);}
  .mv-btn.pin.on{background:var(--amber-bg); color:var(--amber);}
  .mv-card.pinned{border:1.5px solid var(--amber);}
  .mv-card.dragging{opacity:.9; transform:scale(1.02);
    box-shadow:0 10px 28px rgba(0,0,0,.18); position:relative; z-index:5;}
  .mv-card{transition:transform .16s ease, box-shadow .16s ease;}
  .add-row{display:flex; gap:7px; margin-top:11px;}
  .add-row input{flex:1; min-width:0; background:var(--raise); border:1.5px solid transparent;
    border-radius:11px; padding:11px; color:var(--text); font-size:14px; outline:none;}
  .add-row input:focus{border-color:var(--blue); background:var(--surface);}
  .add-row button{flex:none; padding:0 16px; border-radius:11px; background:var(--acc-bg);
    border:1.5px solid var(--acc); color:var(--acc); font-size:14px; font-weight:800;}

  /* ===== 식단 (해당 날짜) ===== */
  .meal-add{display:flex; gap:6px; margin-bottom:10px;}
  .meal-add button{flex:1; padding:10px 2px; border-radius:11px; font-size:12.5px; font-weight:700;
    background:var(--raise); border:1.5px dashed var(--border); color:var(--muted);}
  .m-card{display:flex; gap:11px; background:var(--raise); border:1px solid var(--border);
    border-radius:13px; padding:9px; margin-bottom:9px;}
  .m-card:last-child{margin-bottom:0;}
  .m-thumb{width:66px; height:66px; flex:none; border-radius:10px; overflow:hidden;
    background:var(--surface); border:1px solid var(--border);}
  .m-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .m-thumb.fast-thumb{display:flex; align-items:center; justify-content:center;
    font-size:24px; opacity:.4; background:var(--raise);}
  .m-body{flex:1; min-width:0; display:flex; flex-direction:column;}
  .m-top{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
  .m-pill{font-size:10.5px; font-weight:800; padding:2.5px 8px; border-radius:10px;
    background:var(--acc-bg); color:var(--acc);}
  .m-pill.fast{background:var(--blue-bg); color:var(--blue);}
  .m-ai{margin-left:auto; background:var(--blue-bg); color:var(--blue); font-size:11.5px;
    font-weight:700; padding:4px 9px; border-radius:20px;}
  .m-del{color:var(--dim); font-size:14px;}
  .m-memo{flex:1; width:100%; background:none; border:none; color:var(--text);
    font-size:13.5px; line-height:1.55; outline:none; resize:none; padding:0;
    overflow:hidden; display:block; min-height:2.1em; font-family:inherit;}
  .m-memo::placeholder{color:var(--dim);}

  /* ===== 레벨 ===== */
  .lv-hero{text-align:center; padding:6px 0 14px;}
  .lv-hero .l{font-size:11.5px; font-weight:800; letter-spacing:.16em; color:var(--dim); margin-bottom:4px;}
  .lv-hero .n{font-size:50px; font-weight:900; line-height:1; color:var(--acc);}
  .lv-hero .g{font-size:13px; color:var(--muted); margin-top:9px; line-height:1.6;}
  .lv-hero .g b{color:var(--text); font-family:var(--mono);}
  .ladder{display:flex; flex-direction:column-reverse;}
  .step{display:flex; align-items:center; gap:11px; padding:2px 0;}
  .rail{width:22px; display:flex; flex-direction:column; align-items:center; align-self:stretch;}
  .led{width:14px; height:14px; border-radius:50%; flex:none; margin-top:11px;
    background:var(--surface); border:2px solid var(--dim);}
  .led.done{background:var(--acc); border-color:var(--acc);}
  .led.cur{background:var(--amber); border-color:var(--amber);}
  .rail-line{flex:1; width:2px; background:var(--border); min-height:8px;}
  .step:first-child .rail-line{display:none;}
  .step-card{flex:1; min-width:0; display:flex; align-items:center; gap:9px;
    background:var(--surface); border:1px solid var(--border); border-radius:11px;
    padding:10px 12px; margin-bottom:5px;}
  .step.cur .step-card{border-color:var(--amber); background:var(--amber-bg);}
  .step.done .step-card{opacity:.55;}
  .step-lv{font-family:var(--mono); font-size:12px; font-weight:800; color:var(--dim); width:38px; flex:none;}
  .step.cur .step-lv{color:var(--amber);}
  .step-w{font-family:var(--mono); font-size:14.5px; font-weight:700;}
  .step-tag{margin-left:auto; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:9px;}
  .step-tag.cur{background:var(--amber-bg); color:var(--amber);}
  .step-tag.goal{background:var(--acc-bg); color:var(--acc);}
  .spark{width:100%; height:130px; display:block;}
  .streak{display:flex; align-items:center; gap:11px;}
  .streak .n{font-size:28px; font-weight:800; font-family:var(--mono); color:var(--amber);}
  .streak .t{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .ms-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center;}
  .ms-grid > div{background:var(--raise); border-radius:12px; padding:12px 4px;}
  .ms-grid b{display:block; font-family:var(--mono); font-size:19px; font-weight:800;
    letter-spacing:-.02em;}
  .ms-grid b.dn{color:var(--acc);} .ms-grid b.up{color:var(--red);}
  .ms-grid span{display:block; font-size:10px; color:var(--muted); margin-top:4px; font-weight:600;}

  /* ===== 기록 (캘린더) ===== */
  .rec-seg{display:flex; gap:6px; margin-bottom:12px;}
  .rec-seg button{flex:1; padding:9px 0; border-radius:11px; font-size:13px; font-weight:700;
    background:var(--raise); border:1.5px solid transparent; color:var(--muted);}
  .rec-seg button.sel{background:var(--acc); border-color:var(--acc); color:#fff;}
  .rec-nav{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .rec-nav .lbl{flex:1; font-size:15px; font-weight:800; text-align:center;}
  .rec-nav button{flex:none; width:32px; height:32px; border-radius:9px; background:var(--raise);
    border:1px solid var(--border); font-size:14px; color:var(--text);}
  .rec-nav .today-btn{width:auto; padding:0 12px; font-size:12px; font-weight:800; color:var(--acc);}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:5px;}
  .dow span{text-align:center; font-size:11px; font-weight:800; color:var(--muted); padding:4px 0;}
  .dow span:first-child, .dow span:last-child{color:var(--red);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cell{aspect-ratio:1; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:3px; position:relative;}
  .cell.out{opacity:.32;}
  .cell.today{border:1.5px solid var(--acc);}
  .cell .dnum{font-size:12.5px; font-weight:700; color:var(--muted); font-family:var(--mono);}
  .cell.wknd .dnum{color:var(--red);}
  .cell.today .dnum{color:var(--acc); font-weight:800;}
  .dots{display:flex; gap:2.5px;}
  .dot{width:5px; height:5px; border-radius:50%;}
  .dot.w{background:var(--acc);} .dot.e{background:var(--blue);} .dot.m{background:var(--amber);}
  .legend{display:flex; gap:14px; margin-top:12px; font-size:11px; color:var(--dim);}
  .legend span{display:flex; align-items:center; gap:5px;}
  .legend .dot{width:6px; height:6px;}

  .week-list{display:flex; flex-direction:column; gap:8px;}
  .wk-card{display:flex; align-items:center; gap:11px; background:var(--surface);
    border:1px solid var(--border); border-radius:13px; padding:11px 13px;}
  .wk-card.today{border-color:var(--acc);}
  .wk-d{flex:none; width:40px; text-align:center;}
  .wk-d .dow2{font-size:10.5px; font-weight:800; color:var(--dim);}
  .wk-d .num2{font-size:17px; font-weight:800; font-family:var(--mono);}
  .wk-card.wknd .wk-d .dow2, .wk-card.wknd .wk-d .num2{color:var(--red);}
  .wk-mid{flex:1; min-width:0;}
  .wk-w{font-size:14px; font-weight:800; font-family:var(--mono);}
  .wk-w.none{color:var(--dim); font-weight:600; font-family:inherit;}
  .wk-chips{display:flex; gap:5px; margin-top:5px; flex-wrap:wrap;}
  .wk-chip{font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px;}
  .wk-chip.e{background:var(--blue-bg); color:var(--blue);}
  .wk-chip.m{background:var(--amber-bg); color:var(--amber);}
  .wk-chip.b{background:var(--acc-bg); color:var(--acc);}
  .wk-go{flex:none; color:var(--dim); font-size:16px;}

  /* ===== 다이얼로그 / 시트 / 라이트박스 / 토스트 ===== */
  .ov{position:fixed; inset:0; background:rgba(22,48,43,.42); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:22px;}
  .dlg{background:var(--surface); border:1px solid var(--border); border-radius:16px;
    width:100%; max-width:330px; padding:20px 18px;}
  .dlg-t{font-size:15.5px; font-weight:800; margin-bottom:13px;}
  .dlg-m{font-size:14.5px; line-height:1.6; white-space:pre-line;}
  .dlg-btns{display:flex; gap:8px; margin-top:18px;}
  .dlg-b{flex:1; padding:12px; border-radius:11px; border:1px solid transparent;
    background:var(--raise); color:var(--muted); font-size:14px; font-weight:600;}
  .dlg-b.p{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:800;}

  .sheet-ov{position:fixed; inset:0; background:rgba(22,48,43,.45); z-index:210;
    display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:520px; background:var(--bg); border-radius:20px 20px 0 0;
    max-height:88vh; overflow-y:auto; padding:8px 14px calc(20px + env(safe-area-inset-bottom,0px));}
  .sheet-grab{width:38px; height:4px; background:var(--border); border-radius:3px; margin:8px auto 12px;}
  .sheet-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .sheet-title{flex:1; font-size:16.5px; font-weight:800;}
  .sheet-close{flex:none; width:30px; height:30px; border-radius:9px; background:var(--raise);
    border:1px solid var(--border); font-size:14px;}

  .lb{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:300;
    display:flex; align-items:center; justify-content:center;}
  .lb img{max-width:100%; max-height:100%; object-fit:contain;}

  .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(14px);
    background:var(--text); color:#fff; font-size:13px; font-weight:700;
    padding:11px 18px; border-radius:22px; opacity:0; pointer-events:none;
    transition:.2s; z-index:400; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== 공복 타이머 ===== */
  .fast-card{padding:16px;}
  .fast-top{display:flex; align-items:center; margin-bottom:12px;}
  .fast-t{flex:1; font-size:12px; font-weight:800; letter-spacing:.04em; color:var(--dim);}
  .fast-info{font-size:11.5px; font-weight:700; color:var(--blue);
    background:var(--blue-bg); padding:5px 11px; border-radius:20px;}
  .fast-idle{font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:12px;}
  .fast-goals{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .fast-goals button{padding:13px 2px; border-radius:12px; background:var(--raise);
    border:1.5px solid transparent; font-size:13.5px; font-weight:800; color:var(--text);}
  .fast-goals button:active{transform:scale(.97);}
  .fast-last{margin-top:12px; padding-top:11px; border-top:.5px solid var(--border);
    font-size:11.5px; color:var(--dim);}
  .fast-last b{color:var(--text); font-family:var(--mono);}
  .fast-main{position:relative; display:flex; align-items:center; justify-content:center;
    margin:4px 0 14px;}
  .fast-ring{width:168px; height:168px; transform:rotate(-90deg);}
  .fr-bg{fill:none; stroke:var(--raise); stroke-width:9;}
  .fr-fg{fill:none; stroke:#FF3B30; stroke-width:9; stroke-linecap:round;
    transition:stroke-dashoffset .95s linear, stroke .4s ease;
    filter:drop-shadow(0 0 5px rgba(255,59,48,.45));}
  .fr-fg.done{stroke:var(--acc); filter:drop-shadow(0 0 6px rgba(48,209,88,.5));}
  .fast-mid{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:5px;}
  .fast-left{font-family:var(--mono); font-size:29px; font-weight:800; letter-spacing:-.03em;}
  .fast-sub{font-size:10.5px; font-weight:700; color:var(--muted); text-align:center; line-height:1.5;}
  .fs-el{font-family:var(--mono); color:var(--dim); font-weight:600;}
  .fast-actions{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .fa-btn{padding:12px 2px; border-radius:12px; background:var(--raise);
    font-size:12.5px; font-weight:800; color:var(--text);}
  .fa-btn.stop{color:var(--red);}
  .fa-btn:active{transform:scale(.97);}
  .fast-goals button.on{background:var(--red-bg); color:var(--red);}
  .calc-warn{margin-top:10px; font-size:10.5px; color:rgba(255,255,255,.55); line-height:1.5;}
  .cal-note{font-size:11px; color:var(--dim); line-height:1.6; margin-bottom:12px;}
  .cal-note b{color:var(--text);}
  .cal-lbl{display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:6px;}
  .cal-need{font-size:12px; color:var(--dim); padding:14px; background:var(--raise);
    border-radius:12px; text-align:center;}
  .act-seg{display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-bottom:14px;}
  .act-seg button{padding:10px 4px; border-radius:11px; background:var(--raise);
    border:1.5px solid transparent; color:var(--muted); text-align:center;}
  .act-seg button b{display:block; font-size:12.5px; font-weight:800;}
  .act-seg button span{display:block; font-size:9.5px; margin-top:2px; opacity:.8;}
  .act-seg button.on, .lv-seg button.on{background:var(--acc-bg); border-color:var(--acc); color:var(--acc);}
  .lv-seg button b{display:block; font-size:13px; font-weight:800;}
  .lv-seg button span{display:block; font-size:9.5px; margin-top:1px; opacity:.8;}
  /* 공복 기록 리스트 */
  .fh-list{display:flex; flex-direction:column; gap:9px;}
  .fh-row{display:flex; align-items:center; gap:10px;}
  .fh-d{flex:none; width:36px; font-family:var(--mono); font-size:10.5px;
    font-weight:700; color:var(--dim);}
  .fh-mid{flex:1; min-width:0;}
  .fh-bar{height:7px; border-radius:5px; background:var(--raise); overflow:hidden;}
  .fh-fill{height:100%; background:var(--amber); border-radius:5px;}
  .fh-fill.ok{background:var(--acc);}
  .fh-t{font-family:var(--mono); font-size:9.5px; color:var(--dim); margin-top:4px;}
  .fh-h{flex:none; font-family:var(--mono); font-size:13px; font-weight:800; color:var(--amber);}
  .fh-h.ok{color:var(--acc);}
  .fh-h span{font-size:9.5px; color:var(--dim); font-weight:600;}
  .fh-more{margin-top:11px; font-size:10.5px; color:var(--dim); text-align:center;}
  .fast-stage{background:var(--raise); border-radius:12px; padding:12px 13px; margin-bottom:12px;}
  .fs-now{font-size:12.5px; font-weight:800; color:var(--blue); margin-bottom:5px;}
  .fs-txt{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .fs-next{font-size:11px; color:var(--dim); margin-top:7px; font-family:var(--mono);}
  .fast-stop{width:100%; padding:13px; border-radius:12px; background:var(--raise);
    color:var(--red); font-size:14px; font-weight:800;}
  .fs-list{max-height:44vh; overflow-y:auto; margin-bottom:12px;}
  .fs-item{padding:10px 0; border-top:.5px solid var(--border);}
  .fs-item:first-child{border-top:none;}
  .fs-item.done .fs-h{color:var(--acc);}
  .fs-h{font-size:13px; font-weight:800; margin-bottom:3px;}
  .fs-d{font-size:12px; color:var(--muted); line-height:1.55;}
  .fs-warn{font-size:11px; color:var(--dim); line-height:1.6; background:var(--raise);
    border-radius:11px; padding:11px 12px;}

  /* ===== 하단 네비게이션 ===== */
  nav.bottom{position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:center; background:rgba(255,255,255,.86);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--border);}
  nav.bottom .inner{display:flex; width:100%; max-width:520px;}
  nav.bottom button{flex:1; padding:9px 0 calc(8px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10px; font-weight:600; color:var(--dim); white-space:nowrap;}
  nav.bottom button .ic{font-size:18px; opacity:.55;}
  nav.bottom button.sel{color:var(--acc);}
  nav.bottom button.sel .ic{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="h-row">
    <div class="h-left">
      <div class="h-title">체중관리</div>
      <div class="h-date" id="dateStr"></div>
    </div>
    <div class="shift-badge" id="shiftBadge"></div>
    <button class="ic-btn" id="setBtn">⚙</button>
  </div>
  <div class="bar-wrap">
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="bar-txt" id="barTxt">-</div>
  </div>
  <div class="mo-wrap" id="moWrap"></div>
</header>

<main>
  <div class="page on" id="p-today">
    <div id="macroCard"></div>
    <div id="fastCard"></div>
    <div id="todayEditor"></div>
    <div id="fastHist"></div>
  </div>

  <div class="page" id="p-level">
    <div class="card lv-hero">
      <div class="l">LEVEL</div>
      <div class="n" id="lvNum">0</div>
      <div class="g" id="lvGoal"></div>

      <svg class="spark" id="spark" viewBox="0 0 300 130" preserveAspectRatio="none"></svg>
      <div class="hint" style="margin:6px 2px 0">굵은 선이 7일 평균입니다. 하루 오르내림 말고 이 선의 방향만 보세요.</div>
    </div>
    <div class="card streak">
      <div class="n" id="stNum">0</div>
      <div class="t">일 연속 기록 중<br><span style="color:var(--dim)">체중·운동·식단 중 하나라도 남기면 카운트</span></div>
    </div>

  <div class="page" id="p-records">

</main>

<nav class="bottom">
  <div class="inner">
    <button class="sel" data-p="today"><span class="ic">☀️</span>오늘</button>
    <button data-p="level"><span class="ic">🪜</span>레벨</button>
    <button data-p="records"><span class="ic">🗓️</span>기록</button>
    <button data-p="meal"><span class="ic">🍽️</span>식단</button>

<input type="file" id="photoIn" accept="image/*" style="display:none">
<input type="file" id="mvIn" accept="image/*,video/*" multiple style="display:none">
<div id="sheetRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 저장소 ================= */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){}
  try{ if(window.storage) window.storage.set(k,v,false); }catch(e){} }
function jGet(k,d){ try{ const r=lsGet(k); return r?JSON.parse(r):d; }catch(e){ return d; } }
function jSet(k,v){ lsSet(k,JSON.stringify(v)); }

const K_PROF='wl-profile', K_LOG='wl-log', K_TASK='wl-task', K_MEAL='wl-meal';
let prof = jGet(K_PROF, {start:null, goal:null});
let log  = jGet(K_LOG, {});
let tasks= jGet(K_TASK, null);
let meals= jGet(K_MEAL, []);
let photoSynced= jGet('wl-photo-synced', {});
function saveSynced(){ jSet('wl-photo-synced', photoSynced); }
if(!tasks){
  tasks=[{id:'t1',text:'아침 공복 체중 재기'},{id:'t2',text:'물 챙겨 마시기'},{id:'t3',text:'끼니 사진 남기기'}];
  jSet(K_TASK,tasks);
}

/* ================= 날짜 · 근무 ================= */
const DAYS=['일','월','화','수','목','금','토'];
const p2=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parseD=s=>{const[y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd);};
const addD=(s,n)=>{const d=parseD(s); d.setDate(d.getDate()+n); return dkey(d);};
const shortD=s=>`${Number(s.slice(5,7))}/${Number(s.slice(8,10))}`;

const ANCHOR=new Date(2026,6,24); // 2026-07-24 = 주1
const SHIFTS=[
  {n:'주1', c:'sb-ju', pre:['출근 전','05:00~07:00'], post:['퇴근 후','18:00~20:00']},
  {n:'주2', c:'sb-ju', pre:['출근 전','05:00~07:00'], post:['퇴근 후','18:00~20:00']},
  {n:'야간', c:'sb-ya', pre:['출근 전','오전~14:00'], post:['퇴근 후','익일 아침']},
  {n:'비번', c:'sb-bi', pre:['오전','휴무일']        , post:['오후','휴무일']},
];
function shiftIdx(d){
  let ov={};
  try{ ov=JSON.parse(lsGet('shift-overrides-v1'))||{}; }catch(e){}
  const o=ov[dkey(d)];
  if(o!==undefined&&o!==null) return o;
  const a=new Date(ANCHOR.getFullYear(),ANCHOR.getMonth(),ANCHOR.getDate());
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  return ((Math.round((x-a)/86400000)%4)+4)%4;
}
const now=new Date();
const TODAY=dkey(now);

/* ================= 유틸 ================= */
/* 폰의 뒤로가기 제스처로 다이얼로그가 닫히도록 히스토리에 얹는다.
   안 그러면 뒤로가기가 앱 자체를 떠나버린다. */
const ovStack=[];
function showOverlay(ov){
  ovStack.push(ov);
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
  history.pushState({ov:ovStack.length},'');
  const origRemove=ov.remove.bind(ov);
  ov.remove=()=>{
    const i=ovStack.indexOf(ov);
    if(i>-1){
      ovStack.splice(i,1);
      if(!ovStack.length) document.body.style.overflow='';
      if(history.state && history.state.ov) history.back();
    }
    origRemove();
  };
  return ov;
}
window.addEventListener('popstate',()=>{
  const top=ovStack.pop();
  if(top){
    if(!ovStack.length) document.body.style.overflow='';
    Element.prototype.remove.call(top);
  }
});

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* 줄바꿈하면 칸이 같이 늘어나도록 */
function autoGrow(ta){
  if(!ta) return;
  ta.style.height='auto';
  ta.style.height=(ta.scrollHeight+2)+'px';
}
function bindAutoGrow(ta){
  if(!ta) return;
  autoGrow(ta);
  ta.addEventListener('input',()=>autoGrow(ta));
  // 카드가 화면에 그려진 뒤 실제 높이로 한 번 더 맞춘다
  requestAnimationFrame(()=>autoGrow(ta));
}
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900);}
function ask(msg,yes){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg"><div class="dlg-m">${msg}</div>
    <div class="dlg-btns"><button class="dlg-b" data-r="n">취소</button>
    <button class="dlg-b p" data-r="y">확인</button></div></div>`;
  ov.addEventListener('click',e=>{const r=e.target.dataset&&e.target.dataset.r;
    if(r==='y'){ov.remove(); yes();} else if(r==='n'||e.target===ov) ov.remove();});
  showOverlay(ov);
}
function day(k){ if(!log[k]) log[k]={w:null,g:null,ex:{pre:[],post:[]},chk:{}};
  const d=log[k];
  if(!d.ex)d.ex={pre:[],post:[]};
  if(!d.chk)d.chk={};
  // 예전 형식(이름 문자열)을 시간·강도를 담는 객체로 승격
  ['pre','post'].forEach(sl=>{
    d.ex[sl]=(d.ex[sl]||[]).map(x=> typeof x==='string' ? {name:x, min:30, level:1} : x);
  });
  return d; }
function saveLog(){ jSet(K_LOG,log); }
function sortedW(){ return Object.keys(log).filter(k=>log[k].w!=null).sort().map(k=>({d:k,w:log[k].w})); }
function curW(){ const a=sortedW(); return a.length? a[a.length-1].w : prof.start; }
/* 그날 시점의 체중. 과거 기록을 지금 체중으로 계산하면 값이 틀어진다 */
function weightOn(dateKey){
  const a=sortedW();
  if(!a.length) return prof.start;
  let w=null;
  for(const r of a){ if(r.d<=dateKey) w=r.w; else break; }
  return w!=null? w : a[0].w;
}
function hasW(k){ return !!log[k] && log[k].w!=null; }
/* 운동을 누르면 시간·강도를 받는다. 러닝은 거리를 넣으면 페이스로 다시 계산. */
function exSheet(dayObj, dateKey, slot, name, slotLabel, onChange){
  const arr=dayObj.ex[slot];
  const idx=arr.findIndex(x=>exName(x)===name);
  const cur=idx>-1? arr[idx] : null;
  const isRun=name==='러닝';
  const w=weightOn(dateKey);
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg">
    <div class="dlg-t">${slotLabel} · ${name}</div>
    <div class="fld" style="margin-bottom:12px"><label>운동 시간 (분)</label>
      <input id="xMin" type="number" inputmode="numeric" value="${cur?cur.min:''}" placeholder="45"></div>
    ${isRun?`<div class="fld" style="margin-bottom:12px"><label>달린 거리 (km) — 선택</label>
      <input id="xDist" type="number" inputmode="decimal" step="0.1" value="${cur&&cur.dist?cur.dist:''}" placeholder="비우면 강도로 계산"></div>`:''}
    <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px">강도</label>
    <div class="lv-seg" id="xLv">
      ${LEVEL_LABEL.map((l,i)=>`<button data-l="${i}" class="${(cur?cur.level:1)===i?'on':''}">${l}</button>`).join('')}
    </div>
    <div id="xPrev" class="ex-prev"></div>
    <div class="dlg-btns">
      ${cur?'<button class="dlg-b" id="xDel" style="color:var(--red)">기록 삭제</button>':'<button class="dlg-b" data-r="n">취소</button>'}
      <button class="dlg-b p" data-r="y">저장</button></div>
  </div>`;
  let level=cur?cur.level:1;
  const paint=()=>{
    ov.querySelectorAll('#xLv button').forEach(b=>b.classList.toggle('on',+b.dataset.l===level));
    const min=parseInt(ov.querySelector('#xMin').value,10)||0;
    const dist=isRun? (parseFloat(ov.querySelector('#xDist').value)||0) : 0;
    const kc=exKcal({name,min,level,dist}, w);
    const p=ov.querySelector('#xPrev');
    if(!w){ p.innerHTML='<span class="mut">체중을 먼저 기록해야 계산됩니다.</span>'; return; }
    if(!min){ p.innerHTML='<span class="mut">시간을 입력하면 소비 칼로리가 계산됩니다.</span>'; return; }
    const pace = (isRun&&dist>0)? ` · ${(min/dist).toFixed(1)}분/km` : '';
    p.innerHTML=`<b>${kc.toLocaleString()}</b> kcal 소비<span class="mut"> · ${w}kg 기준${pace}</span>`;
  };
  ov.querySelector('#xMin').addEventListener('input',paint);
  if(isRun) ov.querySelector('#xDist').addEventListener('input',paint);
  ov.querySelector('#xLv').addEventListener('click',e=>{
    if(e.target.dataset.l!==undefined){ level=+e.target.dataset.l; paint(); }
  });
  const delBtn=ov.querySelector('#xDel');
  if(delBtn) delBtn.onclick=()=>{
    arr.splice(idx,1); saveLog(); ov.remove(); toast('삭제됨'); onDataChanged(); onChange();
  };
  ov.addEventListener('click',e=>{
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='y'){
      const min=parseInt(ov.querySelector('#xMin').value,10)||0;
      if(!min){ toast('운동 시간을 입력하세요'); return; }
      const dist=isRun? (parseFloat(ov.querySelector('#xDist').value)||0) : 0;
      const rec={name, min, level}; if(dist>0) rec.dist=dist;
      if(idx>-1) arr[idx]=rec; else arr.push(rec);
      saveLog(); ov.remove(); toast(`${slotLabel} ${name} ${min}분`);
      onDataChanged(); onChange();
    } else if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);
  paint();
}

function exName(x){ return typeof x==='string' ? x : (x&&x.name); }
function exOf(k){ const d=log[k]; if(!d||!d.ex) return []; return [...(d.ex.pre||[]),...(d.ex.post||[])]; }
function hasEx(k){ return exOf(k).length>0; }
function hasMeal(k){ return meals.some(m=>m.d===k); }
function hasAny(k){ return hasW(k)||hasEx(k)||hasMeal(k)||(log[k]&&Object.keys(log[k].chk||{}).length>0); }

/* ================= IndexedDB (사진) ================= */
let _db=null;
function db(){
  if(_db) return _db;
  _db=new Promise((res,rej)=>{
    try{
      const rq=indexedDB.open('wlPhotos',1);
      rq.onupgradeneeded=()=>{const d=rq.result;
        if(!d.objectStoreNames.contains('p')) d.createObjectStore('p',{keyPath:'key'});};
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
    }catch(e){rej(e);}
  });
  return _db;
}
async function phPut(r){const d=await db(); return new Promise((res,rej)=>{
  const tx=d.transaction('p','readwrite'); tx.objectStore('p').put(r);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});}
async function phDel(k){const d=await db(); return new Promise((res,rej)=>{
  const tx=d.transaction('p','readwrite'); tx.objectStore('p').delete(k);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});}
async function phAll(){const d=await db(); return new Promise((res,rej)=>{
  const out={}; const tx=d.transaction('p','readonly');
  const c=tx.objectStore('p').openCursor();
  c.onsuccess=e=>{const cu=e.target.result; if(cu){out[cu.value.key]=cu.value.data; cu.continue();} else res(out);};
  c.onerror=()=>rej(c.error);});}
let phCache={};
/* 동영상은 Blob으로 보관한다(base64로 들고 있으면 메모리가 터진다).
   화면에 붙일 때만 objectURL을 만들어 캐시한다. */
const blobURLs={};
function mediaURL(key, remote){
  const v=phCache[key];
  if(v instanceof Blob){
    if(!blobURLs[key]) blobURLs[key]=URL.createObjectURL(v);
    return blobURLs[key];
  }
  return v || remote || '';
}
/* 옛 형식(사진 1장 = v.key)을 media 배열로 통일 */
function mvMedia(v){
  if(Array.isArray(v.media)) return v.media;
  if(v.key) return [{key:v.key, type:'image', remote:v.url2||null}];
  return [];
}
function compress(file,maxW,q){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const sc=img.width>maxW?maxW/img.width:1;
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',q));
      };
      img.onerror=rej; img.src=ev.target.result;
    };
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}
let pendingAdd=null; // {d, slot}
document.getElementById('photoIn').addEventListener('change', async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value='';
  if(!f) return;
  if(!pendingAdd) return;
  const {d,slot}=pendingAdd; pendingAdd=null;
  try{
    const data=await compress(f,900,.8);
    const key='m'+Date.now().toString(36);
    await phPut({key,data}); phCache[key]=data;
    meals.unshift({id:key, d, slot, memo:'', key});
    jSet(K_MEAL,meals);
    toast(`${slot} 기록됨`);
    onDataChanged();
  }catch(err){ toast('사진 저장 실패'); }
});

function monthCount(name){
  const mk=`${now.getFullYear()}-${p2(now.getMonth()+1)}`;
  let c=0;
  Object.keys(log).forEach(k=>{
    if(!k.startsWith(mk)) return;
    if(exOf(k).some(x=>exName(x)===name)) c++;

}

/* ================= 하루 기록 편집기 (오늘 탭 + 기록 시트 공용) ================= */
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>';
const EX=[['헬스','🏋️'],['수영','🏊'],['인클라인','🚶'],['러닝','🏃']];

/* ===== 운동 소모 칼로리 =====
   kcal = MET × 3.5 × 체중(kg) ÷ 200 × 분
   헬스는 부위보다 강도(쉬는 시간·중량)가 소모량을 가르므로 강도 3단계로 받는다.
   러닝은 거리를 넣으면 실제 속도로 MET를 다시 잡는다. */
const MET={
  '헬스':    [3.5, 5.0, 6.0],
  '수영':    [5.8, 8.3, 10.0],
  '인클라인':[5.3, 7.0, 8.5],
  '러닝':    [7.0, 9.8, 11.5],
};
const LEVEL_LABEL=['가볍게','보통','빡세게'];
const RUN_TABLE=[[6.4,6.0],[8.0,8.3],[9.7,9.8],[11.3,11.0],[12.9,11.8],[14.5,12.8]];
function runMET(kmh){
  if(kmh<=RUN_TABLE[0][0]) return RUN_TABLE[0][1];
  for(let i=1;i<RUN_TABLE.length;i++){
    const [s1,m1]=RUN_TABLE[i-1], [s2,m2]=RUN_TABLE[i];
    if(kmh<=s2) return m1+(m2-m1)*((kmh-s1)/(s2-s1));
  }
  return RUN_TABLE[RUN_TABLE.length-1][1];
}
function exKcal(item, weight){
  if(!item || !item.min || !weight) return 0;
  const name=exName(item);
  let met=(MET[name]||MET['헬스'])[item.level??1];
  if(name==='러닝' && item.dist>0 && item.min>0) met=runMET(item.dist/(item.min/60));
  // 가만히 있어도 타는 몫(MET 1)은 빼야 '운동으로 더 쓴 칼로리'가 된다
  return Math.round(Math.max(0,met-1)*3.5*weight/200*item.min);
}
function dayBurn(dateKey){
  const w=weightOn(dateKey);
  if(!w) return {kcal:0,items:[]};
  const items=exOf(dateKey);
  return {kcal:items.reduce((s,x)=>s+exKcal(x,w),0), items};
}
const SLOTS=['아침','점심','저녁','간식'];

function renderDayEditor(container, dateKey){
  container.innerHTML='';
  const d=day(dateKey);
  const isToday = dateKey===TODAY;

  /* --- 체중/혈당 --- */
  const wc=document.createElement('div'); wc.className='card';
  const prevIdx = sortedW().filter(x=>x.d<dateKey);
  const prevW = prevIdx.length? prevIdx[prevIdx.length-1].w : null;
  let deltaHtml='';
  if(d.w!=null && prevW!=null){
    const diff=prevW-d.w;
    deltaHtml=`<span class="delta ${diff>=0?'dn':'up'}">${diff>=0?'−':'+'}${Math.abs(diff).toFixed(1)}kg</span>`;
  }
  wc.innerHTML=`
    <div class="w-now">
      <span class="big">${d.w!=null? d.w.toFixed(1):'--'}</span>${deltaHtml}
      <span class="sub">${isToday?'오늘':shortD(dateKey)+' 기록'}</span>
    </div>
    <div class="w-row">
      <div class="fld"><label>체중 kg</label><input class="inW" type="number" inputmode="decimal" step="0.1" placeholder="0.0" value="${d.w!=null?d.w:''}"></div>
      <div class="fld"><label>혈당 mg/dL</label><input class="inG" type="number" inputmode="decimal" placeholder="선택" value="${d.g!=null?d.g:''}"></div>
      <button class="save-btn">체중 기록</button>
    </div>`;
  wc.querySelector('.save-btn').onclick=()=>{
    const w=parseFloat(wc.querySelector('.inW').value);
    const g=parseFloat(wc.querySelector('.inG').value);
    if(!w){ toast('체중을 입력하세요'); return; }
    d.w=w; d.g=isNaN(g)?null:g;
    if(prof.start==null){ prof.start=w; jSet(K_PROF,prof); }
    saveLog(); toast('기록됨'); onDataChanged(); renderDayEditor(container,dateKey);
  };
  container.appendChild(wc);

  /* --- 운동 --- */
  const sh=SHIFTS[shiftIdx(parseD(dateKey))];
  const ec=document.createElement('div'); ec.className='card';
  const wNow=weightOn(dateKey);
  [['pre',sh.pre],['post',sh.post]].forEach(([slot,label])=>{
    const t=document.createElement('div'); t.className='slot-t';
    t.innerHTML=`${label[0]}<span>${label[1]}</span>`;
    const row=document.createElement('div'); row.className='ex-row';
    EX.forEach(([name,em])=>{
      const item=d.ex[slot].find(x=>exName(x)===name);
      const b=document.createElement('button');
      b.className='ex'+(item?' on':'');
      const kc=item? exKcal(item,wNow):0;
      b.innerHTML=`<span class="em">${em}</span>${name}`
        + (item? `<span class="ex-sub">${item.min}분${kc?` · ${kc}`:''}</span>` : '');
      b.onclick=()=>exSheet(d, dateKey, slot, name, label[0], ()=>renderDayEditor(container,dateKey));
      row.appendChild(b);
    });
    ec.appendChild(t); ec.appendChild(row);
  });
  const burn=dayBurn(dateKey);
  if(burn.kcal){
    const tot=document.createElement('div'); tot.className='ex-total';
    tot.innerHTML=`오늘 소비 <b>${burn.kcal.toLocaleString()}kcal</b>`;
    ec.appendChild(tot);
  } else if(!wNow){
    const warn=document.createElement('div'); warn.className='ex-total mut';
    warn.textContent='체중을 먼저 기록하면 운동 소비 칼로리가 계산됩니다.';
    ec.appendChild(warn);
  }
  container.appendChild(document.createElement('div')).className='sec-t';
  container.lastChild.textContent='운동';
  container.appendChild(ec);

  /* --- 체크리스트 --- */
  const cc=document.createElement('div'); cc.className='card';
  const list=document.createElement('div');
  if(!tasks.length){ list.innerHTML='<div class="empty" style="padding:20px 8px">항목이 없습니다.<br>아래에서 추가하세요.</div>'; }
  tasks.forEach(t=>{
    const done=!!d.chk[t.id];
    const row=document.createElement('div'); row.className='chk-row'+(done?' done':'');
    row.innerHTML=`<div class="box">${CK}</div><div class="chk-txt">${esc(t.text)}</div>
      <button class="chk-edit">✎</button><button class="chk-del">✕</button>`;
    // 체크 하나 누를 때 화면을 통째로 다시 그리면 스크롤이 튀고 사진까지 다시 로드된다.
    // 해당 줄만 즉시 바꾸고, 무거운 갱신은 헤더·백업만 돌린다.
    let on=done;
    const toggle=()=>{
      on=!on;
      if(on) d.chk[t.id]=true; else delete d.chk[t.id];
      row.classList.toggle('done',on);
      saveLog(); renderHead(); ghAutoBackupSoon();
    };
    row.querySelector('.chk-txt').onclick=toggle;
    row.querySelector('.box').onclick=toggle;
    row.querySelector('.chk-edit').onclick=()=>{
      const cur=t.text;
      row.innerHTML=`<input class="chk-input" type="text" value="${esc(cur)}">
        <button class="chk-ok">저장</button><button class="chk-cancel">취소</button>`;
      const ipt=row.querySelector('.chk-input');
      ipt.focus(); ipt.setSelectionRange(cur.length,cur.length);
      const commit=()=>{
        const v=ipt.value.trim();
        if(!v){ toast('내용을 입력하세요'); ipt.focus(); return; }
        t.text=v; jSet(K_TASK,tasks); toast('수정됨');
        onDataChanged(); renderDayEditor(container,dateKey);
      };
      row.querySelector('.chk-ok').onclick=commit;
      row.querySelector('.chk-cancel').onclick=()=>renderDayEditor(container,dateKey);
      ipt.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); });
    };
    row.querySelector('.chk-del').onclick=()=>ask(`"${esc(t.text)}"\n항목을 삭제할까요? (모든 날짜에서 사라집니다)`,()=>{
      tasks=tasks.filter(x=>x.id!==t.id); jSet(K_TASK,tasks); toast('삭제됨');
      onDataChanged(); renderDayEditor(container,dateKey);
    });
    list.appendChild(row);
  });
  cc.appendChild(list);
  const addRow=document.createElement('div'); addRow.className='add-row';
  addRow.innerHTML=`<input type="text" placeholder="항목 추가 (예: 계단 10층)"><button>＋</button>`;

  const doAdd=()=>{ const v=inp.value.trim(); if(!v){inp.focus();return;}
    tasks.push({id:'t'+Date.now().toString(36),text:v}); jSet(K_TASK,tasks);
    onDataChanged(); renderDayEditor(container,dateKey); };
  addRow.querySelector('button').onclick=doAdd;

  }

  /* --- 식단 --- */
  const mc=document.createElement('div'); mc.className='card';
  const addRow2=document.createElement('div'); addRow2.className='meal-add';

    b.onclick=()=>slotChoice(dateKey, s, ()=>renderDayEditor(container,dateKey));
    addRow2.appendChild(b);
  });
  mc.appendChild(addRow2);
  const dayMeals=meals.filter(m=>m.d===dateKey);
  if(!dayMeals.length){
    const e=document.createElement('div'); e.className='empty'; e.style.padding='18px 8px';
    e.textContent='이 날 식단 기록이 없습니다.'; mc.appendChild(e);
  } else {
    dayMeals.forEach(m=>mc.appendChild(buildMealCard(m,()=>renderDayEditor(container,dateKey))));
  }
  container.appendChild(document.createElement('div')).className='sec-t';
  container.lastChild.textContent='식단';
  container.appendChild(mc);
}

/* 채팅에서 받은 분석 결과를 붙여넣으면 숫자만 뽑아서 정리 */
function parseNutrition(text){
  const num=(re)=>{ const mm=text.match(re); return mm? Math.round(parseFloat(mm[1])) : null; };
  const kcal    = num(/([\d,]+(?:\.\d+)?)\s*(?:kcal|칼로리|킬로칼로리)/i);
  const protein = num(/단백질[^\d]{0,6}([\d.]+)/);
  const fat     = num(/지방[^\d]{0,6}([\d.]+)/);
  const carbs   = num(/(?:탄수화물|탄수)[^\d]{0,6}([\d.]+)/);
  const fiber   = num(/(?:식이섬유|섬유질)[^\d]{0,6}([\d.]+)/);
  let food=null;
  const fm=text.match(/^\s*(?:음식\s*[:：]\s*)?([^\n·,(]{1,20}?)\s*(?:·|,|\(|\n|약|\d)/);
  if(fm) food=fm[1].trim().replace(/[\s\-–—:：]+$/,'');
  if(kcal==null && protein==null && fat==null && carbs==null && fiber==null) return null;
  return {food:food||null, kcal, protein, fat, carbs, fiber};
}
function pasteSheet(m,onChange){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg">
    <div class="dlg-t">분석 결과 붙여넣기</div>

      칼로리·단백질·지방·탄수만 뽑아서 정리해 줍니다.</div>
    <textarea id="pTxt" rows="5" placeholder="예) 김치찌개 · 약 450kcal, 단백질 28g, 지방 18g, 탄수화물 40g"
      style="width:100%;padding:12px;border-radius:11px;border:1.5px solid transparent;background:var(--raise);color:var(--text);font-size:14px;line-height:1.6;outline:none;resize:none;overflow:hidden;font-family:inherit">${esc(m.rawPaste||'')}</textarea>
    <div id="pPrev" style="margin-top:11px"></div>
    <div class="dlg-btns"><button class="dlg-b" data-r="n">취소</button>
      <button class="dlg-b p" data-r="y">정리해서 저장</button></div>
  </div>`;
  const ta=ov.querySelector('#pTxt');
  const prev=ov.querySelector('#pPrev');
  bindAutoGrow(ta);
  const paint=()=>{
    const n=parseNutrition(ta.value);
    prev.innerHTML = n
      ? `<div class="calc-card" style="margin-bottom:0;padding:13px">
          <div class="calc-top"><span class="t">${esc(n.food||'인식된 값')}</span></div>
          <div class="calc-kcal" style="font-size:24px;margin:2px 0 10px">${n.kcal?n.kcal.toLocaleString():'—'}<small>kcal</small></div>
          <div class="calc-grid" style="grid-template-columns:repeat(3,1fr)">
            <div><b>${n.protein??'—'}g</b><span>단백질</span></div>
            <div><b>${n.fat??'—'}g</b><span>지방</span></div>
            <div><b>${n.carbs??'—'}g</b><span>탄수</span></div>
          </div></div>`
      : `<div style="font-size:11.5px;color:var(--dim);padding:2px">숫자를 찾지 못했습니다. kcal·단백질·지방·탄수가 들어간 문장을 붙여넣어 보세요.</div>`;
  };
  ta.addEventListener('input',paint);
  ov.addEventListener('click',e=>{
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='y'){
      const n=parseNutrition(ta.value);
      if(!n){ toast('인식할 숫자가 없습니다'); return; }
      m.nut=n; m.rawPaste=ta.value.trim();
      if(!m.memo && n.food) m.memo=n.food;
      jSet(K_MEAL,meals); ov.remove(); toast('정리 완료');
      ghAutoBackupSoon(); onDataChanged(); onChange();
    } else if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);

/* ================= 레벨 ================= */
const LV_MAX=10;
function levelInfo(){
  if(prof.start==null||prof.goal==null) return null;
  const span=Math.max(.1, prof.start-prof.goal);
  const per=span/LV_MAX;
  const w=curW();
  const lost=Math.max(0, prof.start-w);
  const lv=Math.max(0, Math.min(LV_MAX, Math.floor(lost/per)));
  return {span,per,w,lost,lv};
}
function renderLevel(){
  const info=levelInfo();
  const ld=document.getElementById('ladder');
  if(!info){
    document.getElementById('lvNum').textContent='–';
    document.getElementById('lvGoal').innerHTML='⚙에서 시작 체중과 목표 체중을 먼저 넣어주세요.';
    ld.innerHTML=''; renderSpark(); renderStreak(); renderMonthStats(); return;
  }
  document.getElementById('lvNum').textContent=info.lv;
  const nextW = info.lv>=LV_MAX ? null : prof.start-(info.lv+1)*info.per;
  document.getElementById('lvGoal').innerHTML = info.lv>=LV_MAX
    ? `목표 <b>${prof.goal.toFixed(1)}kg</b> 도달 🎉`
    : `다음 단계까지 <b>${(info.w-nextW).toFixed(1)}kg</b><br><span style="font-size:11.5px;color:var(--dim)">LV.${info.lv+1} = ${nextW.toFixed(1)}kg</span>`;
  ld.innerHTML='';
  for(let i=1;i<=LV_MAX;i++){
    const target=prof.start-i*info.per;
    const done=info.lv>=i, cur=info.lv+1===i;
    const step=document.createElement('div'); step.className='step'+(done?' done':'')+(cur?' cur':'');
    step.innerHTML=`<div class="rail"><div class="rail-line"></div><div class="led ${done?'done':(cur?'cur':'')}"></div></div>
      <div class="step-card"><span class="step-lv">LV.${i}</span><span class="step-w">${target.toFixed(1)}kg</span>
      ${cur?'<span class="step-tag cur">다음</span>':''}${i===LV_MAX?'<span class="step-tag goal">목표</span>':''}</div>`;
    ld.appendChild(step);
  }
  renderSpark(); renderStreak(); renderMonthStats();
}
function renderMonthStats(){
  const el=document.getElementById('monthStats');
  if(!el) return;
  const mk=`${now.getFullYear()}-${p2(now.getMonth()+1)}`;
  let days=0, burn=0;
  const ws=[];
  Object.keys(log).sort().forEach(k=>{
    if(!k.startsWith(mk)) return;
    if(hasEx(k)){ days++; burn+=dayBurn(k).kcal; }
    if(log[k].w!=null) ws.push(log[k].w);
  });
  const delta = ws.length>=2 ? ws[ws.length-1]-ws[0] : null;
  el.innerHTML=`<div class="ms-grid">
    <div><b>${days}</b><span>운동한 날</span></div>
    <div><b>${burn.toLocaleString()}</b><span>총 소비 kcal</span></div>
    <div><b class="${delta!=null&&delta<0?'dn':(delta!=null&&delta>0?'up':'')}">${
      delta!=null? (delta<=0?'−':'+')+Math.abs(delta).toFixed(1) : '—'
    }</b><span>체중 변화 kg</span></div>
  </div>`;
}

function renderSpark(){
  const svg=document.getElementById('spark');
  const rows=sortedW().slice(-30);
  if(rows.length<2){
    svg.innerHTML='<text x="150" y="68" text-anchor="middle" fill="#AEAEB2" font-size="12">체중을 2번 이상 기록하면 선이 그려집니다</text>';
    return;
  }
  const ws=rows.map(r=>r.w);
  const mn=Math.min(...ws)-.6, mx=Math.max(...ws)+.6;
  const X=i=>10+i*(280/(rows.length-1));
  const Y=w=>120-((w-mn)/(mx-mn))*105;
  const ma=rows.map((_,i)=>{ const win=rows.slice(Math.max(0,i-6),i+1); return win.reduce((s,x)=>s+x.w,0)/win.length; });
  const path=a=>a.map((w,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(w).toFixed(1)}`).join(' ');
  svg.innerHTML=`
    <path d="${path(ws)}" fill="none" stroke="#E3E3E8" stroke-width="1.5"/>
    <path d="${path(ma)}" fill="none" stroke="#30D158" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${ws.map((w,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(w).toFixed(1)}" r="2.2" fill="#6E6E73"/>`).join('')}
    <text x="10" y="12" fill="#AEAEB2" font-size="10">${mx.toFixed(1)}</text>
    <text x="10" y="128" fill="#AEAEB2" font-size="10">${mn.toFixed(1)}</text>`;
}
function renderStreak(){
  let n=0,k=TODAY;
  if(!hasAny(k)) k=addD(k,-1);
  while(hasAny(k)){ n++; k=addD(k,-1); }
  document.getElementById('stNum').textContent=n;
}

let recMode='month';
let recCal=new Date(); recCal.setDate(1);
let recWeekStart=(()=>{const x=new Date(); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x;})();

document.querySelectorAll('.rec-seg button').forEach(b=>b.onclick=()=>{

document.getElementById('recPrev').onclick=()=>{

  renderRecords();
};
document.getElementById('recNext').onclick=()=>{
  if(recMode==='month'){ recCal.setMonth(recCal.getMonth()+1); } else { recWeekStart.setDate(recWeekStart.getDate()+7); }
  renderRecords();
};
document.getElementById('recToday').onclick=()=>{
  if(recMode==='month'){ recCal=new Date(); recCal.setDate(1); }
  else { recWeekStart=new Date(); recWeekStart.setDate(recWeekStart.getDate()-recWeekStart.getDay()); recWeekStart.setHours(0,0,0,0); }

function renderRecords(){
  const area=document.getElementById('recArea');
  area.innerHTML='';
  if(recMode==='month'){
    document.getElementById('recLabel').textContent=`${recCal.getFullYear()}년 ${recCal.getMonth()+1}월`;
    const dow=document.createElement('div'); dow.className='dow';
    dow.innerHTML=DAYS.map(d=>`<span>${d}</span>`).join('');
    area.appendChild(dow);
    const grid=document.createElement('div'); grid.className='cal-grid';
    const first=new Date(recCal.getFullYear(),recCal.getMonth(),1);
    const start=new Date(first); start.setDate(1-first.getDay());
    for(let i=0;i<42;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      if(i>=35 && d.getMonth()!==recCal.getMonth()) break;
      const k=dkey(d);
      const inMonth=d.getMonth()===recCal.getMonth();
      const isToday=k===TODAY;
      const wknd=d.getDay()===0||d.getDay()===6;
      const cell=document.createElement('div');
      cell.className='cell'+(inMonth?'':' out')+(isToday?' today':'')+(wknd?' wknd':'');
      const dots=[hasW(k)?'<i class="dot w"></i>':'', hasEx(k)?'<i class="dot e"></i>':'', hasMeal(k)?'<i class="dot m"></i>':''].join('');
      cell.innerHTML=`<span class="dnum">${d.getDate()}</span><div class="dots">${dots}</div>`;
      cell.onclick=()=>openDaySheet(k);
      grid.appendChild(cell);
    }
    area.appendChild(grid);
  } else {
    const end=new Date(recWeekStart); end.setDate(end.getDate()+6);
    document.getElementById('recLabel').textContent=`${recWeekStart.getMonth()+1}/${recWeekStart.getDate()} ~ ${end.getMonth()+1}/${end.getDate()}`;
    const list=document.createElement('div'); list.className='week-list';
    for(let i=0;i<7;i++){
      const d=new Date(recWeekStart); d.setDate(d.getDate()+i);
      const k=dkey(d);
      const isToday=k===TODAY, wknd=d.getDay()===0||d.getDay()===6;
      const ld=log[k];
      const mCount=meals.filter(m=>m.d===k).length;
      const exList=exOf(k);
      const exChips=exList.map(x=>{
        const nm=exName(x);
        const mins=(typeof x==='object'&&x.min)? x.min : null;
        return mins? `${nm} ${mins}분` : nm;
      });
      const burnK=dayBurn(k).kcal;
      const card=document.createElement('div'); card.className='wk-card'+(isToday?' today':'')+(wknd?' wknd':'');
      card.innerHTML=`
        <div class="wk-d"><div class="dow2">${DAYS[d.getDay()]}</div><div class="num2">${d.getDate()}</div></div>
        <div class="wk-mid">
          <div class="wk-w ${ld&&ld.w!=null?'':'none'}">${ld&&ld.w!=null? ld.w.toFixed(1)+'kg' : '기록 없음'}</div>
          <div class="wk-chips">
            ${exChips.map(x=>`<span class="wk-chip e">${x}</span>`).join('')}
            ${burnK?`<span class="wk-chip b">-${burnK}kcal</span>`:''}
            ${mCount?`<span class="wk-chip m">식단 ${mCount}</span>`:''}
          </div>
        </div>
        <span class="wk-go">›</span>`;
      card.onclick=()=>openDaySheet(k);
      list.appendChild(card);
    }
    area.appendChild(list);
  }
}

let motiv = jGet('wl-motiv', []);   // [{id,d,key?,note,url}]

function mvAdd(entry){
  motiv.unshift(entry); jSet('wl-motiv',motiv); renderMotiv(); ghAutoBackupSoon();

let mvTarget=null;  // 기존 카드에 추가할 때 그 카드
const VID_MAX=60*1024*1024;
document.getElementById('mvPhoto').onclick=()=>{
  mvTarget=null; document.getElementById('mvIn').click();
};
document.getElementById('mvIn').addEventListener('change', async e=>{
  const files=[...(e.target.files||[])]; e.target.value='';
  if(!files.length) return;
  const target=mvTarget; mvTarget=null;
  const added=[];
  for(const f of files){
    try{
      const isVid=/^video\//.test(f.type);
      const key=(isVid?'vv':'vp')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      if(isVid){
        if(f.size>VID_MAX){ toast('너무 큰 영상은 건너뜀'); continue; }
        await phPut({key, data:f});           // 영상은 Blob 그대로
        phCache[key]=f;
        added.push({key, type:'video', size:f.size});
      } else {
        const data=await compress(f,1400,.82); // 사진은 압축해서 dataURL
        await phPut({key, data});
        phCache[key]=data;
        added.push({key, type:'image'});
      }
    }catch(err){ /* 개별 파일 실패는 건너뛴다 */ }
  }
  if(!added.length){ toast('추가 실패'); return; }
  if(target){
    target.media=[...mvMedia(target), ...added];
    delete target.key; delete target.url2;

/* 여러 장을 좌우로 넘기는 캐러셀. 탭(좌/우 절반) + 스와이프 모두 지원 */
function buildCarousel(mediaList, onOpen){
  const wrap=document.createElement('div'); wrap.className='mv-car';
  let i=0;
  const track=document.createElement('div'); track.className='mv-track';
  mediaList.forEach(md=>{
    const cell=document.createElement('div'); cell.className='mv-cell';
    if(md.type==='video'){
      const v=document.createElement('video');
      v.src=mediaURL(md.key, md.remote); v.controls=true; v.playsInline=true; v.preload='metadata';
      cell.appendChild(v);
    } else {
      const im=document.createElement('img');
      im.src=mediaURL(md.key, md.remote); im.loading='lazy';
      im.onclick=()=>onOpen(i);
      cell.appendChild(im);
    }
    track.appendChild(cell);
  });
  wrap.appendChild(track);

  const multi=mediaList.length>1;
  let dots=null;
  if(multi){
    dots=document.createElement('div'); dots.className='mv-dots';
    mediaList.forEach(()=>dots.appendChild(document.createElement('i')));
    wrap.appendChild(dots);
    const cnt=document.createElement('div'); cnt.className='mv-count';
    wrap.appendChild(cnt);
    const prev=document.createElement('button'); prev.className='mv-nav l'; prev.textContent='‹';
    const next=document.createElement('button'); next.className='mv-nav r'; next.textContent='›';
    wrap.appendChild(prev); wrap.appendChild(next);
    prev.onclick=e=>{e.stopPropagation(); go(i-1);};
    next.onclick=e=>{e.stopPropagation(); go(i+1);};
    const paint=()=>{
      track.style.transform=`translateX(${-i*100}%)`;
      [...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i));
      cnt.textContent=`${i+1} / ${mediaList.length}`;
      prev.style.visibility=i===0?'hidden':'visible';
      next.style.visibility=i===mediaList.length-1?'hidden':'visible';
    };
    var go=n=>{ i=Math.max(0,Math.min(mediaList.length-1,n)); paint(); };
    // 스와이프
    let x0=null,y0=null;
    wrap.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
    wrap.addEventListener('touchend',e=>{
      if(x0==null) return;
      const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
      if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) go(dx<0? i+1 : i-1);
      x0=null;
    },{passive:true});
    paint();
  }
  return wrap;
}

/* 전체화면 보기 — 여기서도 좌우로 넘길 수 있다 */
function openLightbox(mediaList, start){
  let i=start||0;
  const ov=document.createElement('div'); ov.className='lb';
  const stage=document.createElement('div'); stage.className='lb-stage';
  const cnt=document.createElement('div'); cnt.className='lb-count';
  ov.appendChild(stage); ov.appendChild(cnt);
  const paint=()=>{
    const md=mediaList[i];
    stage.innerHTML = md.type==='video'
      ? `<video src="${mediaURL(md.key,md.remote)}" controls playsinline autoplay></video>`
      : `<img src="${mediaURL(md.key,md.remote)}">`;
    cnt.textContent = mediaList.length>1 ? `${i+1} / ${mediaList.length}` : '';
  };
  const go=n=>{ i=(n+mediaList.length)%mediaList.length; paint(); };
  ov.onclick=e=>{
    if(e.target.tagName==='VIDEO') return;
    if(mediaList.length>1){
      const r=ov.getBoundingClientRect();
      const rel=(e.clientX-r.left)/r.width;
      if(rel<0.3){ go(i-1); return; }
      if(rel>0.7){ go(i+1); return; }
    }
    ov.remove();
  };
  let x0=null;
  ov.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  ov.addEventListener('touchend',e=>{
    if(x0==null) return;
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>40){ go(dx<0? i+1 : i-1); }
    x0=null;
  },{passive:true});
  paint(); showOverlay(ov);
}

/* 꾹 누르면 카드를 집어서 위아래로 옮긴다 */
let dragItem=null, dragEl=null, dragTimer=null;
function bindLongPressDrag(card, v){
  const start=e=>{
    if(e.target.closest('button,textarea,a,video,input')) return;
    const pt=e.touches? e.touches[0] : e;
    dragTimer=setTimeout(()=>{
      dragItem=v; dragEl=card;
      card.classList.add('dragging');
      if(navigator.vibrate) navigator.vibrate(30);
      document.body.style.overflow='hidden';
    },420);
    card._sy=pt.clientY;
  };
  const move=e=>{
    const pt=e.touches? e.touches[0] : e;
    if(!dragEl){
      if(Math.abs(pt.clientY-card._sy)>10){ clearTimeout(dragTimer); }
      return;
    }
    if(dragEl!==card) return;
    e.preventDefault();
    const list=document.getElementById('mvList');
    const cards=[...list.querySelectorAll('.mv-card')];
    const over=cards.find(c=>{
      if(c===card) return false;
      const r=c.getBoundingClientRect();
      return pt.clientY>r.top && pt.clientY<r.bottom;
    });
    if(over){
      const r=over.getBoundingClientRect();
      const after=pt.clientY > r.top+r.height/2;
      list.insertBefore(card, after? over.nextSibling : over);
    }
  };
  const end=()=>{
    clearTimeout(dragTimer);
    if(!dragEl || dragEl!==card) return;
    card.classList.remove('dragging');
    document.body.style.overflow='';
    // 화면에 보이는 순서를 그대로 데이터에 반영
    const order=[...document.querySelectorAll('#mvList .mv-card')].map(c=>c.dataset.mid);
    motiv.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
    mvSort(); jSet('wl-motiv',motiv); ghAutoBackupSoon();
    dragItem=null; dragEl=null;
    renderMotiv(); toast('순서 변경됨');
  };
  card.addEventListener('touchstart',start,{passive:true});
  card.addEventListener('touchmove',move,{passive:false});
  card.addEventListener('touchend',end);
  card.addEventListener('touchcancel',end);
  card.addEventListener('mousedown',start);
  card.addEventListener('mousemove',move);
  card.addEventListener('mouseup',end);
  card.addEventListener('mouseleave',()=>clearTimeout(dragTimer));
}

/* 하루 영양 요약 카드.
   단백질·지방·식이섬유는 초과해도 괜찮으니 초과=초록, 부족=주황.
   탄수화물은 초과하면 안 되므로 초과=빨강, 여유 있으면 초록.
   칼로리는 순 칼로리(섭취−운동) 기준, 초과=주황. */
function buildDaySummary(dateKey){
  const mt=prof.macroTarget;
  const wrap=document.createElement('div'); wrap.className='sum-card';
  const it=dayIntake(dateKey);
  const isToday=dateKey===TODAY;
  const dt=parseD(dateKey);
  const head=`<div class="sum-head">
      <span class="sum-day">${isToday?'오늘':`${dt.getMonth()+1}월 ${dt.getDate()}일`}</span>
      ${it.fasting?`<span class="sum-fast">공복 ${it.fastedSlots.join('·')}</span>`:''}
      <span class="sum-meta">${it.n?`${it.n}끼 기록`:'기록 없음'}</span>
    </div>`;
  if(!mt){
    wrap.innerHTML=head+`<div class="sum-none">⚙ 설정 → 칼로리 계산기로 목표를 먼저 정하면
      여기에 부족·초과가 계산되어 표시됩니다.</div>`;
    return wrap;
  }
  const bn=dayBurn(dateKey);
  const net=it.kcal-bn.kcal;
  const rows=[
    {name:'칼로리', got:net,        tgt:mt.kcal,    unit:'kcal', overBad:'warn'},
    {name:'단백질', got:it.protein, tgt:mt.protein, unit:'g',    overBad:'good'},
    {name:'지방',   got:it.fat,     tgt:mt.fat,     unit:'g',    overBad:'good'},
    {name:'탄수',   got:it.carbs,   tgt:mt.carbs,   unit:'g',    overBad:'bad'},
    {name:'식이섬유',got:it.fiber,  tgt:mt.fiber,   unit:'g',    overBad:'good'},
  ];
  const eq=`<div class="sum-eq">
      <span>섭취 <b>${it.kcal.toLocaleString()}</b></span>
      <span class="op">−</span>
      <span>운동 <b class="burn">${bn.kcal.toLocaleString()}</b></span>
      <span class="op">=</span>
      <span class="tot">${net.toLocaleString()}<em>kcal</em></span>
    </div>`;
  wrap.innerHTML = head + eq + rows.map(r=>{
    const diff=r.got-r.tgt;
    const pct=Math.max(0, Math.min(100, r.tgt? Math.round(r.got/r.tgt*100):0));
    let tag,tone,fill;
    if(diff>0){
      tag=`+${Math.abs(diff).toLocaleString()}${r.unit==='kcal'?'':'g'} 초과`;
      tone = r.overBad==='good' ? 't-good' : (r.overBad==='bad' ? 't-bad' : 't-warn');
      fill = r.overBad==='good' ? 'f-good' : (r.overBad==='bad' ? 'f-bad' : 'f-warn');
    } else if(diff<0){
      tag=`−${Math.abs(diff).toLocaleString()}${r.unit==='kcal'?'':'g'} 부족`;
      tone = r.overBad==='bad' ? 't-good' : 't-warn';
      fill = r.overBad==='bad' ? 'f-good' : 'f-warn';
    } else {
      tag='딱 맞음'; tone='t-good'; fill='f-good';
    }
    if(r.got<=0 && it.n===0 && bn.kcal===0){ tag=`−${r.tgt.toLocaleString()}${r.unit==='kcal'?'':'g'} 부족`; tone='t-mut'; fill='f-warn'; }
    return `<div class="sum-row">
      <span class="sum-name">${r.name}</span>
      <span class="sum-val">${r.got.toLocaleString()}<em> / ${r.tgt.toLocaleString()}${r.unit==='kcal'?'':'g'}</em></span>
      <span class="sum-track"><span class="sum-fill ${fill}" style="width:${pct}%"></span></span>
      <span class="sum-tag ${tone}">${tag}</span>
    </div>`;
  }).join('') + `<div class="sum-note">운동 소비는 체중·시간·강도로 낸 추정치입니다.
    목표 칼로리에 이미 감량분이 잡혀 있으니, 태운 만큼 그대로 더 먹으면 그날 적자는 사라집니다.</div>`;
  return wrap;
}

const GH_KEY='gh-sync-v1';

let ghBusy=false, ghTimer=null;
/* dataURL이면 잘라 쓰고, Blob(영상)이면 읽어서 base64로. 깃허브가 받아주는 크기를 넘으면 null */
const GH_MAX=24*1024*1024;
function toBase64(val){
  return new Promise(res=>{
    if(typeof val==='string') return res(val.split(',')[1]||'');
    if(!(val instanceof Blob)) return res(null);
    if(val.size>GH_MAX) return res(null);
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]||'');
    r.onerror=()=>res(null);
    r.readAsDataURL(val);
  });
}
function ghAutoBackupSoon(){
  if(!ghCfg().token) return;
  clearTimeout(ghTimer); ghTimer=setTimeout(()=>ghBackup(false),2500);
}
async function ghBackup(manual){
  const c=ghCfg();
  if(!c.token){ if(manual){ toast('먼저 깃허브 연동을 설정하세요'); ghConfigSheet(); } return; }
  if(ghBusy) return; ghBusy=true; ghStatusText('백업 중...');
  try{
    let up=0;
    // 업로드 대상: 식단 사진 + 동기부여 카드의 사진·영상 전부
    const jobs=[];
    meals.filter(m=>m.key).forEach(m=>jobs.push({key:m.key, ext:'jpg', set:u=>{m.url=u;}}));
    motiv.forEach(v=>mvMedia(v).forEach(md=>{
      jobs.push({key:md.key, ext:md.type==='video'?'mp4':'jpg', set:u=>{md.remote=u;}});
    }));
    for(const j of jobs){
      if(photoSynced[j.key] || !phCache[j.key]) continue;
      const b64=await toBase64(phCache[j.key]);
      if(b64==null) continue;                       // 너무 큰 영상은 기기에만 둔다
      const res=await ghApi(`health/photos/${j.key}.${j.ext}`,{method:'PUT',
        body:JSON.stringify({message:`health media ${j.key}`, content:b64, branch:c.branch||'main'})});
      if(res.ok||res.status===422){
        photoSynced[j.key]=true;
        j.set(`https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch||'main'}/health/photos/${j.key}.${j.ext}`);
        up++;
      } else { throw new Error('업로드 실패 '+res.status); }
    }
    if(up){ jSet(K_MEAL,meals); jSet('wl-motiv',motiv); }
    saveSynced();
    const manifest={updated:new Date().toISOString(), prof, log, tasks, fastHist,
      meals:meals.map(m=>({id:m.id,d:m.d,slot:m.slot,memo:m.memo,key:m.key||null,url:m.url||null,nut:m.nut||null,rawPaste:m.rawPaste||null,fasted:!!m.fasted})),
      motiv:motiv.map(v=>({id:v.id,d:v.d,note:v.note||'',url:v.url||'',
        media:mvMedia(v).map(md=>({key:md.key,type:md.type,remote:md.remote||null}))}))};
    let sha=null;
    const g=await ghApi('health/data.json',{method:'GET'});
    if(g.ok) sha=(await g.json()).sha;
    const body={message:'update health data', content:btoa(unescape(encodeURIComponent(JSON.stringify(manifest)))), branch:c.branch||'main'};
    if(sha) body.sha=sha;
    const r=await ghApi('health/data.json',{method:'PUT', body:JSON.stringify(body)});
    if(!r.ok) throw new Error('데이터 저장 실패 '+r.status);
    ghStatusText(`백업 완료 · ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`);
    if(manual) toast('☁️ 깃허브 백업 완료');
  }catch(err){
    ghStatusText('백업 실패: '+err.message+' (토큰 권한 확인)');
    if(manual) toast('백업 실패 — 깃허브 설정 확인');
  }
  ghBusy=false;
}
async function ghPull(manual){
  const c=ghCfg();
  if(!c.token){ if(manual){ toast('먼저 깃허브 연동을 설정하세요'); ghConfigSheet(); } return; }
  try{
    const res=await ghApi('health/data.json',{method:'GET', headers:{'Accept':'application/vnd.github.raw+json'}});
    if(!res.ok){ if(manual) toast('저장된 백업이 없습니다'); return; }
    const man=await res.json();
    let added=0;
    if(prof.start==null && man.prof && man.prof.start!=null) prof.start=man.prof.start;
    if(prof.goal==null && man.prof && man.prof.goal!=null) prof.goal=man.prof.goal;
    jSet(K_PROF,prof);
    Object.keys(man.log||{}).forEach(k=>{ if(!log[k]){ log[k]=man.log[k]; added++; } });
    saveLog();
    (man.tasks||[]).forEach(t=>{ if(!tasks.some(x=>x.id===t.id)){ tasks.push(t); added++; } });
    jSet(K_TASK,tasks);
    const haveIds=new Set(meals.map(m=>m.id));
    (man.meals||[]).forEach(m=>{
      if(!haveIds.has(m.id)){ meals.push(m); if(m.url&&m.key) phCache[m.key]=phCache[m.key]||m.url; added++; }
    });
    jSet(K_MEAL,meals);
    const haveMv=new Set(motiv.map(v=>v.id));
    (man.motiv||[]).forEach(v=>{
      if(!haveMv.has(v.id)){
        motiv.push(v);
        // 기기에 원본이 없으면 깃허브 원격 주소로 보여준다
        mvMedia(v).forEach(md=>{ if(md.remote && !phCache[md.key]) phCache[md.key]=md.remote; });
        added++;
      }
    });
    jSet('wl-motiv',motiv);
    const haveF=new Set(fastHist.map(f=>f.start));
    (man.fastHist||[]).forEach(f=>{ if(!haveF.has(f.start)){ fastHist.push(f); added++; } });
    fastHist.sort((a,b)=>b.start-a.start); fastHist=fastHist.slice(0,30);
    jSet('wl-fast-hist',fastHist);
    if(manual) toast(added? `⬇ ${added}개 불러옴` : '이미 최신 상태입니다');
    // 방금 서버에서 받아온 내용이므로 되쓰기(백업)를 걸지 않는다
    onDataChanged({backup:false});
  }catch(err){ if(manual) toast('불러오기 실패 — 깃허브 설정 확인'); }
}

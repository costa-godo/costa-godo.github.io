<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>체중관리</title>
<style>
  :root{
    --bg:#F5F5F7; --surface:#FFFFFF; --raise:#F0F0F3; --border:#E5E5EA;
    --text:#1C1C1E; --muted:#6E6E73; --dim:#A9A9AE;
    --acc:#24BE5C; --acc-bg:rgba(36,190,92,.11);
    --amber:#F09000; --amber-bg:rgba(240,144,0,.12);
    --red:#F0453A; --red-bg:rgba(240,69,58,.10);
    --blue:#0A7CFF; --blue-bg:rgba(10,124,255,.10);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

    /* 타입 스케일 — 8단계로 고정. 그 사이 값은 쓰지 않는다. */
    --t-micro:10px;   /* 보조 라벨 */
    --t-cap:11.5px;   /* 캡션·설명 */
    --t-sm:13px;      /* 본문 작은 것 */
    --t-md:15px;      /* 본문 */
    --t-lg:17px;      /* 소제목 */
    --t-xl:22px;      /* 강조 수치 */
    --t-2xl:30px;     /* 큰 수치 */
    --t-3xl:40px;     /* 히어로 수치 */

    /* 모서리 — 요소 크기에 따라 4단계. 위계를 만든다. */
    --r-xs:6px;       /* 막대·점 */
    --r-sm:10px;      /* 버튼·칩 */
    --r-md:14px;      /* 카드 안쪽 블록 */
    --r-lg:18px;      /* 카드 */
    --r-pill:999px;

    /* 간격 — 4의 배수 */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px;

    /* 그림자 — 딱 2종. 떠 있는 것과 아닌 것 */
    --sh:0 1px 2px rgba(0,0,0,.04);
    --sh-up:0 4px 16px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
  body{padding-bottom:78px; -webkit-font-smoothing:antialiased;}
  button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ===== 헤더 ===== */
  header{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--border);
    padding:calc(11px + env(safe-area-inset-top,0px)) 14px 12px;}
  .h-row{display:flex; align-items:center; gap:10px;}
  .h-left{flex:1; min-width:0;}
  .h-title{font-size:var(--t-lg); font-weight:700;}
  .h-date{font-family:var(--mono); font-size:var(--t-cap); color:var(--muted); margin-top:2px;
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .sync-badge{font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:var(--t-micro); font-weight:700; padding:3px 8px; border-radius:var(--r-pill);
    display:inline-flex; align-items:center; gap:4px; line-height:1.4;
    background:var(--raise); color:var(--muted); border:none;}
  .sync-badge .sy-dot{width:5px; height:5px; border-radius:50%; background:currentColor;}
  .sync-badge.ok{background:var(--acc-bg); color:var(--acc);}
  .sync-badge.pending{background:var(--amber-bg); color:var(--amber);}
  .sync-badge.saving{background:var(--blue-bg); color:var(--blue);}
  .sync-badge.err{background:var(--red-bg); color:var(--red);}
  .sync-badge.off{background:var(--raise); color:var(--dim);}
  .sy-spin{width:8px; height:8px; border-radius:50%; border:1.5px solid currentColor;
    border-top-color:transparent; animation:syspin .7s linear infinite;}
  @keyframes syspin{to{transform:rotate(360deg)}}
  .shift-badge{flex:none; padding:7px 13px; border-radius:var(--r-sm); text-align:center;
    font-size:var(--t-md); font-weight:700; line-height:1.15;}
  .shift-badge .s{display:block; font-size:var(--t-micro); font-weight:600; opacity:.85; margin-top:1px;}
  .sb-ju{background:var(--acc-bg); color:var(--acc);}
  .sb-ya{background:var(--amber-bg); color:var(--amber);}
  .sb-bi{background:var(--raise); color:var(--dim);}
  .ic-btn{flex:none; width:34px; height:34px; border-radius:var(--r-sm); background:var(--raise);
    border:1px solid var(--border); color:var(--muted); font-size:var(--t-sm);}

  .bar-wrap{margin-top:11px; display:flex; align-items:center; gap:10px;}
  .mo-wrap{margin-top:var(--s3);}
  .mo-box{display:flex; align-items:center; gap:var(--s2);
    background:var(--raise); border-radius:var(--r-md); padding:var(--s2) var(--s3);}
  .mo-lbl{flex:none; font-size:var(--t-micro); font-weight:800; color:var(--dim);
    line-height:1.3; width:34px;}
  .mo-lbl b{display:block; font-family:var(--mono); font-size:var(--t-md); color:var(--acc);}
  .mo-cells{flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .mo-cell{background:var(--raise); border-radius:var(--r-sm); padding:7px 2px 6px;
    text-align:center; border:1.5px solid transparent; font-family:inherit;}
  .mo-cell:active{transform:scale(.95);}
  .mo-cell.hit{background:var(--acc-bg); border-color:var(--acc);}
  .mo-cell .ic{display:block; font-size:var(--t-cap); line-height:1.2;}
  .mo-cell b{display:block; font-family:var(--mono); font-size:var(--t-md);
    font-weight:800; line-height:1.15; margin-top:1px;}
  .mo-cell.hit b{color:var(--acc);}
  .mo-cell .lbl{display:block; font-size:var(--t-micro); color:var(--muted); font-weight:700;}
  .mo-cell.off{background:var(--raise);}
  .mo-cell.off b{color:var(--dim);}
  .bar{flex:1; height:9px; border-radius:var(--r-xs); background:var(--raise);
    border:1px solid var(--border); overflow:hidden;}
  .bar-fill{height:100%; width:0; background:var(--acc); border-radius:var(--r-xs); transition:width .4s ease;}
  .bar-txt{font-family:var(--mono); font-size:var(--t-cap); font-weight:700; color:var(--muted); white-space:nowrap;}

  /* ===== 페이지 공통 ===== */
  main{display:block;}
  .page{display:none; padding:14px 14px 4px;}
  .page.on{display:block;}
  /* 탭을 바꾸면 그 탭의 카드가 한 번 훑고 지나가듯 나타난다.
     스크롤할 때마다 튀어나오는 방식은 산만하므로 쓰지 않는다. */
  .page.on > *{animation:rise .34s cubic-bezier(.22,.61,.36,1) both;}
  .page.on > *:nth-child(1){animation-delay:0ms}
  .page.on > *:nth-child(2){animation-delay:40ms}
  .page.on > *:nth-child(3){animation-delay:80ms}
  .page.on > *:nth-child(4){animation-delay:120ms}
  .page.on > *:nth-child(n+5){animation-delay:150ms}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  /* 애니메이션을 꺼둔 사용자는 전부 정지 상태로 본다 */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;
      animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
  .sec-t{display:flex; align-items:center; gap:9px; margin:20px 2px 10px;
    font-size:var(--t-cap); font-weight:800; letter-spacing:.02em; color:var(--muted);}
  .sec-t:first-child{margin-top:2px;}
  .sec-t::after{content:""; flex:1; height:1px; background:var(--border);}
  /* 카드는 두 종류만. 지금 행동해야 하는 것(surface)과 참고용(quiet).
     전부 같은 흰 상자로 만들면 위계가 사라진다. */
  .card{background:var(--surface); border:.5px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sh); padding:var(--s4); margin-bottom:var(--s3);}
  .card.quiet{background:transparent; border:none; box-shadow:none;
    padding:var(--s3) var(--s1);}
  .card.lift{box-shadow:var(--sh-up); border-color:transparent;}
  .hint{font-size:var(--t-cap); color:var(--dim); line-height:1.65; margin:8px 2px 0;}
  .empty{text-align:center; color:var(--dim); font-size:var(--t-sm); padding:34px 16px; line-height:1.8;}

  /* ===== 체중 입력 ===== */
  /* ===== 오늘의 목표 카드 (밝게) ===== */
  .calc-card{background:var(--surface); border:.5px solid var(--border); border-radius:var(--r-lg);
    padding:16px; margin-bottom:10px; color:var(--text);
    box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .calc-top{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .calc-top .t{flex:1; font-size:var(--t-cap); font-weight:700; color:var(--muted);}
  .calc-edit{flex:none; font-size:var(--t-cap); font-weight:700; color:var(--blue);
    background:var(--blue-bg); padding:6px 12px; border-radius:var(--r-pill);}
  .calc-kcal{font-size:var(--t-2xl); font-weight:800; font-family:var(--mono);
    letter-spacing:-.04em; margin:2px 0 14px; line-height:1.05;}
  .calc-kcal small{font-size:var(--t-sm); font-weight:700; color:var(--muted); margin-left:4px;}
  .calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .calc-grid div{background:var(--raise); border-radius:var(--r-md); padding:10px 3px; text-align:center;}
  .calc-grid b{display:block; font-family:var(--mono); font-size:var(--t-md); font-weight:800;}
  .calc-grid span{display:block; font-size:var(--t-micro); color:var(--muted); margin-top:3px; font-weight:600;}
  .intake{margin-top:14px; padding-top:13px; border-top:.5px solid var(--border);}
  .intake-bar{height:7px; border-radius:var(--r-xs); background:var(--raise); overflow:hidden;}
  .intake-fill{height:100%; background:var(--acc); border-radius:var(--r-xs); transition:width .5s ease;}
  .intake-tx{font-size:var(--t-cap); color:var(--muted); margin-top:9px; line-height:1.6;}
  .intake-tx b{color:var(--text); font-family:var(--mono);}
  .intake-tx span{display:block; color:var(--acc); font-weight:700; margin-top:3px;}
  .intake-tx span.over{color:var(--amber);}
  .net-row{display:flex; align-items:baseline; gap:6px; margin-top:11px; flex-wrap:wrap;}
  .net-i{font-family:var(--mono); font-size:var(--t-sm); font-weight:700; color:var(--text);}
  .net-b{font-family:var(--mono); font-size:var(--t-sm); font-weight:700; color:var(--blue);}
  .net-op{font-size:var(--t-cap); color:var(--dim);}
  .net-t{margin-left:auto; font-family:var(--mono); font-size:var(--t-xl); font-weight:800;
    color:var(--text); letter-spacing:-.03em;}
  .net-t small{font-size:var(--t-cap); font-weight:600; color:var(--muted); margin-left:2px;}
  .calc-warn{margin-top:11px; font-size:var(--t-micro); color:var(--dim); line-height:1.5;}
  .calc-empty{display:flex; align-items:center; gap:12px; background:var(--surface);
    border:.5px solid var(--border); border-radius:var(--r-lg); padding:14px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .calc-empty .ic{font-size:var(--t-xl);}
  .calc-empty .tx{flex:1; font-size:var(--t-cap); color:var(--muted); line-height:1.5;}
  .calc-empty button{flex:none; background:var(--acc); color:#fff; font-size:var(--t-cap); font-weight:700;
    padding:9px 14px; border-radius:var(--r-sm);}
  .w-now{display:flex; align-items:baseline; gap:8px; margin-bottom:11px;}
  .w-now .big{font-size:var(--t-2xl); font-weight:800; font-family:var(--mono); letter-spacing:-.02em;}
  .w-now .delta{font-size:var(--t-sm); font-weight:800;}
  .w-now .delta.dn{color:var(--acc);} .w-now .delta.up{color:var(--red);}
  .w-now .sub{font-size:var(--t-cap); color:var(--dim); margin-left:auto;}
  .w-row{display:flex; gap:8px; align-items:flex-end;}
  .fld{flex:1; min-width:0;}
  .fld label{display:block; font-size:var(--t-cap); font-weight:700; color:var(--muted); margin-bottom:5px;}
  .fld input{width:100%; background:var(--raise); border:1.5px solid transparent;
    border-radius:var(--r-sm); padding:11px 12px; color:var(--text);
    font-size:var(--t-lg); font-weight:700; font-family:var(--mono); outline:none;}
  .fld input:focus{border-color:var(--blue); background:var(--surface);}
  .save-btn{flex:none; padding:12px 16px; border-radius:var(--r-sm); background:var(--acc);
    color:#fff; font-size:var(--t-sm); font-weight:800;}

  /* ===== 운동 ===== */
  .ex-row{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px;}
  .ex-row:last-child{margin-bottom:0;}
  .ex.skip{color:var(--dim);}
  .ex.skip .em{opacity:.5;}
  .ex.skip.on{background:var(--raise); border-color:var(--dim); color:var(--muted);}
  .ex{padding:12px 1px; border-radius:var(--r-md); text-align:center;
    background:var(--raise); border:1.5px solid transparent;
    font-size:var(--t-micro); font-weight:700; color:var(--muted); transition:.15s;
    letter-spacing:-.04em; white-space:nowrap;}
  .ex .em{display:block; font-size:var(--t-lg); margin-bottom:3px;}
  .ex-sub{display:block; font-size:var(--t-micro); font-weight:700; color:var(--acc);
    margin-top:3px; font-family:var(--mono);}
  .ex-total{margin-top:12px; padding-top:11px; border-top:.5px solid var(--border);
    font-size:var(--t-cap); color:var(--muted); text-align:right;}
  .ex-total b{font-family:var(--mono); font-size:var(--t-md); color:var(--blue);}
  .ex-total.mut{text-align:left; font-size:var(--t-cap); color:var(--dim);}
  .lv-seg{display:flex; gap:7px; margin-bottom:14px;}
  .lv-seg button{flex:1; padding:11px 2px; border-radius:var(--r-sm); font-size:var(--t-sm); font-weight:700;
    background:var(--raise); border:1.5px solid transparent; color:var(--muted);}
  .lv-seg button.on{background:var(--acc-bg); border-color:var(--acc); color:var(--acc);}
  .ex-prev{font-size:var(--t-sm); color:var(--text); padding:11px 13px; border-radius:var(--r-sm);
    background:var(--raise); line-height:1.5;}
  .ex-prev b{font-family:var(--mono); font-size:var(--t-lg); color:var(--blue);}
  .ex-prev .mut{color:var(--dim); font-size:var(--t-cap);}
  .ex.on{background:var(--acc-bg); border-color:var(--acc); color:var(--acc);}
  .ex:active{transform:scale(.97);}

  /* ===== 체크리스트 ===== */
  .chk-row{display:flex; align-items:flex-start; gap:11px; padding:11px 2px;
    border-top:.5px solid var(--border);}
  .chk-row:first-child{border-top:none;}
  .box{flex:none; width:23px; height:23px; border-radius:50%; border:2px solid var(--dim);
    background:none; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .box svg{width:13px; height:13px; opacity:0; transform:scale(.5); transition:.16s;}
  .chk-row.done .box{background:var(--acc); border-color:var(--acc);}
  .chk-row.done .box svg{opacity:1; transform:scale(1);}
  .chk-txt{flex:1; min-width:0; font-size:var(--t-sm); line-height:1.5; word-break:keep-all;}
  .chk-row.done .chk-txt{color:var(--dim); text-decoration:line-through;}
  .chk-del{flex:none; color:var(--dim); font-size:var(--t-md); padding:0 3px;}
  .chk-edit{flex:none; color:var(--dim); font-size:var(--t-sm); padding:0 3px;}
  .chk-input{flex:1; min-width:0; background:var(--surface); border:1.5px solid var(--blue);
    border-radius:var(--r-sm); padding:9px 11px; color:var(--text); font-size:var(--t-sm); outline:none;}
  .chk-ok{flex:none; font-size:var(--t-cap); font-weight:700; color:#fff; background:var(--acc);
    padding:8px 12px; border-radius:var(--r-sm);}
  .chk-cancel{flex:none; font-size:var(--t-cap); font-weight:600; color:var(--muted); padding:8px 6px;}

  /* 식단 영양 칩 */
  .nut-row{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-bottom:5px;}
  .nut-kcal{font-family:var(--mono); font-size:var(--t-sm); font-weight:800; color:var(--text);}
  .nut-chip{font-size:var(--t-micro); font-weight:700; padding:2px 7px; border-radius:var(--r-sm);
    background:var(--blue-bg); color:var(--blue);}

  /* 하루 영양 요약 */
  .sum-card{background:var(--surface); border:.5px solid var(--border); border-radius:var(--r-lg);
    padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .sum-head{display:flex; align-items:baseline; gap:8px; margin-bottom:12px;}
  .sum-day{font-size:var(--t-sm); font-weight:800;}
  .sum-meta{margin-left:auto; font-size:var(--t-cap); color:var(--dim); font-weight:600;}
  .sum-fast{font-size:var(--t-micro); font-weight:800; padding:2px 8px; border-radius:var(--r-sm);
    background:var(--blue-bg); color:var(--blue);}
  .sum-row{display:flex; align-items:center; gap:9px; padding:9px 0; border-top:.5px solid var(--border);}
  .sum-eq{display:flex; align-items:baseline; gap:7px; padding:11px 12px; margin-bottom:10px;
    background:var(--raise); border-radius:var(--r-md); font-size:var(--t-cap); color:var(--muted); flex-wrap:wrap;}
  .sum-eq b{font-family:var(--mono); font-size:var(--t-sm); color:var(--text); font-weight:800;}
  .sum-eq b.burn{color:var(--blue);}
  .sum-eq .op{color:var(--dim);}
  .sum-eq .tot{margin-left:auto; font-family:var(--mono); font-size:var(--t-lg); font-weight:800; color:var(--text);}
  .sum-eq .tot em{font-style:normal; font-size:var(--t-micro); color:var(--dim); margin-left:2px;}
  .sum-row:first-of-type{border-top:none;}
  .sum-name{flex:none; width:52px; font-size:var(--t-cap); font-weight:700; color:var(--muted);}
  .sum-val{flex:none; font-family:var(--mono); font-size:var(--t-sm); font-weight:700; width:88px;}
  .sum-val em{font-style:normal; color:var(--dim); font-weight:600;}
  .sum-track{flex:1; height:6px; border-radius:var(--r-xs); background:var(--raise); overflow:hidden; min-width:24px;}
  .sum-fill{height:100%; border-radius:var(--r-xs);}
  .sum-tag{flex:none; font-size:var(--t-cap); font-weight:800; width:76px; text-align:right;}
  .t-good{color:var(--acc);} .t-warn{color:var(--amber);} .t-bad{color:var(--red);} .t-mut{color:var(--dim);}
  .f-good{background:var(--acc);} .f-warn{background:var(--amber);} .f-bad{background:var(--red);}
  .more-btn{width:100%; padding:14px; border-radius:var(--r-md); background:var(--raise);
    color:var(--muted); font-size:var(--t-sm); font-weight:700; margin-top:4px;}
  .sum-none{font-size:var(--t-cap); color:var(--dim); line-height:1.6; padding:4px 2px;}
  .sum-note{font-size:var(--t-micro); color:var(--dim); line-height:1.6; margin-top:10px;
    padding-top:10px; border-top:.5px solid var(--border);}

  /* 동기부여 보드 */
  .mv-add{display:flex; gap:7px; margin-bottom:12px;}
  .mv-add button{flex:1; padding:11px 2px; border-radius:var(--r-md); font-size:var(--t-cap); font-weight:700;
    background:var(--raise); border:1.5px dashed var(--border); color:var(--muted);}
  .mv-card{background:var(--surface); border:.5px solid var(--border); border-radius:var(--r-lg);
    transition:transform .16s ease, box-shadow .16s ease;
    overflow:hidden; margin-bottom:11px; box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .mv-car{position:relative; overflow:hidden; background:#000;}
  .mv-track{display:flex; transition:transform .28s cubic-bezier(.22,.61,.36,1);}
  .mv-cell{flex:0 0 100%; width:100%; display:flex; align-items:center; justify-content:center;
    background:#000; max-height:62vh;}
  .mv-cell img, .mv-cell video{width:100%; max-height:62vh; object-fit:contain; display:block;}
  .mv-dots{position:absolute; left:0; right:0; bottom:9px; display:flex; justify-content:center;
    gap:5px; pointer-events:none;}
  .mv-dots i{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.45);
    transition:.18s;}
  .mv-dots i.on{background:#fff; transform:scale(1.25);}
  .mv-count{position:absolute; top:9px; right:10px; font-size:var(--t-micro); font-weight:700;
    color:#fff; background:rgba(0,0,0,.5); padding:3px 9px; border-radius:var(--r-pill);
    pointer-events:none; font-family:var(--mono);}
  .mv-nav{position:absolute; top:50%; transform:translateY(-50%); width:34px; height:52px;
    background:rgba(0,0,0,.34); color:#fff; font-size:var(--t-xl); line-height:1;
    display:flex; align-items:center; justify-content:center;}
  .mv-nav.l{left:0; border-radius:0 10px 10px 0;}
  .mv-nav.r{right:0; border-radius:var(--r-sm) 0 0 10px;}
  .lb-stage{max-width:100%; max-height:100%; display:flex; align-items:center; justify-content:center;}
  .lb-stage img, .lb-stage video{max-width:100vw; max-height:88vh; object-fit:contain;}
  .lb-count{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); left:0; right:0;
    text-align:center; color:#fff; font-size:var(--t-cap); font-weight:700; font-family:var(--mono);}
  .mv-body{padding:12px 13px 13px;}
  .mv-note{width:100%; background:none; border:none; color:var(--text); font-size:var(--t-sm);
    line-height:1.6; outline:none; resize:none; padding:0; font-family:inherit;
    overflow:hidden; display:block; min-height:2.2em;}
  .mv-note::placeholder{color:var(--dim);}
  .mv-link{display:flex; align-items:center; gap:8px; margin-top:9px; padding:10px 12px;
    background:var(--blue-bg); border-radius:var(--r-sm); color:var(--blue);
    font-size:var(--t-cap); font-weight:700; text-decoration:none; word-break:break-all;}
  .mv-foot{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .mv-date{flex:1; font-family:var(--mono); font-size:var(--t-micro); color:var(--dim); font-weight:600;}
  .mv-btn{font-size:var(--t-cap); font-weight:700; color:var(--muted); background:var(--raise);
    padding:6px 11px; border-radius:var(--r-pill);}
  .mv-btn.del{color:var(--red);}
  .mv-ord{padding:6px 10px; font-size:var(--t-sm); font-weight:800;}
  .mv-ord:disabled{opacity:.28;}
  .mv-title{width:100%; background:none; border:none; color:var(--text);
    font-size:var(--t-md); font-weight:800; letter-spacing:-.02em; outline:none;
    padding:0 0 5px; font-family:inherit;}
  .mv-title::placeholder{color:var(--dim); font-weight:700;}
  .mv-foot + .mv-foot{margin-top:7px;}
  .mv-btn.pin.on{background:var(--amber-bg); color:var(--amber);}
  .mv-card.pinned{border:1.5px solid var(--amber);}
  .add-row{display:flex; gap:7px; margin-top:11px;}
  .add-row input{flex:1; min-width:0; background:var(--raise); border:1.5px solid transparent;
    border-radius:var(--r-sm); padding:11px; color:var(--text); font-size:var(--t-sm); outline:none;}
  .add-row input:focus{border-color:var(--blue); background:var(--surface);}
  .add-row button{flex:none; padding:0 16px; border-radius:var(--r-sm); background:var(--acc-bg);
    border:1.5px solid var(--acc); color:var(--acc); font-size:var(--t-sm); font-weight:800;}

  /* ===== 식단 (해당 날짜) ===== */
  .meal-add{display:flex; gap:6px; margin-bottom:10px;}
  .meal-add button{flex:1; padding:10px 2px; border-radius:var(--r-sm); font-size:var(--t-cap); font-weight:700;
    background:var(--raise); border:1.5px dashed var(--border); color:var(--muted);}
  .m-card{display:flex; gap:11px; background:var(--raise); border:1px solid var(--border);
    border-radius:var(--r-md); padding:9px; margin-bottom:9px;}
  .m-card:last-child{margin-bottom:0;}
  .m-thumb{width:66px; height:66px; flex:none; border-radius:var(--r-sm); overflow:hidden;
    background:var(--surface); border:1px solid var(--border);}
  .m-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .m-thumb.fast-thumb{display:flex; align-items:center; justify-content:center;
    font-size:var(--t-xl); opacity:.4; background:var(--raise);}
  .m-body{flex:1; min-width:0; display:flex; flex-direction:column;}
  .m-top{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
  .m-ai{margin-left:auto; background:var(--blue-bg); color:var(--blue); font-size:var(--t-cap);
    font-weight:700; padding:4px 9px; border-radius:var(--r-pill);}
  .m-del{color:var(--dim); font-size:var(--t-sm);}
  .m-memo{flex:1; width:100%; background:none; border:none; color:var(--text);
    font-size:var(--t-sm); line-height:1.55; outline:none; resize:none; padding:0;
    overflow:hidden; display:block; min-height:2.1em; font-family:inherit;}
  .m-memo::placeholder{color:var(--dim);}

  /* ===== 레벨 ===== */
  /* 레벨 카드 — 숫자 하나, 다음 목표, 추이선, 연속일. 한 카드에 정리. */
  .lv-hero{padding:var(--s5) var(--s4) var(--s4);}
  .lv-hero .n{font-size:var(--t-2xl); font-weight:800; font-family:var(--mono);
    letter-spacing:-.03em; color:var(--acc); line-height:1;}
  .lv-hero .g{font-size:var(--t-sm); color:var(--muted); margin-top:var(--s2); line-height:1.6;}
  .lv-hero .g b{color:var(--text); font-family:var(--mono);}
  .lv-next{display:block; font-size:var(--t-cap); color:var(--dim); margin-top:2px;}
  .spark{width:100%; height:96px; display:block; margin-top:var(--s4);}
  .lv-foot{margin-top:var(--s3); padding-top:var(--s3); border-top:.5px solid var(--border);
    font-size:var(--t-cap); color:var(--muted);}
  .lv-foot span{font-family:var(--mono); font-weight:800; color:var(--amber);
    font-size:var(--t-sm); margin-right:2px;}
  .ms-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center;}
  .ms-grid > div{background:var(--raise); border-radius:var(--r-md); padding:12px 4px;}
  .ms-grid b{display:block; font-family:var(--mono); font-size:var(--t-lg); font-weight:800;
    letter-spacing:-.02em;}
  .ms-grid b.dn{color:var(--acc);} .ms-grid b.up{color:var(--red);}
  .ms-grid span{display:block; font-size:var(--t-micro); color:var(--muted); margin-top:4px; font-weight:600;}

  /* ===== 기록 (캘린더) ===== */
  .rec-seg{display:flex; gap:6px; margin-bottom:12px;}
  .rec-seg button{flex:1; padding:9px 0; border-radius:var(--r-sm); font-size:var(--t-sm); font-weight:700;
    background:var(--raise); border:1.5px solid transparent; color:var(--muted);}
  .rec-seg button.sel{background:var(--acc); border-color:var(--acc); color:#fff;}
  .rec-nav{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .rec-nav .lbl{flex:1; font-size:var(--t-md); font-weight:800; text-align:center;}
  .rec-nav button{flex:none; width:32px; height:32px; border-radius:var(--r-sm); background:var(--raise);
    border:1px solid var(--border); font-size:var(--t-sm); color:var(--text);}
  .rec-nav .today-btn{width:auto; padding:0 12px; font-size:var(--t-cap); font-weight:800; color:var(--acc);}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:5px;}
  .dow span{text-align:center; font-size:var(--t-cap); font-weight:800; color:var(--muted); padding:4px 0;}
  .dow span:first-child, .dow span:last-child{color:var(--red);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cell{aspect-ratio:1; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-sm); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:3px; position:relative;}
  .cell.out{opacity:.32;}
  .cell.today{border:1.5px solid var(--acc);}
  .cell .dnum{font-size:var(--t-cap); font-weight:700; color:var(--muted); font-family:var(--mono);}
  .cell.wknd .dnum{color:var(--red);}
  .cell.today .dnum{color:var(--acc); font-weight:800;}
  .dots{display:flex; gap:2.5px;}
  .dot{width:5px; height:5px; border-radius:50%;}
  .dot.w{background:var(--acc);} .dot.e{background:var(--blue);} .dot.m{background:var(--amber);}
  .legend{display:flex; gap:14px; margin-top:12px; font-size:var(--t-cap); color:var(--dim);}
  .legend span{display:flex; align-items:center; gap:5px;}
  .legend .dot{width:6px; height:6px;}

  .week-list{display:flex; flex-direction:column; gap:8px;}
  .wk-card{display:flex; align-items:center; gap:11px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--r-md); padding:11px 13px;}
  .wk-card.today{border-color:var(--acc);}
  .wk-d{flex:none; width:40px; text-align:center;}
  .wk-d .dow2{font-size:var(--t-micro); font-weight:800; color:var(--dim);}
  .wk-d .num2{font-size:var(--t-lg); font-weight:800; font-family:var(--mono);}
  .wk-card.wknd .wk-d .dow2, .wk-card.wknd .wk-d .num2{color:var(--red);}
  .wk-mid{flex:1; min-width:0;}
  .wk-w{font-size:var(--t-sm); font-weight:800; font-family:var(--mono);}
  .wk-w.none{color:var(--dim); font-weight:600; font-family:inherit;}
  .wk-chips{display:flex; gap:5px; margin-top:5px; flex-wrap:wrap;}
  .wk-chip{font-size:var(--t-micro); font-weight:700; padding:2px 7px; border-radius:var(--r-sm);}
  .wk-chip.e{background:var(--blue-bg); color:var(--blue);}
  .wk-chip.m{background:var(--amber-bg); color:var(--amber);}
  .wk-chip.b{background:var(--acc-bg); color:var(--acc);}
  .wk-chip.s{background:var(--blue-bg); color:var(--blue);}
  .wk-chip.s.bad{background:var(--red-bg); color:var(--red);}
  .wk-go{flex:none; color:var(--dim); font-size:var(--t-md);}

  /* ===== 다이얼로그 / 시트 / 라이트박스 / 토스트 ===== */
  .ov{position:fixed; inset:0; background:rgba(28,28,30,.40); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:22px;}
  .dlg{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    width:100%; max-width:330px; padding:20px 18px;}
  .dlg-t{font-size:var(--t-md); font-weight:800; margin-bottom:13px;}
  .dlg-m{font-size:var(--t-sm); line-height:1.6; white-space:pre-line;}
  .dlg-btns{display:flex; gap:8px; margin-top:18px;}
  .dlg-b{flex:1; padding:12px; border-radius:var(--r-sm); border:1px solid transparent;
    background:var(--raise); color:var(--muted); font-size:var(--t-sm); font-weight:600;}
  .dlg-b.p{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:800;}

  .sheet-ov{position:fixed; inset:0; background:rgba(28,28,30,.42); z-index:210;
    display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:520px; background:var(--bg); border-radius:var(--r-pill) 20px 0 0;
    max-height:88vh; overflow-y:auto; padding:8px 14px calc(20px + env(safe-area-inset-bottom,0px));}
  .sheet-grab{width:38px; height:4px; background:var(--border); border-radius:var(--r-xs); margin:8px auto 12px;}
  .sheet-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .sheet-title{flex:1; font-size:var(--t-md); font-weight:800;}
  .sheet-close{flex:none; width:30px; height:30px; border-radius:var(--r-sm); background:var(--raise);
    border:1px solid var(--border); font-size:var(--t-sm);}

  .lb{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:300;
    display:flex; align-items:center; justify-content:center;}
  .lb img{max-width:100%; max-height:100%; object-fit:contain;}

  .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(14px);
    background:var(--text); color:#fff; font-size:var(--t-sm); font-weight:700;
    padding:11px 18px; border-radius:var(--r-pill); opacity:0; pointer-events:none;
    transition:.2s; z-index:400; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== 도전 ===== */
  .ch-card{padding:16px 15px 15px;}
  .ch-head{display:flex; align-items:center; margin-bottom:11px;}
  .ch-t{flex:1; font-size:var(--t-sm); font-weight:800;}
  .ch-t b{font-family:var(--mono); color:var(--blue);}
  .ch-fail{font-size:var(--t-cap); font-weight:800; color:var(--red);
    background:var(--red-bg); padding:6px 13px; border-radius:var(--r-pill);}
  .ch-idle{font-size:var(--t-cap); color:var(--muted); line-height:1.6; margin-bottom:13px;}
  .ch-opts{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .ch-opts button{padding:12px 3px; border-radius:var(--r-md); background:var(--raise);
    border:1.5px solid transparent; text-align:center;}
  .ch-opts button:active{transform:scale(.96);}
  .ch-opts button b{display:block; font-family:var(--mono); font-size:var(--t-md); font-weight:800;}
  .ch-opts button span{display:block; font-size:var(--t-micro); color:var(--muted);
    font-weight:700; margin-top:3px; line-height:1.3;}
  .ch-hist{display:flex; flex-wrap:wrap; gap:5px; margin-top:12px;
    padding-top:11px; border-top:.5px solid var(--border);}
  .ch-badge{font-size:var(--t-micro); font-weight:800; padding:3px 8px; border-radius:var(--r-pill);
    background:var(--raise); color:var(--muted); border:none; font-family:inherit;}
  .ch-badge:active{transform:scale(.94);}
  .ch-badge.success{background:var(--acc-bg); color:var(--acc);}
  .ch-badge.fail{background:var(--red-bg); color:var(--red);}
  .ch-badge.add{background:var(--blue-bg); color:var(--blue); font-size:var(--t-cap); padding:3px 10px;}

  .ch-track{position:relative; height:30px; display:flex; align-items:center;
    gap:7px; margin-bottom:6px;}
  .ch-flag{font-size:var(--t-md); flex:none; z-index:1;}
  .ch-line{flex:1; height:6px; border-radius:var(--r-xs); background:var(--raise); overflow:hidden;}
  .ch-line-fill{height:100%; width:0; background:linear-gradient(90deg,#7FD3A0,#24BE5C);
    border-radius:var(--r-xs); transition:width .9s linear;}
  .ch-runner{position:absolute; left:0; top:50%; transform:translateY(calc(-50% - 13px));
    font-size:var(--t-lg); transition:left .9s linear; animation:chBounce .5s ease-in-out infinite;}
  @keyframes chBounce{0%,100%{transform:translateY(calc(-50% - 13px));} 50%{transform:translateY(calc(-50% - 18px));}}
  .ch-pct{text-align:right; font-family:var(--mono); font-size:var(--t-cap); font-weight:700;
    color:var(--dim); margin-bottom:14px;}

  .ch-tower{display:flex; flex-direction:column-reverse; gap:4px; margin-bottom:10px;}
  .ch-block{height:15px; border-radius:var(--r-xs); background:var(--raise);
    border:1px solid var(--border); position:relative; overflow:hidden;}
  .ch-block::after{content:''; position:absolute; left:0; right:0; bottom:0;
    height:var(--fh,0%); background:linear-gradient(180deg,#8FD9AC,#24BE5C);
    transition:height .6s cubic-bezier(.22,.61,.36,1); border-radius:var(--r-xs);}
  .ch-block.fill{border-color:transparent;}
  .ch-block.pop::after{animation:chPop .45s cubic-bezier(.34,1.56,.64,1);}
  @keyframes chPop{0%{filter:brightness(1.9);} 100%{filter:brightness(1);}}
  .ch-sub{text-align:center; font-size:var(--t-cap); color:var(--muted); font-weight:600;}

  .ch-card.done{text-align:center; padding:26px 15px;}
  .ch-cele{font-size:var(--t-3xl); animation:chCele .6s ease;}
  @keyframes chCele{0%{transform:scale(.3) rotate(-15deg); opacity:0;}
    60%{transform:scale(1.15) rotate(8deg); opacity:1;} 100%{transform:scale(1) rotate(0);}}
  .ch-done-t{font-size:var(--t-lg); font-weight:800; margin-top:8px;}
  .ch-done-s{font-size:var(--t-cap); color:var(--muted); margin-top:4px;}
  .ch-again{margin-top:16px; padding:12px 22px; border-radius:var(--r-md);
    background:var(--acc); color:#fff; font-size:var(--t-sm); font-weight:800;}

  /* ===== 공복 타이머 ===== */
  .fast-card{padding:16px;}
  .fast-top{display:flex; align-items:center; margin-bottom:12px;}
  .fast-t{flex:1; font-size:var(--t-cap); font-weight:800; letter-spacing:.04em; color:var(--dim);}
  .fast-info{font-size:var(--t-cap); font-weight:700; color:var(--blue);
    background:var(--blue-bg); padding:5px 11px; border-radius:var(--r-pill);}
  .fast-idle{font-size:var(--t-sm); color:var(--muted); line-height:1.5; margin-bottom:12px;}
  .fast-start{width:100%; padding:15px; border-radius:var(--r-md); background:var(--acc);
    color:#fff; font-size:var(--t-md); font-weight:800;}
  .fast-start:active{transform:scale(.98);}
  .fa-btn.wide{width:100%; padding:14px;}
  .fast-main{position:relative; display:flex; align-items:center; justify-content:center;
    margin:4px 0 14px;}
  .fast-ring{width:168px; height:168px; transform:rotate(-90deg);}
  .fr-bg{fill:none; stroke:var(--raise); stroke-width:9;}
  .fr-fg{fill:none; stroke:#F0453A; stroke-width:9; stroke-linecap:round;
    transition:stroke-dashoffset .95s linear, stroke .4s ease;
    filter:drop-shadow(0 0 5px rgba(240,69,58,.40));}
  .fr-fg.done{stroke:var(--acc); filter:drop-shadow(0 0 6px rgba(36,190,92,.45));}
  .fast-mid{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:5px;}
  .fast-left{font-family:var(--mono); font-size:var(--t-2xl); font-weight:800; letter-spacing:-.03em;}
  .fast-sub{font-size:var(--t-micro); font-weight:700; color:var(--muted); text-align:center; line-height:1.5;}
  .fs-el{font-family:var(--mono); color:var(--dim); font-weight:600;}
  .fa-btn{padding:12px 2px; border-radius:var(--r-md); background:var(--raise);
    font-size:var(--t-cap); font-weight:800; color:var(--text);}
  .fa-btn.stop{color:var(--red);}
  .fa-btn:active{transform:scale(.97);}
  .cal-note{font-size:var(--t-cap); color:var(--dim); line-height:1.6; margin-bottom:12px;}
  .cal-note b{color:var(--text);}
  .cal-lbl{display:block; font-size:var(--t-cap); font-weight:700; color:var(--muted); margin-bottom:6px;}
  .cal-need{font-size:var(--t-cap); color:var(--dim); padding:14px; background:var(--raise);
    border-radius:var(--r-md); text-align:center;}
  .act-seg{display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-bottom:14px;}
  .act-seg button{padding:10px 4px; border-radius:var(--r-sm); background:var(--raise);
    border:1.5px solid transparent; color:var(--muted); text-align:center;}
  .act-seg button b{display:block; font-size:var(--t-cap); font-weight:800;}
  .act-seg button span{display:block; font-size:var(--t-micro); margin-top:2px; opacity:.8;}
  .act-seg button.on, .lv-seg button.on{background:var(--acc-bg); border-color:var(--acc); color:var(--acc);}
  .lv-seg button b{display:block; font-size:var(--t-sm); font-weight:800;}
  .lv-seg button span{display:block; font-size:var(--t-micro); margin-top:1px; opacity:.8;}
  /* 공복 기록 리스트 */
  /* ===== 공복 기록 인포그래픽 ===== */
  .fx-card{padding:16px 14px 14px;}
  .fx-hero{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .fx-big{font-size:var(--t-3xl); line-height:1;}
  .fx-hero-tx{flex:1; min-width:0;}
  .fx-lbl{font-size:var(--t-cap); font-weight:700; color:var(--muted);}
  .fx-num{font-family:var(--mono); font-size:var(--t-2xl); font-weight:800;
    letter-spacing:-.04em; line-height:1.1;}
  .fx-num small{font-size:var(--t-sm); font-weight:700; color:var(--muted); margin-left:3px;}
  .fx-streak{flex:none; text-align:center; background:var(--raise);
    border-radius:var(--r-md); padding:9px 12px; min-width:70px;}
  .fx-streak.on{background:var(--amber-bg);}
  .fx-streak span{font-size:var(--t-md); line-height:1;}
  .fx-streak b{display:block; font-family:var(--mono); font-size:var(--t-lg);
    font-weight:800; line-height:1.2; color:var(--dim);}
  .fx-streak.on b{color:var(--amber);}
  .fx-streak em{display:block; font-style:normal; font-size:var(--t-micro);
    font-weight:700; color:var(--muted);}
  .fx-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:14px;}

<body>

<script>
/* ================= 저장소 ================= */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){
  let ok=true;
  try{ localStorage.setItem(k,v); }
  catch(e){
    ok=false;
    // 저장 공간이 꽉 찼는데 조용히 넘어가면 기록이 사라진 걸 모른다
    try{ toast('기기 저장 실패 — 백업으로 보관됩니다'); }catch(e2){}
  }
  try{ if(window.storage) window.storage.set(k,v,false); }catch(e){}
  return ok;
}
function jGet(k,d){ try{ const r=lsGet(k); return r?JSON.parse(r):d; }catch(e){ return d; } }
/* 저장되는 모든 데이터는 자동으로 백업 대기열에 올린다.
   개별 호출 지점마다 백업을 거는 방식은 빠뜨리기 쉬워서, 저장 함수에서 한 번에 처리. */
const NO_BACKUP_KEYS=['wl-gh-last','wl-photo-synced','gh-sync-v1','app-theme'];
function jSet(k,v){
  lsSet(k,JSON.stringify(v));
  if(!NO_BACKUP_KEYS.includes(k) && typeof ghAutoBackupSoon==='function') ghAutoBackupSoon();
}

const K_PROF='wl-profile', K_LOG='wl-log', K_TASK='wl-task', K_MEAL='wl-meal';
let prof = jGet(K_PROF, {start:null, goal:null});
let log  = jGet(K_LOG, {});
let tasks= jGet(K_TASK, null);
let meals= jGet(K_MEAL, []);
let photoSynced= jGet('wl-photo-synced', {});
function saveSynced(){ jSet('wl-photo-synced', photoSynced); }
if(!tasks){
  tasks=[{id:'t1',text:'아침 공복 체중 재기'},{id:'t2',text:'물 챙겨 마시기'},{id:'t3',text:'끼니 사진 남기기'}];
  jSet(K_TASK,tasks);
}

/* ================= 날짜 · 근무 ================= */
const DAYS=['일','월','화','수','목','금','토'];
const p2=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parseD=s=>{const[y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd);};
const addD=(s,n)=>{const d=parseD(s); d.setDate(d.getDate()+n); return dkey(d);};
const shortD=s=>`${Number(s.slice(5,7))}/${Number(s.slice(8,10))}`;

const ANCHOR=new Date(2026,6,24); // 2026-07-24 = 주1
const SHIFTS=[
  {n:'주1', c:'sb-ju', pre:['출근 전','05:00~07:00'], post:['퇴근 후','18:00~20:00']},

function shiftIdx(d){
  let ov={};
  try{ ov=JSON.parse(lsGet('shift-overrides-v1'))||{}; }catch(e){}
  const o=ov[dkey(d)];
  if(o!==undefined&&o!==null) return o;
  const a=new Date(ANCHOR.getFullYear(),ANCHOR.getMonth(),ANCHOR.getDate());
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  return ((Math.round((x-a)/86400000)%4)+4)%4;
}

/* 폰의 뒤로가기 제스처로 다이얼로그가 닫히도록 히스토리에 얹는다.
   안 그러면 뒤로가기가 앱 자체를 떠나버린다. */
const ovStack=[];
function showOverlay(ov){
  ovStack.push(ov);
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
  history.pushState({ov:ovStack.length},'');
  const origRemove=ov.remove.bind(ov);
  ov.remove=()=>{
    const i=ovStack.indexOf(ov);
    if(i>-1){
      ovStack.splice(i,1);
      if(!ovStack.length) document.body.style.overflow='';
      if(history.state && history.state.ov) history.back();
    }
    origRemove();
  };
  return ov;
}
window.addEventListener('popstate',()=>{
  const top=ovStack.pop();
  if(top){
    if(!ovStack.length) document.body.style.overflow='';
    Element.prototype.remove.call(top);
  }
});

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function autoGrow(ta){

function bindAutoGrow(ta){

function day(k){ if(!log[k]) log[k]={w:null,g:null,ex:{pre:[],post:[]},chk:{}};
  const d=log[k];
  if(!d.ex)d.ex={};
  if(!d.chk)d.chk={};
  // 예전 형식 정리: 문자열 → 객체, 오전/오후 분리 → 하나의 목록
  const norm=a=>(a||[]).map(x=> typeof x==='string' ? {name:x, min:30, level:1} : x);
  if(!Array.isArray(d.ex.list)){
    d.ex.list=[...norm(d.ex.pre), ...norm(d.ex.post)];
    delete d.ex.pre; delete d.ex.post;
  } else {
    d.ex.list=norm(d.ex.list);
  }
  return d; }
function saveLog(){ jSet(K_LOG,log); }
function sortedW(){ return Object.keys(log).filter(k=>log[k].w!=null).sort().map(k=>({d:k,w:log[k].w})); }
function curW(){ const a=sortedW(); return a.length? a[a.length-1].w : prof.start; }
/* 그날 시점의 체중. 과거 기록을 지금 체중으로 계산하면 값이 틀어진다 */
function weightOn(dateKey){
  const a=sortedW();
  if(!a.length) return prof.start;
  let w=null;
  for(const r of a){ if(r.d<=dateKey) w=r.w; else break; }
  return w!=null? w : a[0].w;
}
function hasW(k){ return !!log[k] && log[k].w!=null; }

      ${cur?'<button class="dlg-b" id="xDel" style="color:var(--red)">기록 삭제</button>':'<button class="dlg-b" data-r="n">취소</button>'}

function exName(x){ return typeof x==='string' ? x : (x&&x.name); }
function exOf(k){
  const d=log[k]; if(!d||!d.ex) return [];
  if(Array.isArray(d.ex.list)) return d.ex.list;
  return [...(d.ex.pre||[]),...(d.ex.post||[])];   // 아직 정리 안 된 옛 기록
}
function hasEx(k){ return exOf(k).some(x=>exBase(x)); }
function hasMeal(k){ return meals.some(m=>m.d===k); }
function sleepOn(k){ return sleeps.find(x=>x.d===k); }
function hasAny(k){ return hasW(k)||hasEx(k)||hasMeal(k)||(log[k]&&Object.keys(log[k].chk||{}).length>0); }

/* ================= IndexedDB (사진) ================= */
let _db=null;
function db(){
  if(_db) return _db;
  _db=new Promise((res,rej)=>{
    try{
      const rq=indexedDB.open('wlPhotos',1);
      rq.onupgradeneeded=()=>{const d=rq.result;
        if(!d.objectStoreNames.contains('p')) d.createObjectStore('p',{keyPath:'key'});};
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
    }catch(e){rej(e);}
  });
  return _db;
}
async function phPut(r){const d=await db(); return new Promise((res,rej)=>{
  const tx=d.transaction('p','readwrite'); tx.objectStore('p').put(r);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});}
async function phDel(k){const d=await db(); return new Promise((res,rej)=>{
  const tx=d.transaction('p','readwrite'); tx.objectStore('p').delete(k);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});}
async function phAll(){const d=await db(); return new Promise((res,rej)=>{
  const out={}; const tx=d.transaction('p','readonly');
  const c=tx.objectStore('p').openCursor();
  c.onsuccess=e=>{const cu=e.target.result; if(cu){out[cu.value.key]=cu.value.data; cu.continue();} else res(out);};
  c.onerror=()=>rej(c.error);});}
let phCache={};
/* 동영상은 Blob으로 보관한다(base64로 들고 있으면 메모리가 터진다).
   화면에 붙일 때만 objectURL을 만들어 캐시한다. */
const blobURLs={};
function mediaURL(key, remote){
  const v=phCache[key];
  if(v instanceof Blob){
    if(!blobURLs[key]) blobURLs[key]=URL.createObjectURL(v);
    return blobURLs[key];
  }
  return v || remote || '';
}
/* 옛 형식(사진 1장 = v.key)을 media 배열로 통일 */
function mvMedia(v){
  if(Array.isArray(v.media)) return v.media;
  if(v.key) return [{key:v.key, type:'image', remote:v.url2||null}];
  return [];
}
function compress(file,maxW,q){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const sc=img.width>maxW?maxW/img.width:1;
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',q));
      };
      img.onerror=rej; img.src=ev.target.result;
    };
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}

/* 이번 달 최소 참가 기준 — 헬스·수영 각 12회 */
function monthCount(name){
  const mk=`${now.getFullYear()}-${p2(now.getMonth()+1)}`;
  let c=0;
  Object.keys(log).forEach(k=>{
    if(!k.startsWith(mk)) return;
    if(exOf(k).some(x=>exBase(x)===name)) c++;
  });
  return c;
}
/* 이번 달 운동을 종목별로 세어 보여준다. 목표 횟수 없이 순수 카운트. */
let monthAdj=jGet('wl-month-adj', {});   // {'2026-08': {헬스:2, 수영:-1, 안함:1}}
function monthKeyNow(){ return `${now.getFullYear()}-${p2(now.getMonth()+1)}`; }
function monthCountDisplay(name){
  const mk=monthKeyNow();
  const base = name==='안함' ? monthOffCount() : monthCount(name);
  const adj=(monthAdj[mk]&&monthAdj[mk][name])||0;
  return Math.max(0, base+adj);
}
function monthOffCount(){
  const mk=monthKeyNow(); let off=0;
  Object.keys(log).forEach(k=>{
    if(!k.startsWith(mk)) return;
    const items=exOf(k);
    if(items.length && items.every(x=>exBase(x)===null)) off++;
  });
  return off;
}
function monthAdjSheet(name){
  const cur=monthCountDisplay(name);

  ov.innerHTML=`<div class="dlg">

/* ================= 하루 기록 편집기 (오늘 탭 + 기록 시트 공용) ================= */
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>';
/* 하루에 한 항목. 여러 개 했으면 각각 눌러 시간만 따로 넣는다. */
const EX_LIST=[
  ['헬스','🏋️','헬스'],
  ['수영','🏊','수영'],
  ['러닝','🏃','러닝'],
  ['안함','—', null],
];
/* 월간 집계·칼로리는 base(헬스/수영/러닝)로 판단한다 */
function exBase(x){
  const n=exName(x);
  if(typeof x==='object' && x.base) return x.base;
  if(n==='안함'||n==='못함') return null;
  const hit=EX_LIST.find(e=>e[0]===n); if(hit) return hit[2];
  // 예전 분할 루틴 이름은 헬스로 본다
  if(/가슴|등·어깨|하체|인클라인/.test(n||'')) return n==='인클라인'? '인클라인' : '헬스';
  return n;
}

/* ===== 운동 소모 칼로리 =====
   kcal = MET × 3.5 × 체중(kg) ÷ 200 × 분
   헬스는 부위보다 강도(쉬는 시간·중량)가 소모량을 가르므로 강도 3단계로 받는다.
   러닝은 거리를 넣으면 실제 속도로 MET를 다시 잡는다. */
const MET={
  '헬스':    [3.5, 5.0, 6.0],
  '수영':    [5.8, 8.3, 10.0],
  '인클라인':[5.3, 7.0, 8.5],
  '러닝':    [7.0, 9.8, 11.5],
};
const LEVEL_LABEL=['가볍게','보통','빡세게'];
const RUN_TABLE=[[6.4,6.0],[8.0,8.3],[9.7,9.8],[11.3,11.0],[12.9,11.8],[14.5,12.8]];
function runMET(kmh){
  if(kmh<=RUN_TABLE[0][0]) return RUN_TABLE[0][1];
  for(let i=1;i<RUN_TABLE.length;i++){
    const [s1,m1]=RUN_TABLE[i-1], [s2,m2]=RUN_TABLE[i];
    if(kmh<=s2) return m1+(m2-m1)*((kmh-s1)/(s2-s1));
  }
  return RUN_TABLE[RUN_TABLE.length-1][1];
}
function exKcal(item, weight){
  if(!item || !item.min || !weight) return 0;
  const base=exBase(item);
  if(!base) return 0;                       // '못함'은 0
  let met=(MET[base]||MET['헬스'])[item.level??1];
  if(base==='러닝' && item.dist>0 && item.min>0) met=runMET(item.dist/(item.min/60));
  // 가만히 있어도 타는 몫(MET 1)은 빼야 '운동으로 더 쓴 칼로리'가 된다
  return Math.round(Math.max(0,met-1)*3.5*weight/200*item.min);
}
function dayBurn(dateKey){
  const w=weightOn(dateKey);
  if(!w) return {kcal:0,items:[]};
  const items=exOf(dateKey);
  return {kcal:items.reduce((s,x)=>s+exKcal(x,w),0), items};
}

  const prevW = prevIdx.length? prevIdx[prevIdx.length-1].w : null;
  let deltaHtml='';
  if(d.w!=null && prevW!=null){
    const diff=prevW-d.w;
    deltaHtml=`<span class="delta ${diff>=0?'dn':'up'}">${diff>=0?'−':'+'}${Math.abs(diff).toFixed(1)}kg</span>`;
  }
  wc.innerHTML=`
    <div class="w-now">
      <span class="big">${d.w!=null? d.w.toFixed(1):'--'}</span>${deltaHtml}
      <span class="sub">${isToday?'오늘':shortD(dateKey)+' 기록'}</span>
    </div>
    <div class="w-row">
      <div class="fld"><label>체중 kg</label><input class="inW" type="number" inputmode="decimal" step="0.1" placeholder="0.0" value="${d.w!=null?d.w:''}"></div>
      <button class="save-btn">체중 기록</button>
    </div>`;
  wc.querySelector('.save-btn').onclick=()=>{
    const w=parseFloat(wc.querySelector('.inW').value);
    if(!w){ toast('체중을 입력하세요'); return; }
    d.w=w;
    if(prof.start==null){ prof.start=w; jSet(K_PROF,prof); }
    saveLog(); toast('기록됨'); onDataChanged(); renderDayEditor(container,dateKey);
  };
  container.appendChild(wc);

  /* --- 운동 (하나로 통합) --- */
  const ec=document.createElement('div'); ec.className='card';
  const wNow=weightOn(dateKey);
  const exRow=document.createElement('div'); exRow.className='ex-row';
  EX_LIST.forEach(([name,em,base])=>{
    const item=d.ex.list.find(x=>exName(x)===name);
    const bt=document.createElement('button');
    bt.className='ex'+(item?' on':'')+(base===null?' skip':'');
    const kc=item? exKcal(item,wNow):0;
    bt.innerHTML=`<span class="em">${em}</span>${name}`
      + (item&&base? `<span class="ex-sub">${item.min}분${kc?` · ${kc}`:''}</span>` : '');
    bt.onclick=()=>{
      if(base===null){
        const already=d.ex.list.some(x=>exName(x)==='안함');
        d.ex.list = already? [] : [{name:'안함', base:null, min:0, level:1}];
        saveLog(); onDataChanged(); renderDayEditor(container,dateKey);
        if(!already) toast('오늘 운동 안함');
        return;
      }
      exSheet(d, dateKey, name, base, ()=>renderDayEditor(container,dateKey));
    };
    exRow.appendChild(bt);
  });
  ec.appendChild(exRow);
  const burn=dayBurn(dateKey);
  if(burn.kcal){
    const tot=document.createElement('div'); tot.className='ex-total';
    tot.innerHTML=`오늘 소비 <b>${burn.kcal.toLocaleString()}kcal</b>`;
    ec.appendChild(tot);
  } else if(!wNow){
    const warn=document.createElement('div'); warn.className='ex-total mut';
    warn.textContent='체중을 먼저 기록하면 운동 소비 칼로리가 계산됩니다.';
    ec.appendChild(warn);
  }
  container.appendChild(document.createElement('div')).className='sec-t';
  container.lastChild.textContent='오늘 한 운동';
  container.appendChild(ec);

  /* --- 수면 (그날 기준) --- */
  const slRec=sleeps.find(x=>x.d===dateKey);
  const sc=document.createElement('div'); sc.className='card';
  sc.innerHTML = slRec
    ? `<div class="sl-today ${slRec.hours<SLEEP_MIN?'short':'good'}">
         <div class="sl-h">${slRec.hours}<small>시간</small></div>
         <div class="sl-time">${fmtHM(slRec.from)} → ${fmtHM(slRec.to)}</div>
         <button class="sl-edit">수정</button></div>`
    : `<button class="sl-add">＋ 수면 기록</button>`;
  const slBtn=sc.querySelector('.sl-edit')||sc.querySelector('.sl-add');
  slBtn.onclick=()=>sleepSheet(slRec||null, dateKey);
  container.appendChild(document.createElement('div')).className='sec-t';
  container.lastChild.textContent='수면';
  container.appendChild(sc);

  /* --- 체크리스트 --- */
  const cc=document.createElement('div'); cc.className='card';
  const list=document.createElement('div');
  if(!tasks.length){ list.innerHTML='<div class="empty" style="padding:20px 8px">항목이 없습니다.<br>아래에서 추가하세요.</div>'; }
  tasks.forEach(t=>{
    const done=!!d.chk[t.id];
    const row=document.createElement('div'); row.className='chk-row'+(done?' done':'');
    row.innerHTML=`<div class="box">${CK}</div><div class="chk-txt">${esc(t.text)}</div>
      <button class="chk-edit">✎</button><button class="chk-del">✕</button>`;
    // 체크 하나 누를 때 화면을 통째로 다시 그리면 스크롤이 튀고 사진까지 다시 로드된다.
    // 해당 줄만 즉시 바꾸고, 무거운 갱신은 헤더·백업만 돌린다.
    let on=done;
    const toggle=()=>{
      on=!on;
      if(on) d.chk[t.id]=true; else delete d.chk[t.id];
      row.classList.toggle('done',on);
      saveLog(); renderHead(); ghAutoBackupSoon();
    };
    row.querySelector('.chk-txt').onclick=toggle;
    row.querySelector('.box').onclick=toggle;
    row.querySelector('.chk-edit').onclick=()=>{
      const cur=t.text;
      row.innerHTML=`<input class="chk-input" type="text" value="${esc(cur)}">
        <button class="chk-ok">저장</button><button class="chk-cancel">취소</button>`;
      const ipt=row.querySelector('.chk-input');
      ipt.focus(); ipt.setSelectionRange(cur.length,cur.length);
      const commit=()=>{
        const v=ipt.value.trim();
        if(!v){ toast('내용을 입력하세요'); ipt.focus(); return; }
        t.text=v; jSet(K_TASK,tasks); toast('수정됨');
        onDataChanged(); renderDayEditor(container,dateKey);
      };
      row.querySelector('.chk-ok').onclick=commit;
      row.querySelector('.chk-cancel').onclick=()=>renderDayEditor(container,dateKey);
      ipt.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); });
    };
    row.querySelector('.chk-del').onclick=()=>ask(`"${esc(t.text)}"\n항목을 삭제할까요? (모든 날짜에서 사라집니다)`,()=>{
      tasks=tasks.filter(x=>x.id!==t.id); jSet(K_TASK,tasks); toast('삭제됨');
      onDataChanged(); renderDayEditor(container,dateKey);
    });
    list.appendChild(row);
  });
  cc.appendChild(list);
  const addRow=document.createElement('div'); addRow.className='add-row';
  addRow.innerHTML=`<input type="text" placeholder="항목 추가 (예: 계단 10층)"><button>＋</button>`;
  const inp=addRow.querySelector('input');
  const doAdd=()=>{ const v=inp.value.trim(); if(!v){inp.focus();return;}
    tasks.push({id:'t'+Date.now().toString(36),text:v}); jSet(K_TASK,tasks);
    onDataChanged(); renderDayEditor(container,dateKey); };
  addRow.querySelector('button').onclick=doAdd;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();});
  cc.appendChild(addRow);
  container.appendChild(document.createElement('div')).className='sec-t';
  container.lastChild.textContent='체크리스트';
  container.appendChild(cc);
  if(isToday){
    const hint=document.createElement('div'); hint.className='hint';
    hint.textContent='체크는 매일 0시에 리셋됩니다. 항목 자체는 그대로 남습니다.';
    container.appendChild(hint);
  }

  /* --- 식단 --- */
  const mc=document.createElement('div'); mc.className='card';
  const addRow2=document.createElement('div'); addRow2.className='meal-add';
  SLOTS.forEach(s=>{
    const b=document.createElement('button'); b.textContent='📷 '+s;
    b.onclick=()=>slotChoice(dateKey, s, ()=>renderDayEditor(container,dateKey));
    addRow2.appendChild(b);
  });
  mc.appendChild(addRow2);
  const dayMeals=meals.filter(m=>m.d===dateKey);
  if(!dayMeals.length){
    const e=document.createElement('div'); e.className='empty'; e.style.padding='18px 8px';
    e.textContent='이 날 식단 기록이 없습니다.'; mc.appendChild(e);
  } else {
    dayMeals.forEach(m=>mc.appendChild(buildMealCard(m,()=>renderDayEditor(container,dateKey))));
  }
  container.appendChild(document.createElement('div')).className='sec-t';
  container.lastChild.textContent='식단';
  container.appendChild(mc);
}

/* 끼니를 누르면 사진으로 기록할지, 공복(안 먹음)으로 남길지 고른다 */
function slotChoice(dateKey, slot, onChange){
  const already = meals.find(m=>m.d===dateKey && m.slot===slot && m.fasted);
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg">
    <div class="dlg-t">${slot} 기록</div>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:15px">
      ${already? '이미 공복으로 기록된 끼니입니다.' : '사진을 남기거나, 안 먹었으면 공복으로 표시하세요.'}</div>
    <button class="dlg-b p" id="cPhoto" style="width:100%;margin-bottom:8px">📷 사진으로 기록</button>
    <button class="dlg-b" id="cFast" style="width:100%">🚫 공복 — 안 먹었어요 (0kcal)</button>
    <div class="dlg-btns"><button class="dlg-b" data-r="n" style="width:100%">취소</button></div>
  </div>`;
  ov.querySelector('#cPhoto').onclick=()=>{
    ov.remove();
    pendingAdd={d:dateKey, slot};
    document.getElementById('photoIn').click();
  };
  ov.querySelector('#cFast').onclick=()=>{
    ov.remove();
    if(already){ toast('이미 공복으로 기록됨'); return; }
    meals.unshift({id:'f'+Date.now().toString(36), d:dateKey, slot, memo:'', fasted:true});
    jSet(K_MEAL,meals); toast(`${slot} 공복 기록`);
    onDataChanged(); onChange();
  };
  ov.addEventListener('click',e=>{
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);
}

/* 채팅에서 받은 분석 결과를 붙여넣으면 숫자만 뽑아서 정리 */
function parseNutrition(text){
  const num=(re)=>{ const mm=text.match(re); return mm? Math.round(parseFloat(mm[1])) : null; };
  const kcal    = num(/([\d,]+(?:\.\d+)?)\s*(?:kcal|칼로리|킬로칼로리)/i);
  const protein = num(/단백질[^\d]{0,6}([\d.]+)/);
  const fat     = num(/지방[^\d]{0,6}([\d.]+)/);
  const carbs   = num(/(?:탄수화물|탄수)[^\d]{0,6}([\d.]+)/);
  const fiber   = num(/(?:식이섬유|섬유질)[^\d]{0,6}([\d.]+)/);
  let food=null;
  const fm=text.match(/^\s*(?:음식\s*[:：]\s*)?([^\n·,(]{1,20}?)\s*(?:·|,|\(|\n|약|\d)/);
  if(fm) food=fm[1].trim().replace(/[\s\-–—:：]+$/,'');
  if(kcal==null && protein==null && fat==null && carbs==null && fiber==null) return null;
  return {food:food||null, kcal, protein, fat, carbs, fiber};
}
function pasteSheet(m,onChange){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg">
    <div class="dlg-t">분석 결과 붙여넣기</div>

      칼로리·단백질·지방·탄수만 뽑아서 정리해 줍니다.</div>
    <textarea id="pTxt" rows="5" placeholder="예) 김치찌개 · 약 450kcal, 단백질 28g, 지방 18g, 탄수화물 40g"
      style="width:100%;padding:12px;border-radius:11px;border:1.5px solid transparent;background:var(--raise);color:var(--text);font-size:14px;line-height:1.6;outline:none;resize:none;overflow:hidden;font-family:inherit">${esc(m.rawPaste||'')}</textarea>
    <div id="pPrev" style="margin-top:11px"></div>
    <div class="dlg-btns"><button class="dlg-b" data-r="n">취소</button>
      <button class="dlg-b p" data-r="y">정리해서 저장</button></div>
  </div>`;
  const ta=ov.querySelector('#pTxt');
  const prev=ov.querySelector('#pPrev');
  bindAutoGrow(ta);
  const paint=()=>{
    const n=parseNutrition(ta.value);
    prev.innerHTML = n
      ? `<div class="calc-card" style="margin-bottom:0;padding:13px">
          <div class="calc-top"><span class="t">${esc(n.food||'인식된 값')}</span></div>
          <div class="calc-kcal" style="font-size:24px;margin:2px 0 10px">${n.kcal?n.kcal.toLocaleString():'—'}<small>kcal</small></div>
          <div class="calc-grid" style="grid-template-columns:repeat(3,1fr)">
            <div><b>${n.protein??'—'}g</b><span>단백질</span></div>
            <div><b>${n.fat??'—'}g</b><span>지방</span></div>
            <div><b>${n.carbs??'—'}g</b><span>탄수</span></div>
          </div></div>`
      : `<div style="font-size:11.5px;color:var(--dim);padding:2px">숫자를 찾지 못했습니다. kcal·단백질·지방·탄수가 들어간 문장을 붙여넣어 보세요.</div>`;
  };
  ta.addEventListener('input',paint);
  ov.addEventListener('click',e=>{
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='y'){
      const n=parseNutrition(ta.value);
      if(!n){ toast('인식할 숫자가 없습니다'); return; }
      m.nut=n; m.rawPaste=ta.value.trim();
      if(!m.memo && n.food) m.memo=n.food;
      jSet(K_MEAL,meals); ov.remove(); toast('정리 완료');
      ghAutoBackupSoon(); onDataChanged(); onChange();
    } else if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);
  paint();
}

/* ================= 레벨 ================= */
const LV_MAX=10;
function levelInfo(){
  if(prof.start==null||prof.goal==null) return null;
  const span=Math.max(.1, prof.start-prof.goal);
  const per=span/LV_MAX;
  const w=curW();
  const lost=Math.max(0, prof.start-w);
  const lv=Math.max(0, Math.min(LV_MAX, Math.floor(lost/per)));
  return {span,per,w,lost,lv};
}
/* ================= 칼로리 저장 원리 =================
   "하루 초과 = 바로 지방"이 아니라는 걸 이번 달 실제 기록으로 보여준다. */
const FAT_KCAL_PER_KG=7700;
const BUFFER_FRAC=0.3;
const BUFFER_CAP=2500;

function monthlySurplus(){
  const mt=prof.macroTarget;
  if(!mt) return null;
  const mk=`${now.getFullYear()}-${p2(now.getMonth()+1)}`;
  let sum=0, days=0;
  Object.keys(log).sort().forEach(k=>{
    if(!k.startsWith(mk)) return;
    const it=dayIntake(k);
    if(!it.n) return;
    sum+=((it.kcal-dayBurn(k).kcal)-mt.kcal);
    days++;
  });
  return {sum, days};
}

function renderSurplusCard(){
  const el=document.getElementById('surplusCard');
  if(!el) return;
  const s=monthlySurplus();
  if(!s || !prof.macroTarget || !s.days){
    el.innerHTML=`<div class="sec-t">칼로리는 어떻게 쌓이나</div>
      <div class="card quiet sp-empty">${!prof.macroTarget
        ? '⚙ 칼로리 계산기로 목표를 정하면 이번 달 잉여·적자가 쌓여서 보입니다.'
        : '이번 달 식단을 기록하면 여기 쌓입니다.'}</div>`;
    return;
  }
  const kg=Math.abs(s.sum)/FAT_KCAL_PER_KG;
  const dir = s.sum>0 ? 'up' : (s.sum<0 ? 'dn' : 'flat');
  el.innerHTML=`<div class="sec-t">칼로리는 어떻게 쌓이나</div>
    <button class="card quiet sp-card" id="spOpen">
      <div class="sp-row">
        <span class="sp-emoji">${dir==='up'?'🧈':(dir==='dn'?'🔥':'⚖️')}</span>
        <div class="sp-mid">
          <div class="sp-lbl">이번 달 누적 · ${s.days}일 기록</div>
          <div class="sp-num ${dir}">${s.sum>=0?'+':'−'}${Math.abs(Math.round(s.sum)).toLocaleString()}<small>kcal</small></div>
        </div>
        <span class="sp-more">자세히 ›</span>
      </div>
      <div class="sp-hint">${dir==='up'?`약 ${kg.toFixed(2)}kg 늘어나는 방향`
        : dir==='dn'?`약 ${kg.toFixed(2)}kg 줄어드는 방향` : '거의 균형'}</div>
    </button>`;
  el.querySelector('#spOpen').onclick=surplusSheet;
}

    <div class="dlg-btns"><button class="dlg-b p" data-r="n" style="width:100%">닫기</button></div>
  </div>`;
  ov.addEventListener('click',e=>{
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);

  const liquid=ov.querySelector('#spLiquid');
  const bigEl=ov.querySelector('#spBig');
  const isSurplus=s.sum>=0;
  const magnitude=Math.abs(s.sum);
  const pct=Math.min(100, magnitude/(BUFFER_CAP*3.2)*100);
  const overBuffer=magnitude>BUFFER_CAP;
  liquid.classList.toggle('over', isSurplus && overBuffer);
  liquid.classList.toggle('dn', !isSurplus);
  requestAnimationFrame(()=>setTimeout(()=>{ liquid.style.height=pct+'%'; },80));
  countUp(bigEl, magnitude, 900);
  setTimeout(()=>bigEl.insertAdjacentHTML('beforeend','<small>kcal</small>'),950);
  ov.querySelector('#spSub').textContent = isSurplus
    ? (overBuffer? `완충 구간을 넘었습니다 · 약 ${kg.toFixed(2)}kg 늘어나는 방향`
                 : '아직 완충 구간 안 · 지방 전환 전')
    : `적자 상태 · 약 ${kg.toFixed(2)}kg 줄어드는 방향`;
}

/* 0에서 목표값까지 부드럽게 올라가는 숫자 */
function countUp(node, target, dur){
  if(!node) return;
  const t0=(window.performance&&performance.now)? performance.now() : Date.now();
  const step=nowT=>{
    const p=Math.min(1,(nowT-t0)/dur);
    node.textContent=(target*(1-Math.pow(1-p,3))).toFixed(1);
    if(p<1) requestAnimationFrame(step);
    else node.textContent=target.toFixed(1);
  };
  requestAnimationFrame(step);
}

/* ===== 주간 평균 =====
   월요일 시작으로 묶고, 기록된 날만으로 평균을 낸다. */
function weekKey(dateKey){
  const d=parseD(dateKey);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return dkey(d);
}
function weeklyAvgs(){
  const buck={};
  sortedW().forEach(r=>{ (buck[weekKey(r.d)]=buck[weekKey(r.d)]||[]).push(r.w); });
  return Object.keys(buck).sort().map(k=>({
    start:k, n:buck[k].length,
    avg:buck[k].reduce((s,x)=>s+x,0)/buck[k].length,
  }));
}
function renderWeekAvg(){
  const el=document.getElementById('weekAvg');
  if(!el) return;
  const ws=weeklyAvgs();
  if(!ws.length){
    el.innerHTML=`<div class="card wa-card"><div class="wa-empty">
      아침 공복 체중을 기록하면 한 주씩 묶어 평균을 냅니다.<br>
      하루 체중은 물·소금으로 흔들리지만 주 평균은 그 소음이 걷힙니다.</div></div>`;
    return;
  }
  const cur=ws[ws.length-1];
  const prev=ws.length>1? ws[ws.length-2] : null;
  const diff=prev? cur.avg-prev.avg : null;
  const e=parseD(cur.start); e.setDate(e.getDate()+6);
  const sD=parseD(cur.start);
  const range=`${sD.getMonth()+1}/${sD.getDate()}~${e.getMonth()+1}/${e.getDate()}`;
  const recent=ws.slice(-8);
  const vals=recent.map(x=>x.avg);
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const span=Math.max(0.4, mx-mn);

  el.innerHTML=`<div class="card lift wa-card">
    <div class="wa-head">
      <div>
        <div class="wa-lbl">이번 주 평균 <span class="wa-range">${range}</span></div>
        <div class="wa-val"><span id="waNum">0.0</span><small>kg</small></div>
        <div class="wa-n">${cur.n}일치 기록${cur.n<7?' · 아직 한 주가 안 찼습니다':''}</div>
      </div>
      ${diff!=null?`<div class="wa-diff ${diff<0?'dn':(diff>0?'up':'eq')}" id="waDiff">
        <span class="wa-arrow">${diff<0?'▼':(diff>0?'▲':'―')}</span>
        <span class="wa-dnum">0.0</span><small>kg</small>
        <span class="wa-sub">지난주 대비</span></div>`
      :`<div class="wa-diff eq"><span class="wa-sub">다음 주부터<br>비교됩니다</span></div>`}
    </div>
    ${prev?`<div class="wa-prev">지난주 평균 <b>${prev.avg.toFixed(1)}kg</b> · ${prev.n}일치</div>`:''}
    <div class="wa-bars">
      ${recent.map((x,i)=>{
        const h=18+((x.avg-mn)/span)*62;
        const last=i===recent.length-1;
        const d2=parseD(x.start);
        return `<div class="wa-bcol">
          <span class="wa-bval">${x.avg.toFixed(1)}</span>
          <div class="wa-bwrap"><div class="wa-bar${last?' cur':''}" data-h="${h.toFixed(1)}"></div></div>
          <span class="wa-bd">${d2.getMonth()+1}/${d2.getDate()}</span></div>`;
      }).join('')}
    </div>
  </div>`;

  requestAnimationFrame(()=>{
    el.querySelectorAll('.wa-bar').forEach((b,i)=>
      setTimeout(()=>{ b.style.height=b.dataset.h+'px'; }, 60+i*55));
  });
  countUp(el.querySelector('#waNum'), cur.avg, 900);
  if(diff!=null){
    const dEl=el.querySelector('#waDiff');
    countUp(dEl.querySelector('.wa-dnum'), Math.abs(diff), 900);

function renderMonthStats(){

    if(!k.startsWith(mk)) return;
    if(hasEx(k)){ days++; burn+=dayBurn(k).kcal; }
    if(log[k].w!=null) ws.push(log[k].w);
  });
  const delta = ws.length>=2 ? ws[ws.length-1]-ws[0] : null;
  el.innerHTML=`<div class="ms-grid">
    <div><b>${days}</b><span>운동한 날</span></div>

function renderSpark(){
  const svg=document.getElementById('spark');
  const rows=sortedW().slice(-30);
  if(rows.length<2){
    svg.innerHTML='<text x="150" y="68" text-anchor="middle" fill="#A9A9AE" font-size="12">체중을 2번 이상 기록하면 선이 그려집니다</text>';
    return;
  }
  const ws=rows.map(r=>r.w);
  const mn=Math.min(...ws)-.6, mx=Math.max(...ws)+.6;
  const X=i=>10+i*(280/(rows.length-1));
  const Y=w=>120-((w-mn)/(mx-mn))*105;
  const ma=rows.map((_,i)=>{ const win=rows.slice(Math.max(0,i-6),i+1); return win.reduce((s,x)=>s+x.w,0)/win.length; });
  const path=a=>a.map((w,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(w).toFixed(1)}`).join(' ');
  svg.innerHTML=`
    <path d="${path(ws)}" fill="none" stroke="#E5E5EA" stroke-width="1.5"/>
    <path d="${path(ma)}" fill="none" stroke="#24BE5C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${ws.map((w,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(w).toFixed(1)}" r="2.2" fill="#6E6E73"/>`).join('')}

    <text x="10" y="128" fill="#A9A9AE" font-size="10">${mn.toFixed(1)}</text>`;
}

            ${mCount?`<span class="wk-chip m">식단 ${mCount}</span>`:''}

        </div>

      card.onclick=()=>openDaySheet(k);

    }

  }
}

/* 여러 장을 좌우로 넘기는 캐러셀. 탭(좌/우 절반) + 스와이프 모두 지원 */
function buildCarousel(mediaList, onOpen){
  const wrap=document.createElement('div'); wrap.className='mv-car';
  let i=0;
  const track=document.createElement('div'); track.className='mv-track';
  mediaList.forEach(md=>{
    const cell=document.createElement('div'); cell.className='mv-cell';
    if(md.type==='video'){
      const v=document.createElement('video');
      v.src=mediaURL(md.key, md.remote); v.controls=true; v.playsInline=true; v.preload='metadata';
      cell.appendChild(v);
    } else {
      const im=document.createElement('img');
      im.src=mediaURL(md.key, md.remote); im.loading='lazy';
      im.onclick=()=>onOpen(i);
      cell.appendChild(im);
    }
    track.appendChild(cell);
  });
  wrap.appendChild(track);

  const multi=mediaList.length>1;
  let dots=null;
  if(multi){
    dots=document.createElement('div'); dots.className='mv-dots';
    mediaList.forEach(()=>dots.appendChild(document.createElement('i')));
    wrap.appendChild(dots);
    const cnt=document.createElement('div'); cnt.className='mv-count';
    wrap.appendChild(cnt);
    const prev=document.createElement('button'); prev.className='mv-nav l'; prev.textContent='‹';
    const next=document.createElement('button'); next.className='mv-nav r'; next.textContent='›';
    wrap.appendChild(prev); wrap.appendChild(next);
    prev.onclick=e=>{e.stopPropagation(); go(i-1);};
    next.onclick=e=>{e.stopPropagation(); go(i+1);};
    const paint=()=>{
      track.style.transform=`translateX(${-i*100}%)`;
      [...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i));
      cnt.textContent=`${i+1} / ${mediaList.length}`;
      prev.style.visibility=i===0?'hidden':'visible';
      next.style.visibility=i===mediaList.length-1?'hidden':'visible';
    };
    var go=n=>{ i=Math.max(0,Math.min(mediaList.length-1,n)); paint(); };
    // 스와이프
    let x0=null,y0=null;
    wrap.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
    wrap.addEventListener('touchend',e=>{
      if(x0==null) return;
      const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
      if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) go(dx<0? i+1 : i-1);
      x0=null;
    },{passive:true});
    paint();
  }
  return wrap;
}

function openLightbox(mediaList, start){

/* ================= 칼로리 계산기 =================
   출처: SNS 트레이너 공식 — 칼로리=체중×23(웨이트 주4회+=25), 단백질=체중×2.2g,
   지방=체중×0.7g, 탄수=(총칼로리-단백질·지방칼로리)÷4, 식이섬유=칼로리÷1000×14
   1,300kcal 밑으로는 안 내려가게 하한선. 2주 굴려보고 체중 안 움직이면 재조정하라는
   전제가 붙어 있어서, 계산기에도 그대로 남겨둠. */
/* Mifflin-St Jeor (1990) — 현재 가장 널리 쓰이는 기초대사량 공식.
   BMR = 10×체중 + 6.25×키 − 5×나이 (+5 남 / −161 여)
   TDEE = BMR × 활동계수, 목표 = TDEE − 감량폭.
   단백질·지방은 현재 체중이 아니라 목표 체중 기준으로 잡는다.
   체지방이 많을수록 현재 체중 기준은 과다하게 나오기 때문. */
const ACT=[
  {k:1.2,   label:'거의 앉아서', desc:'사무직·운동 거의 안 함'},
  {k:1.375, label:'가벼움',      desc:'주 1~3회 가벼운 운동'},
  {k:1.55,  label:'보통',        desc:'주 3~5회 중간 강도'},
  {k:1.725, label:'활발',        desc:'주 6~7회 강도 높은 운동'},
];
const DEFICIT=[
  {v:300, label:'천천히', desc:'주 약 0.3kg'},
  {v:500, label:'표준',   desc:'주 약 0.5kg'},
  {v:750, label:'빠르게', desc:'주 약 0.75kg'},
];
function calcMacros(o){
  // 옛 호출 방식(체중 하나만) 호환
  if(typeof o==='number') o={weight:o, sex:'m', age:40, height:175, activity:1.375, deficit:500, goalWeight:o};
  const {weight, height, age, sex, activity, deficit} = o;
  const goalWeight = o.goalWeight || weight;
  const bmr = Math.round(10*weight + 6.25*height - 5*age + (sex==='f' ? -161 : 5));
  const tdee = Math.round(bmr*activity);
  let kcal = tdee - deficit;
  // 기초대사량 아래로는 내려가지 않게, 그리고 절대 하한 1300
  let floored=false;
  if(kcal < bmr){ kcal = bmr; floored=true; }
  if(kcal < 1300){ kcal = 1300; floored=true; }
  kcal = Math.round(kcal);
  const protein = Math.round(goalWeight*1.8);
  const fat     = Math.round(goalWeight*0.8);
  const carbs   = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  const fiber   = Math.round(kcal/1000*14);
  return {weight, height, age, sex, activity, deficit, goalWeight,
          bmr, tdee, kcal, protein, fat, carbs, fiber, floored};
}
/* 하루치 합산. 공복으로 표시한 끼니는 0으로 잡고 합산에서 제외 */
function dayIntake(dateKey){
  let kcal=0,protein=0,fat=0,carbs=0,fiber=0,n=0;
  const fastedSlots=[];
  meals.forEach(m=>{
    if(m.d!==dateKey) return;
    if(m.fasted){ fastedSlots.push(m.slot); return; }
    if(!m.nut) return;
    kcal+=m.nut.kcal||0; protein+=m.nut.protein||0;
    fat+=m.nut.fat||0; carbs+=m.nut.carbs||0; fiber+=m.nut.fiber||0; n++;
  });
  return {kcal,protein,fat,carbs,fiber,n,fastedSlots,fasting:fastedSlots.length>0};
}
function todayIntake(){ return dayIntake(TODAY); }
function renderMacroCard(){
  const el=document.getElementById('macroCard');
  const mt=prof.macroTarget;
  if(!mt){
    el.innerHTML=`<div class="calc-empty"><span class="ic">🔢</span>
      <span class="tx">체중·단백질·지방·탄수 목표를 계산해서 여기 띄워둘 수 있어요.</span>
      <button id="calcOpenBtn">계산하기</button></div>`;
  } else {
    const it=todayIntake();
    const bn=dayBurn(TODAY);
    const net=it.kcal-bn.kcal;
    const pct=Math.max(0, Math.min(100, Math.round(net/mt.kcal*100)));
    const left=mt.kcal-net;
    el.innerHTML=`<div class="calc-card">
      <div class="calc-top"><span class="t">오늘의 목표 · ${mt.weight}kg${mt.tdee?` · 활동 포함 ${mt.tdee.toLocaleString()}kcal`:''}${mt.floored?' · 하한 적용':''}</span>
        <button class="calc-edit" id="calcOpenBtn">수정</button></div>
      <div class="calc-kcal">${mt.kcal.toLocaleString()}<small>kcal</small></div>
      <div class="calc-grid">
        <div><b>${mt.protein}g</b><span>단백질</span></div>
        <div><b>${mt.fat}g</b><span>지방</span></div>
        <div><b>${mt.carbs}g</b><span>탄수</span></div>
        <div><b>${mt.fiber}g</b><span>식이섬유</span></div>
      </div>
      ${(it.n||bn.kcal)?`<div class="intake">
        <div class="intake-bar"><div class="intake-fill" style="width:${pct}%"></div></div>
        <div class="net-row">
          <span class="net-i">섭취 ${it.kcal.toLocaleString()}</span>
          <span class="net-op">−</span>
          <span class="net-b">운동 ${bn.kcal.toLocaleString()}</span>
          <span class="net-op">=</span>
          <span class="net-t">${net.toLocaleString()}<small>kcal</small></span>
        </div>
        <div class="intake-tx">단 ${it.protein}g · 지 ${it.fat}g · 탄 ${it.carbs}g · 섬 ${it.fiber}g
          <span class="${left<0?'over':''}">${left>=0?`목표까지 ${left.toLocaleString()}kcal`:`목표 ${Math.abs(left).toLocaleString()}kcal 초과`}${it.carbs>mt.carbs?` · 탄수 ${(it.carbs-mt.carbs).toLocaleString()}g 초과`:''}</span></div>
      </div>`:''}
    </div>`;
  }
  document.getElementById('calcOpenBtn').onclick=calcSheet;
}
function calcSheet(){
  const mt=prof.macroTarget||{};
  const cur={
    sex: mt.sex||'m',
    age: mt.age||'',
    height: mt.height||'',
    weight: mt.weight || (curW()!=null? curW() : (prof.start||'')),
    goalWeight: mt.goalWeight || prof.goal || '',
    activity: mt.activity||1.375,
    deficit: mt.deficit!=null? mt.deficit : 500,
  };
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg" style="max-width:350px;max-height:88vh;overflow-y:auto">
    <div class="dlg-t">칼로리 계산기</div>
    <div class="cal-note">Mifflin-St Jeor 공식 기준입니다. 키·나이·성별이 들어가야
      기초대사량이 제대로 나옵니다.</div>
    <div class="lv-seg" id="cSex" style="margin-bottom:12px">
      <button data-s="m">남성</button><button data-s="f">여성</button></div>
    <div class="row" style="display:flex;gap:8px;margin-bottom:10px">
      <div class="fld"><label>나이</label>
        <input id="cAge" type="number" inputmode="numeric" value="${cur.age}" placeholder="40"></div>
      <div class="fld"><label>키 cm</label>
        <input id="cH" type="number" inputmode="decimal" value="${cur.height}" placeholder="175"></div>
    </div>
    <div class="row" style="display:flex;gap:8px;margin-bottom:12px">
      <div class="fld"><label>현재 체중 kg</label>
        <input id="cW" type="number" inputmode="decimal" step="0.1" value="${cur.weight}" placeholder="0.0"></div>
      <div class="fld"><label>목표 체중 kg</label>
        <input id="cGW" type="number" inputmode="decimal" step="0.1" value="${cur.goalWeight}" placeholder="0.0"></div>
    </div>
    <label class="cal-lbl">활동량</label>
    <div class="act-seg" id="cAct">
      ${ACT.map(a=>`<button data-k="${a.k}"><b>${a.label}</b><span>${a.desc}</span></button>`).join('')}
    </div>
    <label class="cal-lbl">감량 속도</label>
    <div class="lv-seg" id="cDef" style="margin-bottom:14px">
      ${DEFICIT.map(x=>`<button data-v="${x.v}"><b>${x.label}</b><span>${x.desc}</span></button>`).join('')}
    </div>
    <div id="cResult"></div>
    <div class="cal-note" style="margin-top:12px">
      단백질·지방은 <b>목표 체중</b> 기준으로 잡았습니다(단백질 1.8g/kg, 지방 0.8g/kg).
      체지방이 많을 때 현재 체중으로 계산하면 현실적으로 먹기 어려운 양이 나옵니다.
      계산값은 출발점이고, 2주 정도 지켜본 뒤 체중이 안 움직이면 조정하세요.</div>
    <div class="dlg-btns"><button class="dlg-b" data-r="n">닫기</button>
      <button class="dlg-b p" data-r="y">저장</button></div>
  </div>`;
  let sex=cur.sex, act=cur.activity, def=cur.deficit;
  const read=()=>({
    sex, activity:act, deficit:def,
    age:parseInt(ov.querySelector('#cAge').value,10)||0,
    height:parseFloat(ov.querySelector('#cH').value)||0,
    weight:parseFloat(ov.querySelector('#cW').value)||0,
    goalWeight:parseFloat(ov.querySelector('#cGW').value)||0,
  });
  const paint=()=>{
    ov.querySelectorAll('#cSex button').forEach(b=>b.classList.toggle('on',b.dataset.s===sex));
    ov.querySelectorAll('#cAct button').forEach(b=>b.classList.toggle('on',+b.dataset.k===act));
    ov.querySelectorAll('#cDef button').forEach(b=>b.classList.toggle('on',+b.dataset.v===def));
    const v=read(); const r=ov.querySelector('#cResult');
    if(!v.age||!v.height||!v.weight){
      r.innerHTML='<div class="cal-need">나이·키·현재 체중을 넣으면 계산됩니다.</div>'; return;
    }
    const m=calcMacros({...v, goalWeight:v.goalWeight||v.weight});
    r.innerHTML=`<div class="calc-card" style="margin-bottom:0">
      <div class="calc-top"><span class="t">기초대사량 ${m.bmr.toLocaleString()} · 활동 포함 ${m.tdee.toLocaleString()}</span></div>
      <div class="calc-kcal">${m.kcal.toLocaleString()}<small>kcal 목표</small></div>
      <div class="calc-grid">
        <div><b>${m.protein}g</b><span>단백질</span></div>
        <div><b>${m.fat}g</b><span>지방</span></div>
        <div><b>${m.carbs}g</b><span>탄수</span></div>
        <div><b>${m.fiber}g</b><span>식이섬유</span></div>
      </div>
      ${m.floored?'<div class="calc-warn">기초대사량 아래로는 내려가지 않게 조정했습니다.</div>':''}
    </div>`;
  };
  ov.querySelector('#cSex').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(b){ sex=b.dataset.s; paint(); }});
  ov.querySelector('#cAct').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(b){ act=+b.dataset.k; paint(); }});
  ov.querySelector('#cDef').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(b){ def=+b.dataset.v; paint(); }});
  ['#cAge','#cH','#cW','#cGW'].forEach(id=>ov.querySelector(id).addEventListener('input',paint));
  ov.addEventListener('click',e=>{
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='y'){
      const v=read();
      if(!v.age||!v.height||!v.weight){ toast('나이·키·체중을 입력하세요'); return; }
      prof.macroTarget=calcMacros({...v, goalWeight:v.goalWeight||v.weight});
      jSet(K_PROF,prof); ov.remove(); toast('목표 저장됨');
      renderMacroCard(); ghAutoBackupSoon();
    } else if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);
  paint();
}

/* ================= 설정 ================= */
document.getElementById('setBtn').onclick=()=>{
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg">
    <div class="dlg-t">목표 설정</div>
    <div class="fld" style="margin-bottom:10px"><label>시작 체중 kg</label>
      <input id="sS" type="number" inputmode="decimal" step="0.1" value="${prof.start??''}" placeholder="0.0"></div>
    <div class="fld"><label>목표 체중 kg</label>
      <input id="sG" type="number" inputmode="decimal" step="0.1" value="${prof.goal??''}" placeholder="0.0"></div>
    <div style="font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:11px">
      목표 체중과 감량 속도는 건강 상태에 따라 다릅니다. 주치의와 정한 숫자를 넣으세요.<br>
      시작~목표 구간을 10단계로 나눠 레벨이 올라갑니다.</div>
    <div class="dlg-btns"><button class="dlg-b" data-r="n">닫기</button>
      <button class="dlg-b p" data-r="y">저장</button></div>
    <button class="dlg-b" id="expBtn" style="width:100%;margin-top:8px">데이터 백업 내려받기</button>
    <button class="dlg-b" id="calcBtn2" style="width:100%;margin-top:8px">🔢 칼로리 계산기</button>
    <div style="height:1px;background:var(--border);margin:16px 0"></div>
    <div class="dlg-t" style="font-size:13.5px;margin-bottom:8px">☁️ 깃허브 자동 백업</div>
    <div id="ghStatus" style="font-size:11.5px;color:var(--dim);line-height:1.6;margin-bottom:10px"></div>
    <div class="dlg-btns" style="margin-top:0; gap:6px">
      <button class="dlg-b" id="ghCfgBtn" style="padding:11px 2px; font-size:12px">연동 설정</button>
      <button class="dlg-b" id="ghPullBtn" style="padding:11px 2px; font-size:12px">불러오기</button>
      <button class="dlg-b p" id="ghBackupBtn" style="padding:11px 2px; font-size:12px">지금 백업</button>
    </div>
  </div>`;
  ghStatusText();
  ov.querySelector('#ghCfgBtn').onclick=()=>ghConfigSheet();
  ov.querySelector('#ghPullBtn').onclick=()=>ghPull(true);
  ov.querySelector('#ghBackupBtn').onclick=()=>ghBackup(true);
  ov.querySelector('#calcBtn2').onclick=()=>{ ov.remove(); calcSheet(); };
  ov.addEventListener('click',e=>{
    if(e.target.id==='expBtn'){
      const blob=new Blob([JSON.stringify({prof,log,tasks,meals},null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=`체중관리_${TODAY}.json`; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000); toast('백업 저장됨'); return;
    }
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='y'){
      const s=parseFloat(ov.querySelector('#sS').value), g=parseFloat(ov.querySelector('#sG').value);
      if(!s||!g||g>=s){ toast('목표는 시작보다 낮아야 합니다'); return; }
      prof.start=s; prof.goal=g; jSet(K_PROF,prof);
      ov.remove(); onDataChanged(); toast('저장됨');
    } else if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);
};

/* ================= 탭 · 부팅 ================= */
document.querySelectorAll('nav.bottom button').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('nav.bottom button').forEach(x=>x.classList.toggle('sel',x===t));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+t.dataset.p));
  curTab=t.dataset.p;
  renderTab(curTab);
  window.scrollTo({top:0, behavior:'instant'});
});

let curTab='today';
function renderTab(t){
  if(t!=='today'){ clearInterval(fastTimer); fastTimer=null; }
  if(t==='today'){ renderMacroCard(); renderFastCard(); renderDayEditor(document.getElementById('todayEditor'), TODAY); }
  else if(t==='level')   renderLevel();
  else if(t==='records') renderRecords();
  else if(t==='meal')    renderMealAll();
  else if(t==='motiv')   renderMotiv();
}
/* opts.backup:false → 단순 다시 그리기(부팅·탭 전환)일 때는 백업을 걸지 않는다 */
function onDataChanged(opts){
  renderHead();
  renderTab(curTab);
  if(!opts || opts.backup!==false) ghAutoBackupSoon();
}

(async()=>{
  try{ phCache=await phAll(); }catch(e){ phCache={}; }
  onDataChanged({backup:false});
  if(prof.start==null||prof.goal==null) document.getElementById('setBtn').click();
  if(ghCfg().token) ghPull(false);
})();
</script>
</body>
</html>

  const ov=document.createElement('div'); ov.className='lb';
  const stage=document.createElement('div'); stage.className='lb-stage';
  const cnt=document.createElement('div'); cnt.className='lb-count';
  ov.appendChild(stage); ov.appendChild(cnt);
  const paint=()=>{
    const md=mediaList[i];
    stage.innerHTML = md.type==='video'
      ? `<video src="${mediaURL(md.key,md.remote)}" controls playsinline autoplay></video>`
      : `<img src="${mediaURL(md.key,md.remote)}">`;
    cnt.textContent = mediaList.length>1 ? `${i+1} / ${mediaList.length}` : '';
  };
  const go=n=>{ i=(n+mediaList.length)%mediaList.length; paint(); };
  ov.onclick=e=>{
    if(e.target.tagName==='VIDEO') return;
    if(mediaList.length>1){
      const r=ov.getBoundingClientRect();
      const rel=(e.clientX-r.left)/r.width;
      if(rel<0.3){ go(i-1); return; }
      if(rel>0.7){ go(i+1); return; }
    }
    ov.remove();
  };
  let x0=null;
  ov.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  ov.addEventListener('touchend',e=>{
    if(x0==null) return;
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>40){ go(dx<0? i+1 : i-1); }
    x0=null;
  },{passive:true});
  paint(); showOverlay(ov);
}

/* 고정된 카드가 항상 위로 */
/* 정렬만 한다. 화면을 그릴 때마다 저장하면, 읽기에 실패한 빈 상태가
   그대로 저장소에 덮어써져 데이터가 사라진다. 저장은 실제 변경 시에만. */
function mvSort(){
  motiv.sort((a,b)=>{
    if(!!a.pin!==!!b.pin) return a.pin? -1 : 1;
    return 0;
  });
}

/* 사진·영상 관리 — 순서 바꾸기, 개별 삭제, 추가 */
let mvReopen=null;
function mvMediaSheet(v, onDone){
  const ov=document.createElement('div'); ov.className='ov';
  const build=()=>{
    const md=mvMedia(v);
    ov.innerHTML=`<div class="dlg" style="max-width:360px;max-height:88vh;overflow-y:auto">
      <div class="dlg-t">사진·영상 관리</div>
      <div class="mm-hint">${md.length? '화살표로 순서를 바꾸고, 필요 없는 건 삭제하세요.' : '아직 비어 있습니다.'}</div>
      <div class="mm-list">
        ${md.map((x,i)=>`
          <div class="mm-row">
            <span class="mm-no">${i+1}</span>
            <div class="mm-th">${x.type==='video'
              ? `<video src="${mediaURL(x.key,x.remote)}" preload="metadata" muted></video><span class="mm-vid">▶</span>`
              : `<img src="${mediaURL(x.key,x.remote)}">`}</div>
            <div class="mm-btns">
              <button class="mm-b" data-up="${i}" ${i===0?'disabled':''}>↑</button>
              <button class="mm-b" data-dn="${i}" ${i===md.length-1?'disabled':''}>↓</button>
              <button class="mm-b del" data-del="${i}">삭제</button>
            </div>
          </div>`).join('')}
      </div>
      <button class="dlg-b p" id="mmAdd" style="width:100%;margin-top:10px">＋ 사진·영상 추가</button>
      <div class="dlg-btns"><button class="dlg-b" data-r="n" style="width:100%">닫기</button></div>
    </div>`;
    ov.querySelector('#mmAdd').onclick=()=>{
      mvTarget=v; mvReopen=v.id;
      ov.remove();
      document.getElementById('mvIn').click();
    };
  };
  const save=()=>{ jSet('wl-motiv',motiv); renderMotiv(); if(onDone) onDone(); };
  ov.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(b){
      const md=mvMedia(v);
      if(b.dataset.up!==undefined){
        const i=+b.dataset.up; [md[i-1],md[i]]=[md[i],md[i-1]];
        v.media=md; save(); build(); return;
      }
      if(b.dataset.dn!==undefined){
        const i=+b.dataset.dn; [md[i+1],md[i]]=[md[i],md[i+1]];
        v.media=md; save(); build(); return;
      }
      if(b.dataset.del!==undefined){
        const i=+b.dataset.del; const gone=md[i];
        ask('이 항목을 삭제할까요?', ()=>{
          md.splice(i,1); v.media=md;
          delete phCache[gone.key]; delete photoSynced[gone.key];
          if(blobURLs[gone.key]){ URL.revokeObjectURL(blobURLs[gone.key]); delete blobURLs[gone.key]; }
          saveSynced(); save(); build(); toast('삭제됨');
          phDel(gone.key).catch(()=>{});
        });
        return;
      }
    }
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='n'||e.target===ov) ov.remove();
  });
  build();
  showOverlay(ov);
}

/* 메모 순서 바꾸기. 고정된 것끼리, 안 된 것끼리 안에서만 움직인다. */
function mvMove(v, dir){
  const same=motiv.filter(x=>!!x.pin===!!v.pin);
  const i=same.indexOf(v), j=i+dir;
  if(j<0||j>=same.length) return;
  const A=motiv.indexOf(same[i]), B=motiv.indexOf(same[j]);
  [motiv[A],motiv[B]]=[motiv[B],motiv[A]];
  jSet('wl-motiv',motiv); renderMotiv();
}

function renderMotiv(){
  const list=document.getElementById('mvList');
  list.innerHTML='';
  mvSort();
  if(!motiv.length){
    list.innerHTML='<div class="empty">아직 비어 있습니다.<br>자극되는 사진·영상, 다짐 한 줄, 참고 링크를<br>여기에 모아두세요.</div>';
    return;
  }
  motiv.forEach(v=>{
    const card=document.createElement('div');
    card.className='mv-card'+(v.pin?' pinned':'');
    card.dataset.mid=v.id;
    const media=mvMedia(v);
    if(media.length) card.appendChild(buildCarousel(media, n=>openLightbox(media,n)));
    const same=motiv.filter(x=>!!x.pin===!!v.pin);
    const pos=same.indexOf(v);
    const body=document.createElement('div'); body.className='mv-body';
    body.innerHTML=`
      <input class="mv-title" type="text" placeholder="제목" value="${esc(v.title||'')}">
      <textarea class="mv-note" rows="2" placeholder="내용을 적으세요">${esc(v.note||'')}</textarea>
      ${v.url? `<a class="mv-link" href="${esc(v.url)}" target="_blank" rel="noopener">🔗 ${esc(v.url)}</a>`:''}
      <div class="mv-foot">
        <button class="mv-btn mv-ord" data-up ${pos===0?'disabled':''}>↑</button>
        <button class="mv-btn mv-ord" data-dn ${pos===same.length-1?'disabled':''}>↓</button>
        <button class="mv-btn pin${v.pin?' on':''}">${v.pin?'📌 고정됨':'📌 고정'}</button>
        <span class="mv-date">${shortD(v.d)}</span>
      </div>
      <div class="mv-foot">
        <button class="mv-btn add">${media.length? '🖼 '+media.length : '＋ 사진'}</button>
        <button class="mv-btn edit">🔗 링크</button>
        <button class="mv-btn del">삭제</button>
      </div>`;
    card.appendChild(body);

    // 제목
    let tt=null;
    body.querySelector('.mv-title').addEventListener('input',e=>{
      v.title=e.target.value; clearTimeout(tt);
      tt=setTimeout(()=>jSet('wl-motiv',motiv),350);
    });
    // 본문
    let t=null;
    const noteTa=body.querySelector('.mv-note');
    bindAutoGrow(noteTa);
    noteTa.addEventListener('input',e=>{
      v.note=e.target.value; clearTimeout(t);
      t=setTimeout(()=>jSet('wl-motiv',motiv),350);
    });
    // 순서
    body.querySelector('[data-up]').onclick=()=>mvMove(v,-1);
    body.querySelector('[data-dn]').onclick=()=>mvMove(v, 1);
    // 고정 — 상태를 직접 지정해 두 번 눌리는 문제를 막는다
    const pinBtn=body.querySelector('.pin');
    pinBtn.onclick=()=>{
      if(pinBtn._busy) return;
      pinBtn._busy=true;
      const next = !v.pin;
      if(next) v.pin=true; else delete v.pin;
      mvSort(); jSet('wl-motiv',motiv);
      toast(next?'상단 고정':'고정 해제');
      renderMotiv();
    };
    body.querySelector('.add').onclick=()=>{
      if(mvMedia(v).length) mvMediaSheet(v);
      else { mvTarget=v; document.getElementById('mvIn').click(); }
    };
    body.querySelector('.edit').onclick=()=>mvLinkSheet(v);
    body.querySelector('.del').onclick=()=>ask(
      media.length? `사진·영상 ${media.length}개가 함께 삭제됩니다.\n삭제할까요?` : '이 항목을 삭제할까요?',
      ()=>{
        motiv=motiv.filter(x=>x.id!==v.id); jSet('wl-motiv',motiv);
        media.forEach(md=>{
          delete phCache[md.key]; delete photoSynced[md.key];
          if(blobURLs[md.key]){ URL.revokeObjectURL(blobURLs[md.key]); delete blobURLs[md.key]; }
          phDel(md.key).catch(()=>{});
        });
        saveSynced(); renderMotiv(); toast('삭제됨');
      });
    list.appendChild(card);
  });
}

/* 하루 영양 요약 카드. 단백질·지방·식이섬유는 초과=초록/부족=주황,
   탄수화물은 초과=빨강. 칼로리는 순 칼로리(섭취−운동) 기준. */
function buildDaySummary(dateKey){
  const mt=prof.macroTarget;
  const wrap=document.createElement('div'); wrap.className='sum-card';
  const it=dayIntake(dateKey);
  const isToday=dateKey===TODAY;
  const dt=parseD(dateKey);
  const head=`<div class="sum-head">
      <span class="sum-day">${isToday?'오늘':`${dt.getMonth()+1}월 ${dt.getDate()}일`}</span>
      ${it.fasting?`<span class="sum-fast">공복 ${it.fastedSlots.join('·')}</span>`:''}
      <span class="sum-meta">${it.n?`${it.n}끼 기록`:'기록 없음'}</span>
    </div>`;
  if(!mt){
    wrap.innerHTML=head+`<div class="sum-none">⚙ 설정 → 칼로리 계산기로 목표를 먼저 정하면
      여기에 부족·초과가 계산되어 표시됩니다.</div>`;
    return wrap;
  }
  const bn=dayBurn(dateKey);
  const net=it.kcal-bn.kcal;
  const rows=[
    {name:'칼로리', got:net,        tgt:mt.kcal,    unit:'kcal', overBad:'warn'},
    {name:'단백질', got:it.protein, tgt:mt.protein, unit:'g',    overBad:'good'},
    {name:'지방',   got:it.fat,     tgt:mt.fat,     unit:'g',    overBad:'good'},
    {name:'탄수',   got:it.carbs,   tgt:mt.carbs,   unit:'g',    overBad:'bad'},
    {name:'식이섬유',got:it.fiber,  tgt:mt.fiber,   unit:'g',    overBad:'good'},
  ];
  const eq=`<div class="sum-eq">
      <span>섭취 <b>${it.kcal.toLocaleString()}</b></span>
      <span class="op">−</span>
      <span>운동 <b class="burn">${bn.kcal.toLocaleString()}</b></span>
      <span class="op">=</span>
      <span class="tot">${net.toLocaleString()}<em>kcal</em></span>
    </div>`;
  wrap.innerHTML = head + eq + rows.map(r=>{
    const diff=r.got-r.tgt;
    const pct=Math.max(0, Math.min(100, r.tgt? Math.round(r.got/r.tgt*100):0));
    let tag,tone,fill;
    if(diff>0){
      tag=`+${Math.abs(diff).toLocaleString()}${r.unit==='kcal'?'':'g'} 초과`;
      tone = r.overBad==='good' ? 't-good' : (r.overBad==='bad' ? 't-bad' : 't-warn');
      fill = r.overBad==='good' ? 'f-good' : (r.overBad==='bad' ? 'f-bad' : 'f-warn');
    } else if(diff<0){
      tag=`−${Math.abs(diff).toLocaleString()}${r.unit==='kcal'?'':'g'} 부족`;
      tone = r.overBad==='bad' ? 't-good' : 't-warn';
      fill = r.overBad==='bad' ? 'f-good' : 'f-warn';
    } else { tag='딱 맞음'; tone='t-good'; fill='f-good'; }
    if(r.got<=0 && it.n===0 && bn.kcal===0){
      tag=`−${r.tgt.toLocaleString()}${r.unit==='kcal'?'':'g'} 부족`; tone='t-mut'; fill='f-warn'; }
    return `<div class="sum-row">
      <span class="sum-name">${r.name}</span>
      <span class="sum-val">${r.got.toLocaleString()}<em> / ${r.tgt.toLocaleString()}${r.unit==='kcal'?'':'g'}</em></span>
      <span class="sum-track"><span class="sum-fill ${fill}" style="width:${pct}%"></span></span>
      <span class="sum-tag ${tone}">${tag}</span>
    </div>`;
  }).join('') + `<div class="sum-note">운동 소비는 체중·시간·강도로 낸 추정치입니다.
    목표 칼로리에 이미 감량분이 잡혀 있으니, 태운 만큼 그대로 더 먹으면 그날 적자는 사라집니다.</div>`;
  return wrap;
}

/* 기록이 쌓이면 전부 한 번에 그리면 눈에 띄게 느려진다.
   최근 며칠만 그리고 나머지는 눌렀을 때 이어서 붙인다. */
let mealDaysShown=5;
function renderMealAll(){
  const list=document.getElementById('mealAll');
  list.innerHTML='';
  list.appendChild(buildDaySummary(TODAY));
  if(!meals.length){
    const e=document.createElement('div'); e.className='empty';
    e.innerHTML='아직 기록이 없습니다.<br>오늘 탭이나 기록 탭에서 사진을 찍어 남겨보세요.';
    list.appendChild(e);
    return;
  }
  const byDay={};
  meals.forEach(m=>{ (byDay[m.d]=byDay[m.d]||[]).push(m); });
  const days=Object.keys(byDay).sort().reverse();
  const show=days.slice(0, mealDaysShown);
  const frag=document.createDocumentFragment();
  show.forEach(d=>{
    if(d!==TODAY) frag.appendChild(buildDaySummary(d));
    byDay[d].forEach(m=>frag.appendChild(buildMealCard(m, renderMealAll)));
  });
  list.appendChild(frag);
  if(days.length>show.length){
    const more=document.createElement('button');
    more.className='more-btn';
    more.textContent=`이전 기록 더보기 (${days.length-show.length}일)`;
    more.onclick=()=>{ mealDaysShown+=7; renderMealAll(); };
    list.appendChild(more);
  }
}

/* ================= 깃허브 백업 ================= */
/* index.html의 다른 탭과 같은 키를 써서, 거기서 한 번 연동해두면 여기도 자동으로 씀 */
const GH_KEY='gh-sync-v1';
function ghCfg(){ try{ return JSON.parse(lsGet(GH_KEY))||{}; }catch(e){ return {}; } }
function ghSaveCfg(c){ lsSet(GH_KEY, JSON.stringify(c)); }
function ghStatusText(msg){
  const el=document.getElementById('ghStatus'); if(!el) return;
  if(msg!==undefined){ el.textContent=msg; return; }
  const c=ghCfg();
  el.textContent = c.token ? `연동됨: ${c.owner}/${c.repo}` : '연동 안 됨 — 백업이 저장되지 않습니다';
}
async function ghApi(path, opts){
  const c=ghCfg();
  return fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`,{
    ...opts,
    headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json',...(opts&&opts.headers||{})}
  });
}
function ghConfigSheet(){
  const c=ghCfg();
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg">
    <div class="dlg-t">깃허브 백업 연동</div>
    <div style="font-size:11.5px;color:var(--dim);line-height:1.6;margin-bottom:12px">
      index.html 다른 탭에서 이미 연동했다면 그 설정을 그대로 씁니다.<br>
      Fine-grained token · <b style="color:var(--text)">Contents: Read/Write</b> 권한 필요.<br>
      <b style="color:var(--red)">⚠ 반드시 비공개 저장소로 만드세요</b> (사진이 그대로 올라갑니다)</div>
    <input class="dlg-input" id="gh-owner" placeholder="계정 (owner)" value="${esc(c.owner||'')}" style="width:100%;padding:12px;border-radius:11px;border:1.5px solid transparent;background:var(--raise);color:var(--text);font-size:15px;margin-bottom:7px">
    <input class="dlg-input" id="gh-repo" placeholder="저장소 (repo)" value="${esc(c.repo||'')}" style="width:100%;padding:12px;border-radius:11px;border:1.5px solid transparent;background:var(--raise);color:var(--text);font-size:15px;margin-bottom:7px">
    <input class="dlg-input" id="gh-token" type="password" placeholder="토큰 (github_pat_...)" value="${esc(c.token||'')}" style="width:100%;padding:12px;border-radius:11px;border:1.5px solid transparent;background:var(--raise);color:var(--text);font-size:15px">
    <div class="dlg-btns"><button class="dlg-b" data-r="n">취소</button>
    <button class="dlg-b p" data-r="y">저장</button></div>
  </div>`;
  ov.addEventListener('click',e=>{
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='y'){
      ghSaveCfg({owner:ov.querySelector('#gh-owner').value.trim(),
        repo:ov.querySelector('#gh-repo').value.trim(), branch:'main',
        token:ov.querySelector('#gh-token').value.trim()});
      ov.remove(); ghStatusText(); toast('깃허브 설정 저장됨');
    } else if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);
}
let ghBusy=false, ghTimer=null;
/* dataURL이면 잘라 쓰고, Blob(영상)이면 읽어서 base64로. 깃허브가 받아주는 크기를 넘으면 null */
const GH_MAX=24*1024*1024;
function toBase64(val){
  return new Promise(res=>{
    if(typeof val==='string') return res(val.split(',')[1]||'');
    if(!(val instanceof Blob)) return res(null);
    if(val.size>GH_MAX) return res(null);
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]||'');
    r.onerror=()=>res(null);
    r.readAsDataURL(val);
  });
}
/* ===== 백업 상태 표시 =====
   저장할 게 남았는지 / 올라갔는지를 항상 화면에 띄운다.
   조용히 실패해서 데이터가 안 올라가 있는 상황을 없애기 위함. */
let ghPending=false, ghFail=0, ghLastOk=jGet('wl-gh-last',null);
function ghBadge(state, note){
  const el=document.getElementById('syncBadge');
  if(!el) return;
  if(!ghCfg().token){
    el.className='sync-badge off';
    el.innerHTML='<span class="sy-dot"></span>백업 미연동';
    return;
  }
  const map={
    saving:['saving','<span class="sy-spin"></span>저장 중'],
    ok:['ok','<span class="sy-dot"></span>'+(note||'저장됨')],
    pending:['pending','<span class="sy-dot"></span>저장 대기'],
    err:['err','<span class="sy-dot"></span>'+(note||'저장 실패 — 눌러서 재시도')],
  };
  const [cls,html]=map[state]||map.ok;
  el.className='sync-badge '+cls;
  el.innerHTML=html;
}
function ghAgo(){
  if(!ghLastOk) return '';
  const m=Math.floor((Date.now()-ghLastOk)/60000);
  if(m<1) return '방금 저장됨';
  if(m<60) return m+'분 전 저장됨';
  const h=Math.floor(m/60);
  if(h<24) return h+'시간 전 저장됨';
  return Math.floor(h/24)+'일 전 저장됨';
}
function ghRefreshBadge(){
  if(ghBusy) return ghBadge('saving');
  if(ghFail)  return ghBadge('err');
  if(ghPending) return ghBadge('pending');
  ghBadge('ok', ghAgo());
}
function ghAutoBackupSoon(){
  if(!ghCfg().token){ ghBadge('off'); return; }
  ghPending=true; ghRefreshBadge();
  clearTimeout(ghTimer); ghTimer=setTimeout(()=>ghBackup(false),1200);
}
// 네트워크가 돌아오거나 앱으로 되돌아오면 밀린 저장을 마저 올린다
window.addEventListener('online',()=>{ if(ghPending||ghFail) ghBackup(false); });
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && (ghPending||ghFail)) ghBackup(false);
});
window.addEventListener('beforeunload',e=>{
  if(ghPending||ghFail){ e.preventDefault(); e.returnValue=''; }
});
async function ghBackup(manual){
  const c=ghCfg();
  if(!c.token){ if(manual){ toast('먼저 깃허브 연동을 설정하세요'); ghConfigSheet(); } return; }
  if(ghBusy) return;
  // 안전장치: 자동 백업(수동이 아닌 경우)은 기기 데이터가 완전히 비어 있으면
  // 절대 올리지 않는다. 서버에 물어보고 판단하는 방식은 네트워크 왕복 사이에
  // 레이스가 생길 수 있어서, "자동이면 무조건 차단"으로 단순화했다.
  // 정말 비우고 싶으면 설정에서 수동으로 "지금 백업"을 눌러야 한다.
  const localCount = Object.keys(log).length + meals.length + motiv.length + fastHist.length + sleeps.length + chHist.length;
  if(!manual && localCount===0){
    ghStatusText('기기 데이터가 비어 있어 자동 백업을 건너뜁니다');
    ghPending=false; ghBadge('err','기기 데이터 비어있음 — 자동백업 안 함');
    return;
  }
  ghBusy=true; ghStatusText('백업 중...'); ghBadge('saving');
  try{
    let up=0;
    // 업로드 대상: 식단 사진 + 동기부여 카드의 사진·영상 전부
    const jobs=[];
    meals.filter(m=>m.key).forEach(m=>jobs.push({key:m.key, ext:'jpg', set:u=>{m.url=u;}}));
    motiv.forEach(v=>mvMedia(v).forEach(md=>{
      jobs.push({key:md.key, ext:md.type==='video'?'mp4':'jpg', set:u=>{md.remote=u;}});
    }));
    for(const j of jobs){
      if(photoSynced[j.key] || !phCache[j.key]) continue;
      const b64=await toBase64(phCache[j.key]);
      if(b64==null) continue;                       // 너무 큰 영상은 기기에만 둔다
      const res=await ghApi(`health/photos/${j.key}.${j.ext}`,{method:'PUT',
        body:JSON.stringify({message:`health media ${j.key}`, content:b64, branch:c.branch||'main'})});
      if(res.ok||res.status===422){
        photoSynced[j.key]=true;
        j.set(`https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch||'main'}/health/photos/${j.key}.${j.ext}`);
        up++;
      } else { throw new Error('업로드 실패 '+res.status); }
    }
    if(up){ jSet(K_MEAL,meals); jSet('wl-motiv',motiv); }
    saveSynced();
    const manifest={updated:new Date().toISOString(), prof, log, tasks, fastHist, sleeps, challenge, chHist, monthAdj,
      meals:meals.map(m=>({id:m.id,d:m.d,slot:m.slot,memo:m.memo,key:m.key||null,url:m.url||null,nut:m.nut||null,rawPaste:m.rawPaste||null,fasted:!!m.fasted})),
      motiv:motiv.map(v=>({id:v.id,d:v.d,note:v.note||'',url:v.url||'',
        media:mvMedia(v).map(md=>({key:md.key,type:md.type,remote:md.remote||null}))}))};
    let sha=null;
    const g=await ghApi('health/data.json',{method:'GET'});
    if(g.ok) sha=(await g.json()).sha;
    const body={message:'update health data', content:btoa(unescape(encodeURIComponent(JSON.stringify(manifest)))), branch:c.branch||'main'};
    if(sha) body.sha=sha;
    const r=await ghApi('health/data.json',{method:'PUT', body:JSON.stringify(body)});
    if(!r.ok) throw new Error('데이터 저장 실패 '+r.status);
    ghStatusText(`백업 완료 · ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`);
    ghPending=false; ghFail=0;
    ghLastOk=Date.now(); jSet('wl-gh-last',ghLastOk);
    if(manual) toast('☁️ 깃허브 백업 완료');
  }catch(err){
    ghStatusText('백업 실패: '+err.message+' (토큰 권한 확인)');
    ghFail++;
    if(manual) toast('백업 실패 — 깃허브 설정 확인');
    // 조용히 포기하지 않는다: 점점 간격을 늘려가며 다시 시도
    if(ghFail<=5){
      clearTimeout(ghTimer);
      ghTimer=setTimeout(()=>{ ghBusy=false; ghBackup(false); }, Math.min(60000, 3000*Math.pow(2,ghFail-1)));
    }
  }
  ghBusy=false;
  ghRefreshBadge();
}
async function ghPull(manual){
  const c=ghCfg();
  if(!c.token){ if(manual){ toast('먼저 깃허브 연동을 설정하세요'); ghConfigSheet(); } return; }
  try{
    const res=await ghApi('health/data.json',{method:'GET', headers:{'Accept':'application/vnd.github.raw+json'}});
    if(!res.ok){ if(manual) toast('저장된 백업이 없습니다'); return; }
    const man=await res.json();
    const remoteCount=Object.keys(man.log||{}).length+(man.meals||[]).length
                     +(man.motiv||[]).length+(man.fastHist||[]).length+(man.sleeps||[]).length+(man.chHist||[]).length;
    if(remoteCount===0){
      // 서버 백업이 비어 있으면 "최신"이 아니라 문제 상황이다
      ghStatusText('서버 백업이 비어 있습니다 — 불러올 기록이 없습니다');
      if(manual) toast('서버 백업이 비어 있습니다');
      return;
    }
    let added=0;
    if(prof.start==null && man.prof && man.prof.start!=null) prof.start=man.prof.start;
    if(prof.goal==null && man.prof && man.prof.goal!=null) prof.goal=man.prof.goal;
    jSet(K_PROF,prof);
    Object.keys(man.log||{}).forEach(k=>{ if(!log[k]){ log[k]=man.log[k]; added++; } });
    saveLog();
    (man.tasks||[]).forEach(t=>{ if(!tasks.some(x=>x.id===t.id)){ tasks.push(t); added++; } });
    jSet(K_TASK,tasks);
    const haveIds=new Set(meals.map(m=>m.id));
    (man.meals||[]).forEach(m=>{
      if(!haveIds.has(m.id)){ meals.push(m); if(m.url&&m.key) phCache[m.key]=phCache[m.key]||m.url; added++; }
    });
    jSet(K_MEAL,meals);
    const haveMv=new Set(motiv.map(v=>v.id));
    (man.motiv||[]).forEach(v=>{
      if(!haveMv.has(v.id)){
        motiv.push(v);
        // 기기에 원본이 없으면 깃허브 원격 주소로 보여준다
        mvMedia(v).forEach(md=>{ if(md.remote && !phCache[md.key]) phCache[md.key]=md.remote; });
        added++;
      }
    });
    jSet('wl-motiv',motiv);
    const haveF=new Set(fastHist.map(f=>f.start));
    (man.fastHist||[]).forEach(f=>{ if(!haveF.has(f.start)){ fastHist.push(f); added++; } });
    fastHist.sort((a,b)=>b.start-a.start); fastHist=fastHist.slice(0,30);
    jSet('wl-fast-hist',fastHist);
    const haveS=new Set(sleeps.map(x=>x.d));
    (man.sleeps||[]).forEach(x=>{ if(!haveS.has(x.d)){ sleeps.push(x); added++; } });
    sleeps.sort((a,b)=>a.d<b.d?1:-1); jSet('wl-sleep',sleeps);
    // 진행 중인 도전이 이 기기에 없으면 서버 것을 이어받는다(다른 기기에서 시작한 경우)
    if(!challenge && man.challenge){ challenge=man.challenge; jSet('wl-challenge',challenge); added++; }
    const haveCh=new Set(chHist.map(x=>x.start));
    (man.chHist||[]).forEach(x=>{ if(!haveCh.has(x.start)){ chHist.push(x); added++; } });
    chHist.sort((a,b)=>b.start-a.start); jSet('wl-challenge-hist',chHist);
    if(man.monthAdj){ monthAdj={...man.monthAdj, ...monthAdj}; jSet('wl-month-adj',monthAdj); }
    if(manual) toast(added? `⬇ ${added}개 불러옴` : '기기 기록이 이미 서버와 같습니다');
    // 방금 서버에서 받아온 내용이므로 되쓰기(백업)를 걸지 않는다
    onDataChanged({backup:false});
  }catch(err){ if(manual) toast('불러오기 실패 — 깃허브 설정 확인'); }
}

/* ================= 도전 =================
   1/3/5/14/21/40일 중 골라 시작하면 그 순간부터 24시간마다 자동으로 하루가 채워진다.
   달력 날짜가 아니라 "시작 시각으로부터 몇 시간 지났나"로 계산하므로
   앱을 껐다 켜도, 자정을 넘겨도 그대로 이어진다. */
const CH_OPTS=[
  {d:1,  tag:'가볍게 시작'},
  {d:3,  tag:'작심삼일 넘기기'},
  {d:5,  tag:'평일 완주'},
  {d:14, tag:'2주 습관'},
  {d:21, tag:'습관의 벽'},
  {d:40, tag:'완전 정착'},
];
const CH_DAY_MS=24*3600*1000;
const CH_TOWER_MAX=14;   // 탑 칸 수 상한 — 40일이어도 14칸으로 압축해서 보여준다
let challenge=jGet('wl-challenge', null);      // {days, start}
let chHist=jGet('wl-challenge-hist', []);      // [{days, start, end, result, completedDays}]
let chTimer=null, chLastBlock=-1;

function chElapsedMs(){ return challenge? Math.max(0, Date.now()-challenge.start) : 0; }
function chTotalMs(){ return challenge? challenge.days*CH_DAY_MS : 0; }
function chCompletedDays(){ return Math.min(challenge?challenge.days:0, Math.floor(chElapsedMs()/CH_DAY_MS)); }

function chStart(days){
  challenge={days, start:Date.now()};
  chLastBlock=-1;
  jSet('wl-challenge', challenge);
  toast(`${days}일 도전 시작 🔥`);
  renderChallenge();
}

function chFinishSuccess(){
  chHist.unshift({days:challenge.days, start:challenge.start, end:Date.now(),
    result:'success', completedDays:challenge.days});
  chHist=chHist.slice(0,40);
  jSet('wl-challenge-hist', chHist);
  challenge=null; jSet('wl-challenge', null);
}

function chFail(){
  if(!challenge) return;
  const done=chCompletedDays();
  ask(`${done}일째입니다. 지금 실패로 기록할까요?\n탑이 무너집니다.`, ()=>{
    chHist.unshift({days:challenge.days, start:challenge.start, end:Date.now(),
      result:'fail', completedDays:done});
    chHist=chHist.slice(0,40);
    jSet('wl-challenge-hist', chHist);
    chPlayCollapse(()=>{
      challenge=null; jSet('wl-challenge', null);
      renderChallenge();
    });
  });
}

/* 탑이 와르르 무너지는 연출 — 블록마다 제각각 흔들리며 떨어진다 */
function chPlayCollapse(done){
  const tower=document.getElementById('chTower');
  if(!tower){ done(); return; }
  const blocks=[...tower.children];
  blocks.forEach((b,i)=>{
    const dx=(Math.random()*2-1)*40, rot=(Math.random()*2-1)*50;
    b.style.transition=`transform .6s cubic-bezier(.5,0,.9,1) ${i*25}ms, opacity .5s ease ${i*25}ms`;
    b.style.transform=`translate(${dx}px, 160px) rotate(${rot}deg)`;
    b.style.opacity='0';
  });
  setTimeout(done, blocks.length*25+650);
}

function chHistBadges(){
  const rows = chHist.slice(0,10).map((h,i)=>
    `<button class="ch-badge ${h.result}" data-i="${i}" title="${h.days}일 도전 · ${h.completedDays}/${h.days}">
      ${h.result==='success'?'✅':'❌'}${h.days}</button>`).join('');
  return `<div class="ch-hist">${rows}
    <button class="ch-badge add" id="chAddHist">＋</button></div>`;
}
function chHistSheet(idx){
  const editing = idx!=null;
  const cur = editing? chHist[idx] : {days:14, completedDays:14, result:'success'};
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg">
    <div class="dlg-t">${editing?'도전 기록 수정':'도전 기록 추가'}</div>
    <div class="fld" style="margin-bottom:12px"><label>목표 일수</label>
      <input id="chD" type="number" inputmode="numeric" value="${cur.days}" placeholder="14"></div>
    <div class="fld" style="margin-bottom:12px"><label>실제 채운 일수</label>
      <input id="chC" type="number" inputmode="numeric" value="${cur.completedDays}" placeholder="14"></div>
    <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px">결과</label>
    <div class="lv-seg" id="chRes" style="margin-bottom:14px">
      <button data-r="success" class="${cur.result==='success'?'on':''}">성공</button>
      <button data-r="fail" class="${cur.result==='fail'?'on':''}">실패</button>
    </div>
    <div class="dlg-btns">
      ${editing?'<button class="dlg-b" id="chDel" style="color:var(--red)">삭제</button>':'<button class="dlg-b" data-r="n">취소</button>'}
      <button class="dlg-b p" data-x="save">저장</button></div>
  </div>`;
  let res=cur.result;
  ov.querySelector('#chRes').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    res=b.dataset.r;
    ov.querySelectorAll('#chRes button').forEach(x=>x.classList.toggle('on',x===b));
  });
  const del=ov.querySelector('#chDel');
  if(del) del.onclick=()=>{
    chHist.splice(idx,1); jSet('wl-challenge-hist',chHist); ov.remove(); renderChallenge(); toast('삭제됨');
  };
  ov.addEventListener('click',e=>{
    if(e.target.dataset.x==='save'){
      const days=parseInt(ov.querySelector('#chD').value,10)||1;
      const done=Math.min(days, parseInt(ov.querySelector('#chC').value,10)||0);
      const rec={days, completedDays:done, result:res,
        start: editing? cur.start : Date.now(), end: editing? cur.end : Date.now()};
      if(editing) chHist[idx]=rec; else chHist.unshift(rec);
      chHist=chHist.slice(0,40);
      jSet('wl-challenge-hist',chHist); ov.remove(); renderChallenge(); toast('저장됨');
      return;
    }
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);
}

function renderChallenge(){
  const el=document.getElementById('chCard');
  if(!el) return;
  clearInterval(chTimer); chTimer=null;

  // 앱을 닫아둔 사이 기한을 넘겼으면 조용히 성공 처리하고 보여준다
  if(challenge && chElapsedMs()>=chTotalMs()){
    const finished=challenge.days;
    chFinishSuccess();
    el.innerHTML=`<div class="card ch-card done">
      <div class="ch-cele">🎉</div>
      <div class="ch-done-t">${finished}일 도전 성공!</div>
      <div class="ch-done-s">공든 탑이 완성됐습니다.</div>
      <button class="ch-again" id="chAgain">새 도전 시작</button>
    </div>`;
    el.querySelector('#chAgain').onclick=()=>renderChallenge();
    return;
  }

  if(!challenge){
    el.innerHTML=`<div class="card ch-card">
      <div class="ch-head"><span class="ch-t">🏆 도전</span></div>
      <div class="ch-idle">기간을 고르면 지금부터 24시간마다 자동으로 하루가 채워집니다.</div>
      <div class="ch-opts">
        ${CH_OPTS.map(o=>`<button data-d="${o.d}"><b>${o.d}일</b><span>${o.tag}</span></button>`).join('')}
      </div>
      ${chHistBadges()}
    </div>`;
    el.querySelectorAll('.ch-opts button').forEach(b=>b.onclick=()=>chStart(+b.dataset.d));
    el.querySelectorAll('.ch-badge[data-i]').forEach(b=>b.onclick=()=>chHistSheet(+b.dataset.i));
    const addH=el.querySelector('#chAddHist'); if(addH) addH.onclick=()=>chHistSheet(null);
    return;
  }

  const pct=Math.min(100, chElapsedMs()/chTotalMs()*100);
  const dayNum=Math.min(challenge.days, chCompletedDays()+1);
  const blocksTotal=Math.min(challenge.days, CH_TOWER_MAX);
  const daysPerBlock=challenge.days/blocksTotal;

  el.innerHTML=`<div class="card ch-card active">
    <div class="ch-head">
      <span class="ch-t">${challenge.days}일 도전 · <b>${dayNum}</b>일째</span>
      <button class="ch-fail" id="chFailBtn">실패</button>
    </div>
    <div class="ch-track">
      <span class="ch-flag">🚩</span>
      <div class="ch-line"><div class="ch-line-fill" id="chLineFill"></div></div>
      <span class="ch-flag">🏁</span>
      <div class="ch-runner" id="chRunner">🏃</div>
    </div>
    <div class="ch-pct" id="chPct">0%</div>
    <div class="ch-tower" id="chTower">
      ${Array.from({length:blocksTotal}).map(()=>`<div class="ch-block"></div>`).join('')}
    </div>
    <div class="ch-sub" id="chSub"></div>
  </div>`;
  el.querySelector('#chFailBtn').onclick=chFail;

  const runner=el.querySelector('#chRunner');
  const line=el.querySelector('#chLineFill');
  const pctEl=el.querySelector('#chPct');
  const subEl=el.querySelector('#chSub');
  const towerEls=[...el.querySelectorAll('.ch-block')];

  const tick=()=>{
    if(!challenge) return;
    if(chElapsedMs()>=chTotalMs()){ renderChallenge(); return; }
    const p=Math.min(100, chElapsedMs()/chTotalMs()*100);
    runner.style.left=`calc(${p}% - 14px)`;
    line.style.width=p+'%';
    pctEl.textContent=Math.floor(p)+'%';

    const nextBlockAt=(Math.floor((chElapsedMs()/CH_DAY_MS)/daysPerBlock)+1)*daysPerBlock*CH_DAY_MS;
    const remain=Math.max(0, nextBlockAt-chElapsedMs());
    subEl.textContent = challenge.days===1
      ? `완료까지 ${fmtDur(chTotalMs()-chElapsedMs())}`
      : `다음 블록까지 ${fmtDur(remain)}`;

    const progressBlocks=(chElapsedMs()/CH_DAY_MS)/daysPerBlock;
    const full=Math.floor(progressBlocks);
    towerEls.forEach((b,i)=>{
      if(i<full){ b.classList.add('fill'); b.style.setProperty('--fh','100%'); }
      else if(i===full){ b.classList.add('fill'); b.style.setProperty('--fh', Math.round((progressBlocks-full)*100)+'%'); }
      else { b.classList.remove('fill'); b.style.setProperty('--fh','0%'); }
    });
    if(full!==chLastBlock && full>0 && full<=towerEls.length){
      towerEls[full-1].classList.add('pop');
      chLastBlock=full;
    }
  };
  tick();
  chTimer=setInterval(tick,1000);
}

/* ================= 공복 타이머 =================
   구간마다 몸에서 일어나는 일을 단계로 보여준다.
   목표는 24시간까지만 고를 수 있게 했다 — 그 이상은 참고용 단계로만 표시. */
const FAST_STAGES=[
  {h:0,  name:'시작',    desc:'마지막 식사 이후 소화·흡수가 진행되는 구간입니다.'},
  {h:12, name:'12시간',  desc:'간 글리코겐이 거의 소모되고 케톤이 올라오기 시작합니다. 체지방 연소가 시작되는 지점.'},
  {h:16, name:'16시간',  desc:'16:8 구간. 케톤과 지방 연소율이 올라가고 혈당·인슐린이 안정적으로 유지됩니다.'},
  {h:18, name:'18시간',  desc:'케톤이 크게 늘고 체지방 연소가 눈에 띄게 올라갑니다. 인슐린 수치도 내려갑니다.'},
  {h:24, name:'24시간',  desc:'인슐린 저항성 개선 구간. 자가포식(오토파지)이 시작되는 지점으로 알려져 있습니다.'},
  {h:48, name:'48시간',  desc:'손상된 세포 청소·재생이 활발해진다고 보는 구간. 전문가 지도가 필요합니다.'},
  {h:72, name:'72시간',  desc:'성장호르몬이 크게 오르지만 이후 지방 연소율은 서서히 떨어집니다. 반드시 전문가와 함께.'},
];
let fastState=jGet('wl-fast', null);      // {start: ms}
let fastHist=jGet('wl-fast-hist', []);
let fastTimer=null;

function fastElapsed(){
  if(!fastState) return 0;
  // 예전 버전에서 멈춤을 쓴 기록이 있으면 그 시간만 빼준다
  return Math.max(0, Date.now() - fastState.start - (fastState.paused||0));
}
function fmtDur(ms){
  const s=Math.floor(ms/1000);
  return `${p2(Math.floor(s/3600))}:${p2(Math.floor(s%3600/60))}:${p2(s%60)}`;
}
function fastStage(hours){
  let cur=FAST_STAGES[0], next=null;
  for(let i=0;i<FAST_STAGES.length;i++){
    if(hours>=FAST_STAGES[i].h){ cur=FAST_STAGES[i]; next=FAST_STAGES[i+1]||null; }
  }
  return {cur,next};
}
function fastStart(){
  fastState={start:Date.now()};
  jSet('wl-fast',fastState); renderFastCard();

    if(!fastState){ clearInterval(fastTimer); return; }

/* ================= 수면 기록 =================
   시간대를 골라 저장한다. 자정을 넘기는 경우(23시~7시)도 자동으로 계산.
   최소 기준 5시간 — 미만이면 빨강, 이상이면 파랑. */
const SLEEP_MIN=5;
let sleeps=jGet('wl-sleep', []);   // [{d, from, to, hours}]  d=일어난 날짜
function sleepHours(from,to){

  if(h<=0) h+=24;                  // 자정을 넘긴 경우
  return Math.round(h*10)/10;
}
function fmtHM(mins){ return `${p2(Math.floor(mins/60))}:${p2(mins%60)}`; }
function sleepSheet(existing, dateKey){
  const day0=dateKey||TODAY;

  const ov=document.createElement('div'); ov.className='ov';

      <button class="dlg-b p" data-r="y">저장</button></div>
  </div>`;
  const paint=()=>{
    const f=+ov.querySelector('#slFrom').value, t=+ov.querySelector('#slTo').value;
    const h=sleepHours(f,t);
    const short=h<SLEEP_MIN;
    ov.querySelector('#slPrev').innerHTML=

       <div class="sl-note ${short?'short':'good'}">${short

  };
  ov.addEventListener('click',e=>{

      sleeps.sort((a,b)=>a.d<b.d?1:-1); sleeps=sleeps.slice(0,120);
      jSet('wl-sleep',sleeps); ov.remove(); onDataChanged({backup:false});
      toast(`${rec.hours}시간 기록`);

  showOverlay(ov); paint();

/* ================= 칼로리 계산기 =================
   출처: SNS 트레이너 공식 — 칼로리=체중×23(웨이트 주4회+=25), 단백질=체중×2.2g,
   지방=체중×0.7g, 탄수=(총칼로리-단백질·지방칼로리)÷4, 식이섬유=칼로리÷1000×14
   1,300kcal 밑으로는 안 내려가게 하한선. 2주 굴려보고 체중 안 움직이면 재조정하라는
   전제가 붙어 있어서, 계산기에도 그대로 남겨둠. */
/* Mifflin-St Jeor (1990) — 현재 가장 널리 쓰이는 기초대사량 공식.
   BMR = 10×체중 + 6.25×키 − 5×나이 (+5 남 / −161 여)
   TDEE = BMR × 활동계수, 목표 = TDEE − 감량폭.
   단백질·지방은 현재 체중이 아니라 목표 체중 기준으로 잡는다.
   체지방이 많을수록 현재 체중 기준은 과다하게 나오기 때문. */
const ACT=[
  {k:1.2,   label:'거의 앉아서', desc:'사무직·운동 거의 안 함'},
  {k:1.375, label:'가벼움',      desc:'주 1~3회 가벼운 운동'},
  {k:1.55,  label:'보통',        desc:'주 3~5회 중간 강도'},
  {k:1.725, label:'활발',        desc:'주 6~7회 강도 높은 운동'},
];
const DEFICIT=[
  {v:300, label:'천천히', desc:'주 약 0.3kg'},
  {v:500, label:'표준',   desc:'주 약 0.5kg'},
  {v:750, label:'빠르게', desc:'주 약 0.75kg'},
];
function calcMacros(o){
  // 옛 호출 방식(체중 하나만) 호환
  if(typeof o==='number') o={weight:o, sex:'m', age:40, height:175, activity:1.375, deficit:500, goalWeight:o};
  const {weight, height, age, sex, activity, deficit} = o;
  const goalWeight = o.goalWeight || weight;
  const bmr = Math.round(10*weight + 6.25*height - 5*age + (sex==='f' ? -161 : 5));
  const tdee = Math.round(bmr*activity);
  let kcal = tdee - deficit;
  // 기초대사량 아래로는 내려가지 않게, 그리고 절대 하한 1300
  let floored=false;
  if(kcal < bmr){ kcal = bmr; floored=true; }
  if(kcal < 1300){ kcal = 1300; floored=true; }
  kcal = Math.round(kcal);
  const protein = Math.round(goalWeight*1.8);
  const fat     = Math.round(goalWeight*0.8);
  const carbs   = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  const fiber   = Math.round(kcal/1000*14);
  return {weight, height, age, sex, activity, deficit, goalWeight,
          bmr, tdee, kcal, protein, fat, carbs, fiber, floored};
}
/* 하루치 합산. 공복으로 표시한 끼니는 0으로 잡고 합산에서 제외 */
function dayIntake(dateKey){
  let kcal=0,protein=0,fat=0,carbs=0,fiber=0,n=0;
  const fastedSlots=[];
  meals.forEach(m=>{
    if(m.d!==dateKey) return;
    if(m.fasted){ fastedSlots.push(m.slot); return; }
    if(!m.nut) return;
    kcal+=m.nut.kcal||0; protein+=m.nut.protein||0;
    fat+=m.nut.fat||0; carbs+=m.nut.carbs||0; fiber+=m.nut.fiber||0; n++;
  });
  return {kcal,protein,fat,carbs,fiber,n,fastedSlots,fasting:fastedSlots.length>0};
}

      <button data-s="m">남성</button><button data-s="f">여성</button></div>
    <div class="row" style="display:flex;gap:8px;margin-bottom:10px">
      <div class="fld"><label>나이</label>
        <input id="cAge" type="number" inputmode="numeric" value="${cur.age}" placeholder="40"></div>
      <div class="fld"><label>키 cm</label>
        <input id="cH" type="number" inputmode="decimal" value="${cur.height}" placeholder="175"></div>
    </div>
    <div class="row" style="display:flex;gap:8px;margin-bottom:12px">
      <div class="fld"><label>현재 체중 kg</label>
        <input id="cW" type="number" inputmode="decimal" step="0.1" value="${cur.weight}" placeholder="0.0"></div>
      <div class="fld"><label>목표 체중 kg</label>
        <input id="cGW" type="number" inputmode="decimal" step="0.1" value="${cur.goalWeight}" placeholder="0.0"></div>
    </div>
    <label class="cal-lbl">활동량</label>
    <div class="act-seg" id="cAct">
      ${ACT.map(a=>`<button data-k="${a.k}"><b>${a.label}</b><span>${a.desc}</span></button>`).join('')}
    </div>
    <label class="cal-lbl">감량 속도</label>
    <div class="lv-seg" id="cDef" style="margin-bottom:14px">
      ${DEFICIT.map(x=>`<button data-v="${x.v}"><b>${x.label}</b><span>${x.desc}</span></button>`).join('')}
    </div>
    <div id="cResult"></div>
    <div class="cal-note" style="margin-top:12px">
      단백질·지방은 <b>목표 체중</b> 기준으로 잡았습니다(단백질 1.8g/kg, 지방 0.8g/kg).
      체지방이 많을 때 현재 체중으로 계산하면 현실적으로 먹기 어려운 양이 나옵니다.
      계산값은 출발점이고, 2주 정도 지켜본 뒤 체중이 안 움직이면 조정하세요.</div>
    <div class="dlg-btns"><button class="dlg-b" data-r="n">닫기</button>
      <button class="dlg-b p" data-r="y">저장</button></div>
  </div>`;
  let sex=cur.sex, act=cur.activity, def=cur.deficit;
  const read=()=>({
    sex, activity:act, deficit:def,
    age:parseInt(ov.querySelector('#cAge').value,10)||0,
    height:parseFloat(ov.querySelector('#cH').value)||0,
    weight:parseFloat(ov.querySelector('#cW').value)||0,
    goalWeight:parseFloat(ov.querySelector('#cGW').value)||0,
  });
  const paint=()=>{
    ov.querySelectorAll('#cSex button').forEach(b=>b.classList.toggle('on',b.dataset.s===sex));
    ov.querySelectorAll('#cAct button').forEach(b=>b.classList.toggle('on',+b.dataset.k===act));
    ov.querySelectorAll('#cDef button').forEach(b=>b.classList.toggle('on',+b.dataset.v===def));
    const v=read(); const r=ov.querySelector('#cResult');
    if(!v.age||!v.height||!v.weight){
      r.innerHTML='<div class="cal-need">나이·키·현재 체중을 넣으면 계산됩니다.</div>'; return;
    }
    const m=calcMacros({...v, goalWeight:v.goalWeight||v.weight});
    r.innerHTML=`<div class="calc-card" style="margin-bottom:0">
      <div class="calc-top"><span class="t">기초대사량 ${m.bmr.toLocaleString()} · 활동 포함 ${m.tdee.toLocaleString()}</span></div>
      <div class="calc-kcal">${m.kcal.toLocaleString()}<small>kcal 목표</small></div>
      <div class="calc-grid">
        <div><b>${m.protein}g</b><span>단백질</span></div>
        <div><b>${m.fat}g</b><span>지방</span></div>
        <div><b>${m.carbs}g</b><span>탄수</span></div>
        <div><b>${m.fiber}g</b><span>식이섬유</span></div>
      </div>
      ${m.floored?'<div class="calc-warn">기초대사량 아래로는 내려가지 않게 조정했습니다.</div>':''}
    </div>`;
  };
  ov.querySelector('#cSex').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(b){ sex=b.dataset.s; paint(); }});
  ov.querySelector('#cAct').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(b){ act=+b.dataset.k; paint(); }});
  ov.querySelector('#cDef').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(b){ def=+b.dataset.v; paint(); }});
  ['#cAge','#cH','#cW','#cGW'].forEach(id=>ov.querySelector(id).addEventListener('input',paint));
  ov.addEventListener('click',e=>{
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='y'){
      const v=read();
      if(!v.age||!v.height||!v.weight){ toast('나이·키·체중을 입력하세요'); return; }
      prof.macroTarget=calcMacros({...v, goalWeight:v.goalWeight||v.weight});
      jSet(K_PROF,prof); ov.remove(); toast('목표 저장됨');
      renderMacroCard(); ghAutoBackupSoon();
    } else if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);
  paint();
}

/* ================= 설정 ================= */
document.getElementById('syncBadge').onclick=()=>{
  if(!ghCfg().token){ ghConfigSheet(); return; }
  ghFail=0; ghBusy=false; ghBackup(true);
};
document.getElementById('setBtn').onclick=()=>{
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg">
    <div class="dlg-t">목표 설정</div>
    <div class="fld" style="margin-bottom:10px"><label>시작 체중 kg</label>
      <input id="sS" type="number" inputmode="decimal" step="0.1" value="${prof.start??''}" placeholder="0.0"></div>
    <div class="fld"><label>목표 체중 kg</label>
      <input id="sG" type="number" inputmode="decimal" step="0.1" value="${prof.goal??''}" placeholder="0.0"></div>
    <div style="font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:11px">
      목표 체중과 감량 속도는 건강 상태에 따라 다릅니다. 주치의와 정한 숫자를 넣으세요.<br>
      시작~목표 구간을 10단계로 나눠 레벨이 올라갑니다.</div>
    <div class="dlg-btns"><button class="dlg-b" data-r="n">닫기</button>
      <button class="dlg-b p" data-r="y">저장</button></div>
    <button class="dlg-b" id="expBtn" style="width:100%;margin-top:8px">데이터 백업 내려받기</button>
    <button class="dlg-b" id="calcBtn2" style="width:100%;margin-top:8px">🔢 칼로리 계산기</button>
    <div style="height:1px;background:var(--border);margin:16px 0"></div>
    <div class="dlg-t" style="font-size:13.5px;margin-bottom:8px">☁️ 깃허브 자동 백업</div>
    <div id="ghStatus" style="font-size:11.5px;color:var(--dim);line-height:1.6;margin-bottom:10px"></div>
    <div class="dlg-btns" style="margin-top:0; gap:6px">
      <button class="dlg-b" id="ghCfgBtn" style="padding:11px 2px; font-size:12px">연동 설정</button>
      <button class="dlg-b" id="ghPullBtn" style="padding:11px 2px; font-size:12px">불러오기</button>
      <button class="dlg-b p" id="ghBackupBtn" style="padding:11px 2px; font-size:12px">지금 백업</button>
    </div>
  </div>`;
  ghStatusText();
  ov.querySelector('#ghCfgBtn').onclick=()=>ghConfigSheet();
  ov.querySelector('#ghPullBtn').onclick=()=>ghPull(true);
  ov.querySelector('#ghBackupBtn').onclick=()=>ghBackup(true);
  ov.querySelector('#calcBtn2').onclick=()=>{ ov.remove(); calcSheet(); };
  ov.addEventListener('click',e=>{
    if(e.target.id==='expBtn'){
      const blob=new Blob([JSON.stringify({prof,log,tasks,meals},null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=`체중관리_${TODAY}.json`; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000); toast('백업 저장됨'); return;
    }
    const r=e.target.dataset&&e.target.dataset.r;
    if(r==='y'){
      const s=parseFloat(ov.querySelector('#sS').value), g=parseFloat(ov.querySelector('#sG').value);
      if(!s||!g||g>=s){ toast('목표는 시작보다 낮아야 합니다'); return; }
      prof.start=s; prof.goal=g; jSet(K_PROF,prof);
      ov.remove(); onDataChanged(); toast('저장됨');
    } else if(r==='n'||e.target===ov) ov.remove();
  });
  showOverlay(ov);
};

/* ================= 탭 · 부팅 ================= */
document.querySelectorAll('nav.bottom button').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('nav.bottom button').forEach(x=>x.classList.toggle('sel',x===t));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+t.dataset.p));
  curTab=t.dataset.p;
  renderTab(curTab);
  window.scrollTo({top:0, behavior:'instant'});
});

let curTab='today';
function renderTab(t){
  if(t!=='today'){ clearInterval(fastTimer); fastTimer=null; clearInterval(chTimer); chTimer=null; }
  if(t==='today'){ renderChallenge(); renderMacroCard(); renderFastCard(); renderSleep();
    renderDayEditor(document.getElementById('todayEditor'), TODAY); }
  else if(t==='level')   renderLevel();
  else if(t==='records') renderRecords();
  else if(t==='meal')    renderMealAll();
  else if(t==='motiv')   renderMotiv();
}
/* opts.backup:false → 단순 다시 그리기(부팅·탭 전환)일 때는 백업을 걸지 않는다 */
function onDataChanged(opts){
  renderHead();
  renderTab(curTab);
  if(!opts || opts.backup!==false) ghAutoBackupSoon();
}

(async()=>{
  try{ phCache=await phAll(); }catch(e){ phCache={}; }
  onDataChanged({backup:false});
  if(prof.start==null||prof.goal==null) document.getElementById('setBtn').click();
  if(ghCfg().token) ghPull(false);
})();
</script>
</body>
</html>

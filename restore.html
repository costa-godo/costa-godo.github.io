<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 복구</title>
<style>
 :root{--bg:#F2F2F7;--sf:#fff;--bd:#E3E3E8;--tx:#1C1C1E;--mut:#6E6E73;--dim:#AEAEB2;
   --acc:#30D158;--red:#FF3B30;--blue:#0A84FF;--amb:#FF9F0A}
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
   padding:22px 16px 40px;-webkit-font-smoothing:antialiased}
 .wrap{max-width:460px;margin:0 auto}
 h1{font-size:20px;font-weight:800;margin-bottom:6px}
 .sub{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:18px}
 .card{background:var(--sf);border:.5px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;
   box-shadow:0 1px 3px rgba(0,0,0,.04)}
 .step{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.06em;margin-bottom:9px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
 .grid div{background:#ECECF1;border-radius:11px;padding:11px 3px;text-align:center}
 .grid b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
 .grid span{display:block;font-size:9.5px;color:var(--mut);margin-top:3px;font-weight:600}
 button{width:100%;padding:15px;border:none;border-radius:13px;font-size:15px;font-weight:800;
   font-family:inherit;cursor:pointer;margin-top:9px}
 .go{background:var(--acc);color:#fff}
 .go2{background:var(--blue);color:#fff}
 .ghost{background:#ECECF1;color:var(--tx)}
 button:disabled{opacity:.45}
 .msg{margin-top:13px;font-size:13px;line-height:1.7;white-space:pre-line}
 .warn{font-size:11.5px;color:var(--mut);line-height:1.6;background:#ECECF1;border-radius:11px;padding:11px;margin-top:12px}
 .ok{color:var(--acc);font-weight:700}.er{color:var(--red);font-weight:700}.am{color:var(--amb);font-weight:700}
 label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:5px;margin-top:9px}
 input{width:100%;padding:12px;border-radius:11px;border:1.5px solid transparent;background:#ECECF1;
   color:var(--tx);font-size:15px;font-family:inherit;outline:none}
 input:focus{border-color:var(--blue);background:#fff}
</style></head><body><div class="wrap">
<h1>데이터 복구</h1>
<div class="sub">8/15 밤 백업에서 되살립니다. 반드시 <b>costa-godo.github.io</b> 주소로 열어야 합니다.</div>

<div class="card">
  <div class="step">1단계 · 기기로 복구</div>
  <div class="grid">
    <div><b id="c1">0</b><span>체중일</span></div>
    <div><b id="c2">0</b><span>식단</span></div>
    <div><b id="c3">0</b><span>메모</span></div>
    <div><b id="c4">0</b><span>공복</span></div>
  </div>
  <button class="go" id="run">기기로 복구하기</button>
  <div class="msg" id="m1"></div>
</div>

<div class="card">
  <div class="step">2단계 · 서버 백업도 되살리기</div>
  <div class="sub" style="margin-bottom:0;font-size:12px">
    지금 깃허브에 올라간 백업 파일이 비어 있습니다.
    이걸 되돌려야 앱의 <b>불러오기</b>가 다시 작동합니다.</div>
  <label>계정 (owner)</label><input id="o" value="costa-godo">
  <label>저장소 (repo)</label><input id="r" value="costa-godo.github.io">
  <label>토큰 (github_pat_...)</label><input id="tk" type="password" placeholder="Contents: Read/Write">
  <button class="go2" id="push" disabled>서버 백업 되살리기</button>
  <div class="msg" id="m2"></div>
</div>

<button class="ghost" id="open">앱 열기</button>
<div class="warn">복구는 <b>덮어쓰기가 아니라 합치기</b>입니다. 기기에 남아있는 기록은 그대로 두고 없는 것만 채웁니다.

저탄고지 식단하면 됨\\n\\n그리고 일주일에 0.5~1kg가 가장 이상적인 몸무게임", "url": "https://www.instagram.com/reel/DVYsgvdk-gx/?igsh=Zm54OWxma2p5OHlu&igsi=Zm54OWxma2p5OHlu", "media": []}, {"id": "vmss4g61b", "d": "2026-08-14", "note": "근력후 인클라인 13 속도 4 ", "url": "", "media": [{"key": "vpmss4g60cpud0", "type": "image", "remote": "https://raw.githubusercontent.com/costa-godo/costa-godo.github.io/main/health/photos/vpmss4g60cpud0.jpg"}]}, {"id": "vmsmx5k8y", "d": "2026-08-10", "note": "🔥 런닝 없이도 지방 태우는 습관 8가지🔥\\n\\n😴 수면 7-9시간 → 부족하면 식욕↑ 대사↓\\n🚶 하루 8천 보 걷기 → 근손실 없이 지방 소모\\n🏋️ 주 3-4회 웨이트 → 근육이 곧 기초대사량\\n🍗 매 끼 단백질 → 소화열 소모 + 포만감\\n💧 식전 물 한 잔 → 과식 방지\\n⏰ 10시간 식사 윈도우 → 인슐린 자극 감소\\n🚿 차가운 샤워 → 갈색지방 살짝 활성화\\n❤️ 섹스 → 칼로리 소모 + 스트레스 완화 + 숙면\\n\\n💡 결론: 지방 감량은 운동이 아니라 하루 24시간 시스템", "url": "", "media": []}, {"id": "vmsn24rre", "d": "2026-08-10", "note": "오늘(8/10, 월요일)부터 한 달이면 9/9(수)까지예요.\\n\\n이 기간 월수금 스케줄로 계산하면 총 *14회* 나갈 수 있어요.\\n- 8월: 10, 12, 14, 17, 19, 21, 24, 26, 28, 31일 (10회)\\n- 9월: 2, 4, 7, 9일 (4회)\\n\\n1회당 비용은 20만원 ÷ 14회 ≈ **14,286원**. 본전 기준(12회)보다 넉넉히 넘겨서 확실히 이득이에요.", "url": "", "media": []}]}`);
document.getElementById('c1').textContent = Object.values(D.log||{}).filter(v=>v.w!=null).length;
document.getElementById('c2').textContent = (D.meals||[]).length;
document.getElementById('c3').textContent = (D.motiv||[]).length;
document.getElementById('c4').textContent = (D.fastHist||[]).length;

const g=(k,d)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}};
const s=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

document.getElementById('run').onclick=()=>{
  const m=document.getElementById('m1');
  try{
    const out=[];
    const prof=g('wl-profile',{});
    const np={...(D.prof||{}),...prof};
    if(!prof.macroTarget && D.prof&&D.prof.macroTarget) np.macroTarget=D.prof.macroTarget;
    s('wl-profile',np);
    const log=g('wl-log',{}); let a=0;
    Object.entries(D.log||{}).forEach(([k,v])=>{if(!log[k]){log[k]=v;a++;}});
    s('wl-log',log); out.push(a+'일치 기록');
    const tk=g('wl-task',[]); let b=0;
    (D.tasks||[]).forEach(x=>{if(!tk.some(y=>y.id===x.id)){tk.push(x);b++;}});
    s('wl-task',tk); out.push(b+'개 체크항목');
    const me=g('wl-meal',[]); let c=0;
    (D.meals||[]).forEach(x=>{if(!me.some(y=>y.id===x.id)){me.push(x);c++;}});
    s('wl-meal',me); out.push(c+'건 식단');
    const mv=g('wl-motiv',[]); let e=0;
    (D.motiv||[]).forEach(x=>{if(!mv.some(y=>y.id===x.id)){mv.push(x);e++;}});
    s('wl-motiv',mv); out.push(e+'개 메모');
    const fh=g('wl-fast-hist',[]); let f=0;
    (D.fastHist||[]).forEach(x=>{if(!fh.some(y=>y.start===x.start)){fh.push(x);f++;}});
    fh.sort((x,y)=>y.start-x.start); s('wl-fast-hist',fh); out.push(f+'건 공복기록');
    m.innerHTML='<span class="ok">기기 복구 완료</span>\n'+out.join(' · ');
    document.getElementById('push').disabled=false;
    // 앱이 쓰던 깃허브 설정이 남아있으면 자동으로 채워준다
    try{ const c2=JSON.parse(localStorage.getItem('gh-sync-v1')||'{}');
      if(c2.owner) document.getElementById('o').value=c2.owner;
      if(c2.repo) document.getElementById('r').value=c2.repo;
      if(c2.token) document.getElementById('tk').value=c2.token;
    }catch(err){}
  }catch(err){
    m.innerHTML='<span class="er">복구 실패</span>\n'+err.message;
  }
};

document.getElementById('push').onclick=async()=>{
  const m=document.getElementById('m2');
  const owner=document.getElementById('o').value.trim();
  const repo=document.getElementById('r').value.trim();
  const token=document.getElementById('tk').value.trim();
  if(!owner||!repo||!token){ m.innerHTML='<span class="er">계정·저장소·토큰을 채워주세요</span>'; return; }
  m.textContent='올리는 중...';
  const api='https://api.github.com/repos/'+owner+'/'+repo+'/contents/health/data.json';
  const H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
  try{
    let sha=null;
    const gr=await fetch(api,{headers:H});
    if(gr.ok) sha=(await gr.json()).sha;
    const body={message:'restore health data', branch:'main',
      content:btoa(unescape(encodeURIComponent(JSON.stringify({...D, updated:new Date().toISOString()}))))};
    if(sha) body.sha=sha;
    const pr=await fetch(api,{method:'PUT',headers:H,body:JSON.stringify(body)});
    if(!pr.ok) throw new Error('HTTP '+pr.status);
    // 앱이 쓰도록 연동 설정도 저장
    s('gh-sync-v1',{owner,repo,branch:'main',token});
    m.innerHTML='<span class="ok">서버 백업 되살렸습니다</span>\n이제 앱의 불러오기도 정상 작동합니다.';
  }catch(err){
    m.innerHTML='<span class="er">실패: '+err.message+'</span>\n토큰 권한(Contents: Read/Write)을 확인하세요.';
  }
};
document.getElementById('open').onclick=()=>location.href='./health.html';
</script></body></html>

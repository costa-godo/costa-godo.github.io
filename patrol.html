<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오전순찰코스</title>
<style>
  :root{
    --bg:#F2F4F7;
    --surface:#FFFFFF;
    --navy:#132242;
    --navy-soft:#2E4874;
    --ink:#151A24;
    --ink-2:#5C6472;
    --line:#E1E5EC;
    --blue:#2E5FA3;
    --blue-bg:#E8F0FA;
    --amber:#B5680C;
    --amber-bg:#FBF0DF;
    --red:#C23B32;
    --red-bg:#FCEAE8;
    --green:#2E8B57;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{
    padding-bottom:40px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; -webkit-appearance:none; appearance:none; background:none; border:none; cursor:pointer;}
  textarea{font-family:inherit;}

  /* ===== Header ===== */
  .app-header{
    position:sticky; top:0; z-index:30;
    background:var(--navy);
    color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
    box-shadow:0 2px 10px rgba(19,34,66,0.18);
  }
  .app-header .title-row{
    display:flex; align-items:center; justify-content:space-between;
  }
  .app-header h1{
    margin:0; font-size:19px; font-weight:800; letter-spacing:0.2px;
  }
  .app-header .date{
    font-size:11.5px; color:#AEBBD6; font-family:var(--mono);
  }
  .header-right{ display:flex; align-items:center; gap:10px; }
  .gallery-btn{
    position:relative; display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:9px; background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
  }
  .gallery-btn svg{ width:17px; height:17px; }
  .gallery-btn path,.gallery-btn rect,.gallery-btn circle{ fill:none; stroke:#EAF0FA; stroke-width:1.7; stroke-linejoin:round; stroke-linecap:round; }
  .gallery-btn .gbadge{
    position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; padding:0 3px;
    border-radius:9px; background:var(--green); color:#fff; font-size:10px; font-weight:800;
    display:none; align-items:center; justify-content:center; font-family:var(--mono);
  }
  .gallery-btn .gbadge.show{ display:flex; }
  .progress-wrap{margin-top:10px;}
  .progress-top{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11.5px; color:#C7D2E6; margin-bottom:5px;
  }
  .progress-top .count{font-family:var(--mono); font-size:13px; color:#fff; font-weight:700;}
  .progress-bar{
    height:7px; border-radius:5px; background:rgba(255,255,255,0.16); overflow:hidden;
  }
  .progress-bar > div{
    height:100%; background:linear-gradient(90deg,#4C7FC9,#8FC4E8); border-radius:5px;
    transition:width .25s ease;
  }
  .issue-chip{
    display:inline-flex; align-items:center; gap:4px;
    margin-top:8px; font-size:11.5px; color:#FFD9D2; background:rgba(194,59,50,0.28);
    padding:3px 9px; border-radius:20px; font-weight:600;
  }
  .issue-chip.hidden{display:none;}

  /* ===== Tower Tabs ===== */
  .tabbar{
    position:sticky; top:calc(78px + env(safe-area-inset-top,0px)); z-index:29;
    display:flex; gap:8px; padding:10px 16px; background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .tabbar.has-issue{ top:calc(100px + env(safe-area-inset-top,0px)); }
  .tab-btn{
    flex:1; padding:10px 6px; border-radius:10px; text-align:center;
    background:var(--surface); border:1.5px solid var(--line);
    font-size:14px; font-weight:700; color:var(--ink-2);
  }
  .tab-btn .n{font-family:var(--mono); font-weight:600; font-size:11.5px; display:block; margin-top:2px;}
  .tab-btn.active{
    background:var(--navy); border-color:var(--navy); color:#fff;
  }
  .tab-btn.active .n{color:#BFD0EA;}

  .toolbar{
    display:flex; justify-content:flex-end; gap:14px;
    padding:8px 16px 2px; font-size:12.5px; color:var(--blue); font-weight:600;
  }

  /* ===== Tower body ===== */
  .tower-body{ padding:6px 12px 8px; display:none; }
  .tower-body.active{ display:block; }

  .floor-row{
    display:flex; align-items:stretch;
  }
  .rail-col{ width:26px; position:relative; flex-shrink:0; }
  .rail-col .line{
    position:absolute; left:50%; transform:translateX(-50%);
    top:0; bottom:0; width:2px; background:var(--line);
  }
  .floor-row.first .rail-col .line{ top:19px; }
  .floor-row.last .rail-col .line{ bottom:calc(100% - 19px); }
  .rail-col .node{
    position:absolute; left:50%; top:19px; transform:translate(-50%,-50%);
    width:13px; height:13px; border-radius:50%;
    background:#fff; border:2.5px solid var(--navy-soft); z-index:2;
    display:flex; align-items:center; justify-content:center;
  }
  .rail-col .node.done{ background:var(--navy); border-color:var(--navy); }
  .rail-col .node.done::after{
    content:""; width:5px; height:8px; border-right:2px solid #fff; border-bottom:2px solid #fff;
    transform:rotate(40deg) translate(-1px,-1px);
  }
  .rail-col .node.issue{ background:var(--red); border-color:var(--red); }

  .floor-card{
    flex:1; min-width:0; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; margin:7px 0; overflow:hidden;
  }
  .floor-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; gap:10px;
  }
  .floor-head .fname{ font-size:15px; font-weight:800; color:var(--ink); }
  .floor-head .fmeta{
    display:flex; align-items:center; gap:8px;
  }
  .floor-head .fcount{ font-family:var(--mono); font-size:12.5px; color:var(--ink-2); }
  .floor-head .chev{
    width:9px; height:9px; border-right:2px solid var(--ink-2); border-bottom:2px solid var(--ink-2);
    transform:rotate(45deg); transition:transform .2s ease; margin-right:2px;
  }
  .floor-card.open .chev{ transform:rotate(-135deg); }

  .item-list{ display:none; border-top:1px solid var(--line); }
  .floor-card.open .item-list{ display:block; }

  .item-row{
    display:flex; align-items:flex-start; gap:11px;
    padding:12px 14px; border-top:1px solid var(--line);
  }
  .item-row:first-child{ border-top:none; }
  .item-row.issue{ background:var(--red-bg); }

  .chk{
    width:23px; height:23px; border-radius:7px; border:2px solid #C7CCD6;
    flex-shrink:0; margin-top:1px;
    display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .item-row.done .chk{ background:var(--navy); border-color:var(--navy); }
  .item-row.done .chk::after{
    content:""; width:6px; height:10px; border-right:2.5px solid #fff; border-bottom:2.5px solid #fff;
    transform:rotate(40deg) translate(-1px,-2px);
  }

  .item-body{ flex:1; min-width:0; }
  .item-name{
    font-size:14.5px; line-height:1.4; color:var(--ink); font-weight:600;
  }
  .item-row.done .item-name{ color:var(--ink-2); text-decoration:line-through; text-decoration-color:#B8BEC9; }
  .tag-row{ display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
  .tag{
    font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px;
  }
  .tag.t1{ background:var(--blue-bg); color:var(--blue); }
  .tag.t2{ background:var(--amber-bg); color:var(--amber); }
  .tag.t3{ background:#EDE8FB; color:#6B4FC4; }
  .tag.t4{ background:transparent; color:var(--ink-2); border:1px dashed #B8BEC9; }
  .tag.t5{ background:#E2F3EC; color:#1F7A4D; }
  .tag.t6{ background:#FDECEF; color:#C23B6B; }

  /* ===== 온습도 입력 ===== */
  .env-row{
    display:flex; gap:8px; margin-top:8px; align-items:center;
  }
  .env-field{
    display:flex; align-items:center; gap:5px;
    background:var(--bg); border:1.5px solid var(--line); border-radius:9px;
    padding:6px 9px;
  }
  .env-field label{ font-size:11.5px; color:var(--ink-2); font-weight:700; white-space:nowrap; }
  .env-field input{
    width:52px; border:none; background:transparent; outline:none;
    font-family:var(--mono); font-size:15px; font-weight:700; color:var(--navy);
    text-align:right; padding:0;
  }
  .env-field .unit{ font-size:11.5px; color:var(--ink-2); }
  .env-field:focus-within{ border-color:var(--blue); background:#fff; }

  .row-actions{ display:flex; gap:8px; margin-top:-6px; flex-shrink:0; }

  .flag-btn, .camera-btn{
    position:relative;
    flex-shrink:0; width:38px; height:38px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--line); background:#fff;
  }
  .flag-btn svg, .camera-btn svg{ width:17px; height:17px; }
  .flag-btn path{ fill:none; stroke:#9AA1AD; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .item-row.issue .flag-btn{ background:var(--red); border-color:var(--red); }
  .item-row.issue .flag-btn path{ stroke:#fff; fill:#fff; }

  .camera-btn path, .camera-btn circle{ fill:none; stroke:#9AA1AD; stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round; }
  .camera-btn.active{ background:var(--blue); border-color:var(--blue); }
  .camera-btn.active path, .camera-btn.active circle{ stroke:#fff; }
  .camera-btn .badge{
    position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; padding:0 3px;
    border-radius:9px; background:var(--green); color:#fff; font-size:10px; font-weight:800;
    display:none; align-items:center; justify-content:center; font-family:var(--mono);
  }
  .camera-btn .badge.show{ display:flex; }

  .note-wrap{ padding:0 14px 12px 48px; margin-top:-6px; }
  .note-wrap textarea{
    width:100%; min-height:52px; resize:vertical;
    border:1.5px solid var(--line); background:#fff; border-radius:9px;
    padding:9px 10px; font-size:13.5px; color:var(--ink); line-height:1.4;
  }
  .note-wrap textarea::placeholder{ color:#AEB4BF; }
  .note-wrap.issue textarea{ border-color:#EBC3BE; }
  .note-wrap.issue textarea::placeholder{ color:#C79A96; }

  .note-actions{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:8px;
  }
  .capture-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--navy); color:#fff; font-size:12.5px; font-weight:700;
    padding:8px 13px; border-radius:9px;
  }
  .capture-btn svg{ width:15px; height:15px; }
  .capture-btn path, .capture-btn circle{ fill:none; stroke:#fff; stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round; }
  .note-close-btn{ font-size:12px; color:var(--ink-2); padding:6px 4px; }

  /* ===== Toast ===== */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,10px);
    background:#151A24; color:#fff; font-size:13px; font-weight:600;
    padding:11px 18px; border-radius:24px; box-shadow:0 6px 20px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:60; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ===== Gallery ===== */
  .gallery-overlay{
    position:fixed; inset:0; z-index:80; background:var(--bg);
    display:none; flex-direction:column;
  }
  .gallery-overlay.open{ display:flex; }
  .gallery-head{
    background:var(--navy); color:#fff; flex-shrink:0;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .gallery-head .gt{ font-size:17px; font-weight:800; }
  .gallery-head .gc{ font-size:11.5px; color:#AEBBD6; font-family:var(--mono); margin-top:2px; }
  .gallery-close{
    width:32px; height:32px; border-radius:9px; background:rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center;
  }
  .gallery-close svg{ width:15px; height:15px; }
  .gallery-close path{ stroke:#fff; stroke-width:2; stroke-linecap:round; }
  .gallery-body{ flex:1; overflow-y:auto; padding:14px 14px 30px; }
  .gallery-empty{
    text-align:center; color:var(--ink-2); font-size:13.5px; padding:60px 20px; line-height:1.6;
  }
  .photo-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; margin-bottom:14px;
  }
  .photo-card img{ width:100%; display:block; max-height:260px; object-fit:cover; }
  .photo-card .pc-body{ padding:11px 13px 13px; }
  .photo-card .pc-title{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .photo-card .pc-sub{ font-size:11px; color:var(--ink-2); margin-top:2px; font-family:var(--mono); }
  .photo-card .pc-memo{ font-size:12.5px; color:var(--ink); margin-top:7px; line-height:1.45; }
  .photo-card .pc-actions{ display:flex; gap:8px; margin-top:11px; }
  .pc-btn{
    flex:1; text-align:center; padding:9px 0; border-radius:9px; font-size:12.5px; font-weight:700;
  }
  .pc-btn.retake{ background:var(--blue-bg); color:var(--blue); }
  .pc-btn.del{ background:var(--red-bg); color:var(--red); }

  .lightbox{
    position:fixed; inset:0; z-index:90; background:rgba(6,8,12,0.94);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:6px; }

  /* ===== Notice ===== */
  .notice{
    margin:16px 12px 6px; padding:13px 14px; border-radius:12px;
    background:#2A2118; color:#F3D9BE; border:1px solid #4A3722;
    font-size:12.5px; line-height:1.55;
  }
  .notice b{ color:#FFC98C; }

  .footer-row{
    display:flex; justify-content:center; gap:8px; padding:18px 14px 6px; flex-wrap:wrap;
  }
  .foot-btn{
    font-size:13px; font-weight:700; padding:11px 16px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink-2);
  }
  .foot-btn.primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .foot-btn.danger{ color:var(--red); border-color:#F0CFCC; }

  /* ===== PIN section ===== */
  .pin-section{
    margin:16px 12px 0; border-radius:12px; overflow:hidden;
    background:var(--surface); border:1px solid var(--line);
  }
  .pin-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; gap:10px;
  }
  .pin-head-l{ display:flex; align-items:center; gap:9px; }
  .pin-head-l svg{ width:16px; height:16px; flex-shrink:0; }
  .pin-head-l path,.pin-head-l rect{ stroke:var(--ink-2); fill:none; stroke-width:1.8; }
  .pin-title{ font-size:14px; font-weight:800; color:var(--ink); }
  .pin-sub{ font-size:11px; color:var(--ink-2); margin-top:1px; }
  .pin-toggle-btn{
    font-size:12px; font-weight:700; color:var(--blue); padding:6px 10px;
    border:1.5px solid var(--blue-bg); background:var(--blue-bg); border-radius:8px;
  }
  .pin-list{ display:none; border-top:1px solid var(--line); }
  .pin-list.open{ display:block; }
  .pin-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px; border-top:1px solid var(--line);
  }
  .pin-row:first-child{ border-top:none; }
  .pin-name{ font-size:13.5px; color:var(--ink); font-weight:600; }
  .pin-code{
    font-family:var(--mono); font-size:15px; font-weight:700; color:var(--navy);
    letter-spacing:1.5px; background:var(--bg); padding:3px 10px; border-radius:7px;
  }
  .pin-note{
    padding:10px 14px 13px; font-size:11.5px; color:var(--ink-2); border-top:1px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="title-row">
    <h1>오전순찰코스</h1>
    <div class="header-right">
      <span class="date" id="dateLabel"></span>
      <button class="gallery-btn" onclick="openGallery()" aria-label="사진 갤러리">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5L9 17"/></svg>
        <span class="gbadge" id="galleryBadge"></span>
      </button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-top">
      <span>전체 진행</span>
      <span class="count" id="progressCount">0 / 0</span>
    </div>
    <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
  </div>
  <span class="issue-chip hidden" id="issueChip">⚠ 이상 <span id="issueCount">0</span>건 보고 대기</span>
</div>

<div class="tabbar" id="tabbar">
  <button class="tab-btn active" data-tower="0" onclick="setTower(0)">
    B타워<span class="n" id="tabCountB">0/0</span>
  </button>
  <button class="tab-btn" data-tower="1" onclick="setTower(1)">
    A타워<span class="n" id="tabCountA">0/0</span>
  </button>
  <button class="tab-btn" data-tower="2" onclick="setTower(2)">
    야간 당직<span class="n" id="tabCountN">0/0</span>
  </button>
  <button class="tab-btn" data-tower="3" onclick="setTower(3)">
    금요일 업무<span class="n" id="tabCountF">0/0</span>
  </button>
</div>

<div class="toolbar">
  <button onclick="expandAll()">전체 펼치기</button>
  <button onclick="collapseAll()">전체 접기</button>
</div>

<div id="towerContainer"></div>


<div class="pin-section">
  <div class="pin-head" onclick="togglePins()">
    <div class="pin-head-l">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <div>
        <div class="pin-title">출입 비밀번호</div>
        <div class="pin-sub">탭하여 표시</div>
      </div>
    </div>
    <button class="pin-toggle-btn" id="pinToggleBtn">보기</button>
  </div>
  <div class="pin-list" id="pinList"></div>
  <div class="pin-note" id="pinNote"></div>
</div>

<div class="notice">
  <b>주의사항</b> · 가스소화설비 구역(방재센터, 보안상황실, 전산실, 통신실, 항온항습기실, 3D프린터실 등)은 오작동 시 질식 위험이 있는 밀폐공간이다. 이상 발견 시 단독 진입 금지, 반드시 현장 확인 후 선임자·소장에게 즉시 보고할 것.
</div>

<div class="footer-row">
  <button class="foot-btn primary" onclick="backupToFile()">💾 기록 저장</button>
  <button class="foot-btn" onclick="triggerRestore()">📂 불러오기</button>
  <button class="foot-btn danger" onclick="resetToday()">초기화</button>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="restoreInput" accept="application/json,.json" style="display:none">
<div class="toast" id="toast"></div>
<canvas id="workCanvas" style="display:none"></canvas>

<div class="gallery-overlay" id="galleryOverlay">
  <div class="gallery-head">
    <div>
      <div class="gt">촬영 갤러리</div>
      <div class="gc" id="galleryCount">0장</div>
    </div>
    <button class="gallery-close" onclick="closeGallery()" aria-label="닫기">
      <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="gallery-body" id="galleryBody"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="">
</div>

<script>
// ============ DATA ============
const DATA = [
  { name:"B타워", floors:[
    { name:"옥탑층", items:[
      { n:"옥탑지붕층", t:["1차"] },

const todayKey = () => {

// ============ IndexedDB (사진 영구 저장) ============
// 사진은 용량이 커서 localStorage 한도를 넘기므로 IndexedDB에 저장한다.
const IDB_NAME = "patrolPhotosDB";
const IDB_STORE = "photos";
let _idbPromise = null;
function idb(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    try{
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)){
          db.createObjectStore(IDB_STORE, { keyPath:"key" });
        }
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    }catch(e){ reject(e); }
  });
  return _idbPromise;
}
async function idbPut(record){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(record);
    tx.oncomplete = ()=>res(true);
    tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGetByPrefix(prefix){
  const db = await idb();
  return new Promise((res,rej)=>{
    const out = [];
    const tx = db.transaction(IDB_STORE, "readonly");
    const cur = tx.objectStore(IDB_STORE).openCursor();
    cur.onsuccess = (e)=>{
      const c = e.target.result;
      if(c){
        if(String(c.value.key).startsWith(prefix)) out.push(c.value);
        c.continue();
      } else res(out);
    };
    cur.onerror = ()=>rej(cur.error);
  });
}
async function idbDelete(key){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = ()=>res(true);
    tx.onerror = ()=>rej(tx.error);
  });
}

function getItemState(id){
  if(!state[id]) state[id] = {done:false, issue:false, note:"", cameraOpen:false, photoCount:0, temp:"", hum:""};
  if(state[id].cameraOpen === undefined) state[id].cameraOpen = false;
  if(state[id].photoCount === undefined) state[id].photoCount = 0;
  if(state[id].temp === undefined) state[id].temp = "";
  if(state[id].hum === undefined) state[id].hum = "";
  return state[id];
}

async function loadState(){
  let loaded = null;
  // 1순위: localStorage (기기에 가장 확실하게 남음)
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) loaded = JSON.parse(raw);
  }catch(e){}
  // 2순위: window.storage (localStorage가 비어있을 때만)
  if(!loaded){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) loaded = JSON.parse(res.value);
    }catch(e){}
  }
  if(loaded) state = loaded;
  render();
}

let saveTimer = null;
function saveState(){
  // 즉시 localStorage에 기록 (동기 - 창을 닫아도 남음)
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  // window.storage에도 디바운스로 백업
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
    catch(e){}
  }, 150);
}

// 창을 닫거나 백그라운드로 갈 때 마지막 저장 보장
window.addEventListener("pagehide", ()=>{
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
});
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden"){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
});

function attachHandlers(){
  // item row tap (toggle done) - ignore taps on flag button or textarea
  towerContainer.querySelectorAll(".item-row").forEach(row=>{
    row.addEventListener("click",(e)=>{
      if(e.target.closest(".flag-btn") || e.target.closest(".camera-btn")) return;
      const id = row.dataset.id;
      const s = getItemState(id);
      s.done = !s.done;
      saveState();
      refreshAll();
    });
  });
  // flag button
  towerContainer.querySelectorAll(".flag-btn").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const id = btn.dataset.flag;
      const s = getItemState(id);
      s.issue = !s.issue;
      saveState();
      refreshAll();
    });
  });
  // camera button - opens note area for memo entry
  towerContainer.querySelectorAll(".camera-btn").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const id = btn.dataset.camera;
      const s = getItemState(id);
      s.cameraOpen = true;
      saveState();
      refreshAll();
      const ta = towerContainer.querySelector(`textarea[data-note="${id}"]`);
      if(ta) ta.focus();
    });
  });
  // capture button inside note area - requires memo first
  towerContainer.querySelectorAll(".capture-btn").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const id = btn.dataset.capture;
      openCamera(id);
    });
  });
  // note close
  towerContainer.querySelectorAll(".note-close-btn").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const id = btn.dataset.noteClose;
      const s = getItemState(id);
      s.cameraOpen = false;
      saveState();
      refreshAll();
    });
  });
  // note textarea
  towerContainer.querySelectorAll("textarea[data-note]").forEach(ta=>{
    ta.addEventListener("click",e=>e.stopPropagation());
    ta.addEventListener("input",()=>{
      const id = ta.dataset.note;
      const s = getItemState(id);
      s.note = ta.value;
      saveState();
    });
  });
  // 온습도 입력
  towerContainer.querySelectorAll("input[data-temp]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      const s = getItemState(inp.dataset.temp);
      s.temp = inp.value; saveState();
    });
  });
  towerContainer.querySelectorAll("input[data-hum]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      const s = getItemState(inp.dataset.hum);
      s.hum = inp.value; saveState();
    });
  });
  // floor head (expand/collapse)
  towerContainer.querySelectorAll("[data-floorhead]").forEach(head=>{
    head.addEventListener("click",()=>{
      const card = head.closest(".floor-card");
      card.classList.toggle("open");
    });
  });
}

function refreshAll(){
  let grandDone=0, grandTotal=0, grandIssue=0;
  const towerCounts = DATA.map(()=>({done:0,total:0}));

  DATA.forEach((tower,ti)=>{
    tower.floors.forEach((floor,fi)=>{
      let fDone=0, fIssue=0;
      floor.items.forEach(item=>{
        const s = getItemState(item.id);
        const row = towerContainer.querySelector(`.item-row[data-id="${item.id}"]`);
        const noteWrap = towerContainer.querySelector(`[data-note-wrap="${item.id}"]`);
        const noteArea = towerContainer.querySelector(`textarea[data-note="${item.id}"]`);
        const camBtn = towerContainer.querySelector(`.camera-btn[data-camera="${item.id}"]`);
        const badge = towerContainer.querySelector(`[data-badge="${item.id}"]`);
        if(row){
          row.classList.toggle("done", s.done);
          row.classList.toggle("issue", s.issue);
        }
        const noteShown = s.issue || s.cameraOpen;
        if(noteWrap){
          noteWrap.style.display = noteShown ? "block" : "none";
          noteWrap.classList.toggle("issue", s.issue);
        }
        if(noteArea && noteArea.value !== (s.note||"")) noteArea.value = s.note||"";
        const tempInp = towerContainer.querySelector(`input[data-temp="${item.id}"]`);
        const humInp = towerContainer.querySelector(`input[data-hum="${item.id}"]`);
        if(tempInp && tempInp.value !== (s.temp||"") && document.activeElement !== tempInp) tempInp.value = s.temp||"";
        if(humInp && humInp.value !== (s.hum||"") && document.activeElement !== humInp) humInp.value = s.hum||"";
        if(camBtn) camBtn.classList.toggle("active", s.cameraOpen);
        if(badge){
          badge.classList.toggle("show", s.photoCount>0);
          badge.textContent = s.photoCount>0 ? s.photoCount : "";
        }
        if(s.done) fDone++;
        if(s.issue) fIssue++;
      });
      const fcount = towerContainer.querySelector(`[data-fcount="${ti}-${fi}"]`);
      if(fcount) fcount.textContent = `${fDone}/${floor.items.length}`;
      const node = towerContainer.querySelector(`[data-node="${ti}-${fi}"]`);
      if(node){
        node.classList.toggle("done", fDone===floor.items.length);
        node.classList.toggle("issue", fIssue>0);
      }
      grandDone += fDone; grandTotal += floor.items.length; grandIssue += fIssue;
      towerCounts[ti].done += fDone; towerCounts[ti].total += floor.items.length;
    });
  });

  document.getElementById("progressCount").textContent = `${grandDone} / ${grandTotal}`;
  document.getElementById("progressFill").style.width = grandTotal? `${(grandDone/grandTotal*100).toFixed(0)}%` : "0%";
  document.getElementById("tabCountB").textContent = `${towerCounts[0].done}/${towerCounts[0].total}`;
  document.getElementById("tabCountA").textContent = `${towerCounts[1].done}/${towerCounts[1].total}`;
  document.getElementById("tabCountN").textContent = `${towerCounts[2].done}/${towerCounts[2].total}`;
  document.getElementById("tabCountF").textContent = `${towerCounts[3].done}/${towerCounts[3].total}`;

  const chip = document.getElementById("issueChip");
  const tabbar = document.getElementById("tabbar");
  if(grandIssue>0){
    chip.classList.remove("hidden");
    document.getElementById("issueCount").textContent = grandIssue;
    tabbar.classList.add("has-issue");
  } else {
    chip.classList.add("hidden");
    tabbar.classList.remove("has-issue");
  }
}

function setTower(idx){
  currentTower = idx;
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active", i===idx));
  document.querySelectorAll("[data-tower-body]").forEach(el=>{
    el.classList.toggle("active", Number(el.dataset.towerBody)===idx);
  });
}

function expandAll(){
  towerContainer.querySelectorAll(`[data-tower-body="${currentTower}"] .floor-card`)
    .forEach(c=>c.classList.add("open"));
}
function collapseAll(){
  towerContainer.querySelectorAll(`[data-tower-body="${currentTower}"] .floor-card`)
    .forEach(c=>c.classList.remove("open"));
}

async function resetToday(){
  if(!confirm("오늘 체크한 순찰 기록을 모두 초기화할까요?\n(촬영한 사진도 함께 삭제됩니다)")) return;
  state = {};
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }catch(e){}
  // 사진도 삭제
  const keys = photos.map(p=>p.key);
  photos = [];
  for(const k of keys){
    try{ await idbDelete(k); }catch(e){}
    try{ await window.storage.delete(k, false); }catch(e){}
  }
  refreshAll();
  updateGalleryBadge();
  showToast("초기화되었습니다");
}

// ============ FILE BACKUP (수동 저장/불러오기) ============
function backupToFile(){
  // 화면 표시용 임시상태(cameraOpen)는 빼고 저장
  const clean = {};
  Object.keys(state).forEach(id=>{
    const s = state[id];
    clean[id] = { done:!!s.done, issue:!!s.issue, note:s.note||"", photoCount:s.photoCount||0, temp:s.temp||"", hum:s.hum||"" };
  });
  const payload = { key: STORAGE_KEY, savedAt: new Date().toISOString(), data: clean };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  const fname = `순찰기록_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  showToast("💾 기록 파일 저장됨");
}

const restoreInput = document.getElementById("restoreInput");
function triggerRestore(){ restoreInput.value=""; restoreInput.click(); }
restoreInput.addEventListener("change",(e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const payload = JSON.parse(ev.target.result);
      const data = payload.data || payload; // 이전 형식도 허용
      if(typeof data !== "object") throw new Error("형식 오류");
      state = data;
      saveState();
      refreshAll();
      showToast("📂 기록 불러오기 완료");
    }catch(err){
      showToast("불러오기 실패: 파일 형식을 확인하세요");
    }
  };
  reader.onerror = ()=> showToast("파일을 읽지 못했어요");
  reader.readAsText(file);
});

// ============ CAMERA CAPTURE ============
let pendingCaptureId = null;
const cameraInput = document.getElementById("cameraInput");
const workCanvas = document.getElementById("workCanvas");

function openCamera(id){
  const s = getItemState(id);
  const ta = towerContainer.querySelector(`textarea[data-note="${id}"]`);
  const memo = (ta ? ta.value : s.note || "").trim();
  if(!memo){
    showToast("먼저 메모를 입력해주세요");
    if(ta) ta.focus();
    return;
  }
  s.note = memo;
  saveState();
  pendingCaptureId = id;
  cameraInput.value = "";
  cameraInput.click();
}

cameraInput.addEventListener("change", (e)=>{
  const file = e.target.files && e.target.files[0];
  const id = pendingCaptureId;
  pendingCaptureId = null;
  if(!file || !id) return;
  processCapturedPhoto(file, id);
});

function processCapturedPhoto(file, id){
  const item = ITEM_BY_ID[id];
  const s = getItemState(id);
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      // scale down large photos to keep file size reasonable
      const MAX_W = 1400;
      const scale = img.width > MAX_W ? MAX_W / img.width : 1;
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      workCanvas.width = w;
      workCanvas.height = h;
      const ctx = workCanvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      drawWatermark(ctx, w, h, item, s.note);

      const dataURL = workCanvas.toDataURL("image/jpeg", 0.82);
      const ts = Date.now();
      const key = `${PHOTO_PREFIX}${id}-${ts}`;
      const record = {
        key, itemId:id, itemName:item.n, tower:item.tower, floor:item.floor,
        tags:item.t.slice(), memo:s.note, ts, dataURL
      };
      const p = n => String(n).padStart(2,"0");
      const d = new Date(ts);
      const stamp = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
      const fileName = `${item.t.join("·")}_${item.tower}_${item.floor}_${item.n}_${stamp}.jpg`.replace(/[\\/:*?"<>|]/g,"");

      // 1) 인앱 갤러리 + IndexedDB 영구 저장 (창을 닫아도 남음)
      photos.unshift(record);
      s.photoCount = (s.photoCount||0) + 1;
      saveState();
      refreshAll();
      updateGalleryBadge();
      if(document.getElementById("galleryOverlay").classList.contains("open")) renderGallery();
      idbPut(record).catch(()=>{ /* IndexedDB 불가 시 세션 내에서는 유지됨 */ });
      try{ window.storage.set(key, JSON.stringify(record), false); }catch(e){}

      // 2) 기기 사진앱에 바로 저장 (Web Share) → 안되면 다운로드
      workCanvas.toBlob((blob)=>{
        if(!blob){ showToast("📷 갤러리 저장됨 (앱 내)"); return; }
        saveToDevice(blob, fileName);
      }, "image/jpeg", 0.9);
    };
    img.onerror = ()=> showToast("이미지를 불러오지 못했어요");
    img.src = ev.target.result;
  };
  reader.onerror = ()=> showToast("사진을 읽지 못했어요");
  reader.readAsDataURL(file);
}

// 기기 사진앱/갤러리에 저장 — Web Share 우선, 안되면 다운로드
async function saveToDevice(blob, fileName){
  const photoFile = new File([blob], fileName, {type:"image/jpeg"});
  if(navigator.canShare && navigator.canShare({files:[photoFile]})){
    try{
      await navigator.share({ files:[photoFile] });
      showToast("📷 사진 저장 완료");
      return;
    }catch(err){
      if(err && err.name === "AbortError"){ showToast("📷 앱 갤러리에 저장됨"); return; }
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    showToast("📷 사진 저장됨 (다운로드)");
  }catch(err){
    showToast("📷 앱 갤러리에 저장됨");
  }
}

function drawWatermark(ctx, w, h, item, memo){
  const tagText = item.t.join("·");
  const floorText = `${item.tower} ${item.floor}`;
  const memoText = memo && memo.length>36 ? memo.slice(0,36)+"…" : (memo||"");
  const segs = [tagText, floorText, memoText].filter(Boolean);

  const fontSize = Math.max(15, Math.round(h * 0.024));
  const padX = Math.round(fontSize * 0.7);
  const padY = Math.round(fontSize * 0.55);
  const gap = Math.round(fontSize * 0.7);
  ctx.font = `${fontSize}px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
  ctx.textBaseline = "middle";

  const widths = segs.map(t=>ctx.measureText(t).width);
  const boxH = fontSize + padY * 2;
  const boxW = padX*2 + widths.reduce((a,b)=>a+b,0) + gap*(segs.length-1) + (segs.length-1)*2;
  const marginX = Math.round(w * 0.025);
  const marginY = Math.round(w * 0.025);
  const boxX = marginX;
  const boxY = h - marginY - boxH;

  ctx.fillStyle = "rgba(10,12,16,0.72)";
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = "rgba(255,255,255,0.9)";
  ctx.lineWidth = 1;
  ctx.strokeRect(boxX+0.5, boxY+0.5, boxW-1, boxH-1);

  let cx = boxX + padX;
  const cy = boxY + boxH/2;
  segs.forEach((text, i)=>{
    ctx.fillStyle = i===0 ? "#FFD9A0" : "#FFFFFF";
    ctx.font = i===0
      ? `700 ${fontSize}px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`
      : `500 ${fontSize}px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
    ctx.fillText(text, cx, cy);
    cx += widths[i] + gap;
    if(i < segs.length-1){
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.beginPath();
      ctx.moveTo(cx - gap/2, boxY + boxH*0.22);
      ctx.lineTo(cx - gap/2, boxY + boxH*0.78);
      ctx.stroke();
    }
  });
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 1800);
}

// ============ GALLERY ============
async function loadPhotos(){
  let loaded = [];
  // 1순위: IndexedDB (창 닫아도 영구 유지)
  try{
    loaded = await idbGetByPrefix(PHOTO_PREFIX);
  }catch(e){ loaded = []; }
  // 2순위: window.storage (IndexedDB가 비었을 때 백업본)
  if(loaded.length===0){
    try{
      const res = await window.storage.list(PHOTO_PREFIX, false);
      const keys = (res && res.keys) || [];
      const fromWS = await Promise.all(keys.map(async k=>{
        try{
          const r = await window.storage.get(k, false);
          return r && r.value ? JSON.parse(r.value) : null;
        }catch(e){ return null; }
      }));
      loaded = fromWS.filter(Boolean);
      // IndexedDB로 이관 저장
      loaded.forEach(rec=> idbPut(rec).catch(()=>{}));
    }catch(e){}
  }
  photos = loaded.filter(Boolean).sort((a,b)=>b.ts-a.ts);
  updateGalleryBadge();
}

function updateGalleryBadge(){
  const b = document.getElementById("galleryBadge");
  b.classList.toggle("show", photos.length>0);
  b.textContent = photos.length>0 ? photos.length : "";
}

function fmtTime(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderGallery(){
  const body = document.getElementById("galleryBody");
  document.getElementById("galleryCount").textContent = `${photos.length}장`;
  if(photos.length===0){
    body.innerHTML = `<div class="gallery-empty">아직 촬영한 사진이 없어요.<br>항목의 📷 아이콘을 눌러 메모를 남기고 촬영해보세요.</div>`;
    return;
  }
  body.innerHTML = photos.map(p=>{
    const tagsHtml = p.tags.map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join("");
    return `
      <div class="photo-card">
        <img src="${p.dataURL}" data-view="${p.key}">
        <div class="pc-body">
          <div class="pc-title">${p.itemName}</div>
          <div class="pc-sub">${p.tower} ${p.floor} · ${fmtTime(p.ts)}</div>
          <div class="tag-row" style="margin-top:6px;">${tagsHtml}</div>
          ${p.memo ? `<div class="pc-memo">${escapeHtml(p.memo)}</div>` : ""}
          <div class="pc-actions">
            <button class="pc-btn retake" data-retake="${p.key}">↻ 다시 찍기</button>
            <button class="pc-btn del" data-del="${p.key}">🗑 삭제</button>
          </div>
        </div>
      </div>`;
  }).join("");

  body.querySelectorAll("img[data-view]").forEach(img=>{
    img.addEventListener("click", ()=> openLightbox(img.src));
  });
  body.querySelectorAll("[data-retake]").forEach(btn=>{
    btn.addEventListener("click", ()=> retakePhoto(btn.dataset.retake));
  });
  body.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=> deletePhoto(btn.dataset.del));
  });
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function openGallery(){
  renderGallery();
  document.getElementById("galleryOverlay").classList.add("open");
}
function closeGallery(){
  document.getElementById("galleryOverlay").classList.remove("open");
}

function openLightbox(src){
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightboxImg").src = "";
}

async function removePhotoSilently(key){
  const idx = photos.findIndex(p=>p.key===key);
  if(idx===-1) return;
  photos.splice(idx,1);
  try{ await idbDelete(key); }catch(e){}
  try{ await window.storage.delete(key, false); }catch(e){}
}

async function deletePhoto(key){
  if(!confirm("이 사진을 삭제할까요?")) return;
  const rec = photos.find(p=>p.key===key);
  if(!rec) return;
  await removePhotoSilently(key);
  const s = getItemState(rec.itemId);
  s.photoCount = Math.max(0, (s.photoCount||0) - 1);
  saveState();
  refreshAll();
  updateGalleryBadge();
  renderGallery();
}

async function retakePhoto(key){
  const rec = photos.find(p=>p.key===key);
  if(!rec) return;
  closeGallery();
  await removePhotoSilently(key);
  const s = getItemState(rec.itemId);
  s.photoCount = Math.max(0, (s.photoCount||0) - 1);
  s.note = rec.memo || s.note;
  s.cameraOpen = true;
  saveState();
  refreshAll();
  updateGalleryBadge();
  openCamera(rec.itemId);
}

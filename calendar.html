<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>근무표</title>
<style>
  :root{
    --bg:#f4f6f9; --surface:#ffffff; --raise:#eef1f5; --border:#dde3ea;
    --text:#1a2233; --muted:#5c6b7e; --dim:#9aa7b5; --acc:#18a45c;
    --red:#e5484d; --amber:#c47d10;
    --sans:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  body.dark{
    --bg:#0a0f1e; --surface:#131a30; --raise:#1a2340; --border:#28304f;
    --text:#e7ebf5; --muted:#8a93b0; --dim:#565f80; --acc:#3ad17e;
    --red:#ff6b6b; --amber:#e8b46a;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text); font-family:var(--sans);}
  body{padding-bottom:30px;}
  header{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;
  }
  .h-row{display:flex; align-items:center; justify-content:space-between;}
  .h-title{font-size:19px; font-weight:800;}
  .h-nav{display:flex; gap:7px;}
  .nav-btn{
    width:38px; height:38px; border-radius:10px; background:var(--raise);
    border:1px solid var(--border); color:var(--text); font-size:16px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .nav-btn.today-btn{width:auto; padding:0 13px; font-size:13px; font-weight:700;}
  .seg{display:flex; gap:6px; margin-top:10px;}
  .seg button{flex:1; padding:8px 4px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--raise); color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer;}
  .seg button.sel{background:var(--acc); border-color:var(--acc); color:#fff;}
  .legend{display:flex; gap:12px; margin-top:10px; font-size:11.5px; color:var(--muted);}
  /* 주별 보기 */
  .wk-list{padding:6px 10px 0;}
  .wk-row{display:flex; align-items:center; gap:11px; background:var(--surface);
    border:1px solid var(--border); border-radius:12px; padding:12px 13px; margin-bottom:7px;}
  .wk-row.today{border-color:var(--acc); box-shadow:0 0 0 2px rgba(24,164,92,.15);}
  .wk-d{flex:none; width:46px; text-align:center;}
  .wk-d .dn{font-size:17px; font-weight:800; line-height:1.1;}
  .wk-d .dw{font-size:10.5px; font-weight:700; color:var(--muted); margin-top:2px;}
  .wk-d.red .dn,.wk-d.red .dw{color:var(--red);}
  .wk-s{flex:none; width:34px; text-align:center; font-size:21px; font-weight:800;}
  .wk-s.ju{color:var(--acc);} .wk-s.ya{color:var(--amber);} .wk-s.bi{color:var(--dim);}
  .wk-info{flex:1; min-width:0;}
  .wk-sub{font-size:12.5px; font-weight:700;}
  .wk-hol{font-size:10.5px; color:var(--red); font-weight:700; margin-top:2px;}
  .wk-time{flex:none; font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:8px;
    background:rgba(196,125,16,.12); color:var(--amber);}
  .wk-time.t8{background:rgba(229,72,77,.12); color:var(--red);}
  .wk-dot{flex:none; width:7px; height:7px; border-radius:50%; background:var(--acc);}
  .legend b{font-size:13px; margin-right:3px;}
  .lg-ju b{color:var(--acc);} .lg-ya b{color:var(--amber);} .lg-bi b{color:var(--dim);}

  .cal{padding:10px 8px 0;}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px;}
  .dow span{text-align:center; font-size:11.5px; font-weight:700; color:var(--muted); padding:6px 0;}
  .dow span:first-child, .dow span:last-child{color:var(--red);}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cell{
    min-height:84px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:5px 4px; display:flex; flex-direction:column; align-items:center;
    position:relative; overflow:hidden;
  }
  .cell.out{opacity:.35;}
  .cell.today{border:1.6px solid var(--acc); box-shadow:0 0 0 2px rgba(24,164,92,.18);}
  .d-num{
    font-size:12px; font-weight:700; color:var(--muted);
    align-self:flex-start; padding:1px 5px; border-radius:7px;
  }
  .d-num.red{color:var(--red);}
  .cell.today .d-num{background:var(--acc); color:#0a0f1e;}
  .holiday-name{
    font-size:8.5px; color:var(--red); align-self:flex-start; padding:0 3px;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    line-height:1.2; margin-top:-1px;
  }
  .shift{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .s-main{font-size:22px; font-weight:800; line-height:1;}
  .s-main.ju{color:var(--acc);}
  .s-main.ya{color:var(--amber);}
  .s-main.bi{color:var(--dim);}
  .s-sub{font-size:8.5px; color:var(--dim); font-weight:700;}
  .s-time{
    font-size:8.5px; font-weight:800; padding:1px 5px; border-radius:6px;
    background:rgba(196,125,16,.12); color:var(--amber); margin-top:1px;
  }
  .s-time.t8{background:rgba(229,72,77,.12); color:var(--red);}
  .note{
    margin:14px 14px 0; font-size:11.5px; color:var(--dim); line-height:1.65;
  }
  .ovr-dot{position:absolute; top:5px; right:5px; width:6px; height:6px; border-radius:50%; background:var(--acc);}
  .cell{cursor:pointer;}
  .ed-ov{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .ed-sheet{
    width:100%; max-width:480px; background:var(--surface); border-radius:18px 18px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -8px 30px rgba(0,0,0,.18);
  }
  .ed-title{font-size:16px; font-weight:800; margin-bottom:4px;}
  .ed-sub{font-size:12px; color:var(--muted); margin-bottom:14px;}
  .ed-opts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px;}
  .ed-opt{
    padding:14px 4px; border-radius:12px; border:1.5px solid var(--border); background:var(--raise);
    text-align:center; font-size:15px; font-weight:800; color:var(--muted); cursor:pointer;
  }
  .ed-opt.cur{border-color:var(--acc); color:var(--acc); background:rgba(24,164,92,.08);}
  .ed-reset{
    width:100%; padding:12px; border-radius:12px; border:1.5px dashed var(--border);
    background:none; color:var(--muted); font-size:13px; font-weight:700; cursor:pointer;
  }
</style>
</head>
<body>
<header>
  <div class="h-row">
    <div class="h-title" id="monthTitle">-</div>
    <div class="h-nav">
      <button class="nav-btn" onclick="move(-1)">◀</button>
      <button class="nav-btn today-btn" onclick="goToday()">오늘</button>
      <button class="nav-btn" onclick="move(1)">▶</button>
    </div>
  </div>
  <div class="seg" id="viewSeg">
    <button data-v="month" class="sel">월별</button>
    <button data-v="week">주별</button>
  </div>
  <div class="legend">
    <span class="lg-ju"><b>주</b>08~17시</span>
    <span class="lg-ya"><b>야</b>당직 15시~익일 08시</span>
    <span class="lg-bi"><b>비</b>비번(휴무)</span>
  </div>
</header>

<div class="cal">
  <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
  <div class="grid" id="grid"></div>
</div>

<div class="note">
  · 주기: 주1 → 주2 → 당직(야) → 비번, 4일 반복 (기준 2026-07-24 = 주1)<br>
  · 당직 출근: 평일 15시 / <b style="color:var(--red);">주말·공휴일 08시</b><br>
  · 공휴일은 빨간색으로 표시 · <b>날짜를 탭하면 그 날 근무를 직접 수정</b>할 수 있습니다 (초록 점 = 수정됨)<br>
  · 수정한 근무는 일일업무의 '오늘 근무조' 계산에도 그대로 반영됩니다.
</div>

<script>
// ===== 근무 주기 =====
const ANCHOR = new Date(2026,6,24);   // 2026-07-24 = 주1
const CYCLE = [
  {k:'ju', big:'주', sub:'주1'},
  {k:'ju', big:'주', sub:'주2'},
  {k:'ya', big:'야', sub:'당직'},
  {k:'bi', big:'비', sub:'비번'},
];
const OVR_KEY='shift-overrides-v1';
function getOverrides(){
  try{return JSON.parse(localStorage.getItem(OVR_KEY))||{};}catch(e){return {};}
}
function setOverride(key, idx){
  const ov=getOverrides();
  if(idx===null) delete ov[key]; else ov[key]=idx;
  try{localStorage.setItem(OVR_KEY, JSON.stringify(ov));}catch(e){}
}
function baseIdxOf(date){
  const a=new Date(ANCHOR.getFullYear(),ANCHOR.getMonth(),ANCHOR.getDate());
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  const diff=Math.round((d-a)/86400000);
  return ((diff%4)+4)%4;
}
function shiftIdxOf(date){
  const ov=getOverrides()[dkey(date)];
  return (ov!==undefined&&ov!==null) ? ov : baseIdxOf(date);
}
function shiftOf(date){ return CYCLE[shiftIdxOf(date)]; }
function isOverridden(date){ const ov=getOverrides()[dkey(date)]; return ov!==undefined&&ov!==null; }

// ===== 공휴일 (2026~2027) =====
// ※ 대체공휴일 포함. 정부 발표에 따라 달라질 수 있으니 연말에 확인 권장.
const HOLIDAYS = {
  "2026-01-01":"신정",
  "2026-02-16":"설날연휴","2026-02-17":"설날","2026-02-18":"설날연휴",
  "2026-03-01":"삼일절","2026-03-02":"대체공휴일",
  "2026-05-05":"어린이날",
  "2026-05-24":"부처님오신날","2026-05-25":"대체공휴일",
  "2026-06-06":"현충일",
  "2026-07-17":"제헌절",
  "2026-08-15":"광복절","2026-08-17":"광복절(대체)",
  "2026-09-24":"추석연휴","2026-09-25":"추석","2026-09-26":"추석연휴",
  "2026-10-03":"개천절","2026-10-05":"대체공휴일",
  "2026-10-09":"한글날",
  "2026-12-25":"성탄절",
  "2027-01-01":"신정",
  "2027-02-06":"설날연휴","2027-02-07":"설날","2027-02-08":"설날연휴","2027-02-09":"대체공휴일",
  "2027-03-01":"삼일절",
  "2027-05-05":"어린이날",
  "2027-05-13":"부처님오신날",
  "2027-06-06":"현충일",
  "2027-07-17":"제헌절",
  "2027-08-15":"광복절","2027-08-16":"대체공휴일",
  "2027-09-14":"추석연휴","2027-09-15":"추석","2027-09-16":"추석연휴",
  "2027-10-03":"개천절","2027-10-04":"대체공휴일",
  "2027-10-09":"한글날","2027-10-11":"대체공휴일",
  "2027-12-25":"성탄절",
};
// 제헌절은 표기만 하고 휴일 취급하지 않음 (2008년부터 공휴일 아님)
const DISPLAY_ONLY = new Set(["2026-07-17","2027-07-17"]);

function dkey(d){
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function isRealHoliday(d){
  const k=dkey(d);
  return !!HOLIDAYS[k] && !DISPLAY_ONLY.has(k);
}

// ===== 렌더 =====
let cur = new Date();
cur.setDate(1);

function render(){
  if(typeof viewMode!=='undefined'&&viewMode==='week'){ renderWeek(); return; }
  const wl=document.getElementById('wkList'); if(wl)wl.style.display='none';
  document.getElementById('grid').style.display='';
  const dwe=document.querySelector('.dow'); if(dwe)dwe.style.display='';
  document.getElementById("monthTitle").textContent = `${cur.getFullYear()}년 ${cur.getMonth()+1}월`;
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  const first=new Date(cur.getFullYear(),cur.getMonth(),1);
  const start=new Date(first); start.setDate(1-first.getDay());
  const today=new Date();
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const inMonth = d.getMonth()===cur.getMonth();
    const k=dkey(d);
    const hol=HOLIDAYS[k];
    const dow=d.getDay();
    const isRed = dow===0 || dow===6 || !!hol;
    const s=shiftOf(d);
    const isToday = d.toDateString()===today.toDateString();

    // 당직 출근시간: 주말·공휴일 08시 / 평일 15시
    let timeTag="";
    if(s.k==="ya"){
      const wknd = dow===0 || dow===6 || isRealHoliday(d);
      timeTag = wknd
        ? `<span class="s-time t8">8시출근</span>`
        : `<span class="s-time">3시출근</span>`;
    }

    const cell=document.createElement("div");
    cell.className="cell"+(inMonth?"":" out")+(isToday?" today":"");
    cell.innerHTML=`
      <span class="d-num${isRed?" red":""}">${d.getDate()}</span>
      ${hol?`<span class="holiday-name">${hol}</span>`:""}
      <div class="shift">
        <span class="s-main ${s.k}">${s.big}</span>
        <span class="s-sub">${s.sub}</span>
        ${timeTag}
      </div>
      ${isOverridden(d)?'<span class="ovr-dot" title="수정됨"></span>':''}`;
    cell.addEventListener("click",()=>openEditor(new Date(d)));
    grid.appendChild(cell);
    // 6주차가 통째로 다음달이면 5주만 표시
    if(i===34){
      const next=new Date(start); next.setDate(start.getDate()+35);
      if(next.getMonth()!==cur.getMonth()) break;
    }
  }
}
let viewMode='month';
let wkStart=(()=>{const d=new Date(); d.setDate(d.getDate()-d.getDay()); d.setHours(0,0,0,0); return d;})();
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{
  viewMode=b.dataset.v;
  document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('sel',x===b));
  render();
});
function renderWeek(){
  const grid=document.getElementById('grid');
  const dowEl=document.querySelector('.dow');
  grid.style.display='none'; dowEl.style.display='none';
  let wrap=document.getElementById('wkList');
  if(!wrap){wrap=document.createElement('div'); wrap.className='wk-list'; wrap.id='wkList'; grid.parentNode.appendChild(wrap);}
  wrap.style.display='';
  const end=new Date(wkStart); end.setDate(end.getDate()+6);
  document.getElementById('monthTitle').textContent =
    `${wkStart.getMonth()+1}/${wkStart.getDate()} ~ ${end.getMonth()+1}/${end.getDate()}`;
  const DW=['일','월','화','수','목','금','토'];
  const today=new Date();
  wrap.innerHTML='';
  for(let i=0;i<7;i++){
    const d=new Date(wkStart); d.setDate(wkStart.getDate()+i);
    const k=dkey(d), hol=HOLIDAYS[k], s=shiftOf(d), dw=d.getDay();
    const isRed = dw===0||dw===6||!!hol;
    const isToday = d.toDateString()===today.toDateString();
    let tt='';
    if(s.k==='ya'){
      const wknd = dw===0||dw===6||isRealHoliday(d);
      tt=`<span class="wk-time${wknd?' t8':''}">${wknd?'8시출근':'3시출근'}</span>`;
    }
    wrap.insertAdjacentHTML('beforeend',`
      <div class="wk-row${isToday?' today':''}" data-k="${k}">
        <div class="wk-d${isRed?' red':''}"><div class="dn">${d.getDate()}</div><div class="dw">${DW[dw]}</div></div>
        <div class="wk-s ${s.k}">${s.big}</div>
        <div class="wk-info"><div class="wk-sub">${s.sub}</div>${hol?`<div class="wk-hol">${hol}</div>`:''}</div>
        ${tt}${isOverridden(d)?'<span class="wk-dot"></span>':''}
      </div>`);
  }
  wrap.querySelectorAll('.wk-row').forEach(r=>r.onclick=()=>{
    const [y,m,dd]=r.dataset.k.split('-').map(Number);
    openEditor(new Date(y,m-1,dd));
  });
}
function move(dir){
  if(viewMode==='week'){ wkStart.setDate(wkStart.getDate()+dir*7); }
  else { cur.setMonth(cur.getMonth()+dir); }
  render();
}

// ===== 날짜 탭 → 근무조 수정 =====
const ED_LABEL=['주1','주2','야(당직)','비번'];
function openEditor(d){
  const k=dkey(d);
  const curIdx=shiftIdxOf(d);
  const base=baseIdxOf(d);
  const ov=document.createElement("div");
  ov.className="ed-ov";
  ov.innerHTML=`<div class="ed-sheet">
    <div class="ed-title">${d.getMonth()+1}월 ${d.getDate()}일 근무 수정</div>
    <div class="ed-sub">기본 주기값: ${ED_LABEL[base]} ${isOverridden(d)?'· 현재 수정됨':''}</div>
    <div class="ed-opts">
      ${ED_LABEL.map((l,i)=>`<button class="ed-opt${i===curIdx?' cur':''}" data-i="${i}">${['주','주','야','비'][i]}<div style="font-size:9.5px;font-weight:700;margin-top:2px;">${l}</div></button>`).join('')}
    </div>
    <button class="ed-reset" data-r="reset">기본 주기값으로 되돌리기</button>
  </div>`;
  ov.addEventListener("click",(e)=>{
    const opt=e.target.closest(".ed-opt");
    if(opt){
      const i=Number(opt.dataset.i);
      setOverride(k, i===base ? null : i);
      ov.remove(); render(); return;
    }
    if(e.target.closest("[data-r=reset]")){
      setOverride(k, null);
      ov.remove(); render(); return;
    }
    if(e.target===ov) ov.remove();
  });
  document.body.appendChild(ov);
}
function goToday(){
  const t=new Date();
  cur=new Date(t.getFullYear(),t.getMonth(),1);
  wkStart=new Date(t); wkStart.setDate(t.getDate()-t.getDay()); wkStart.setHours(0,0,0,0);
  render();
}
try{ if(localStorage.getItem("app-theme")!=="light") document.body.classList.add("dark"); }catch(e){}
render();
</script>
</body>
</html>

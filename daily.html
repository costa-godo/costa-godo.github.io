<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>일일 업무 체크리스트</title>
<style>
  :root{
    --bg:#0e1316; --surface:#171f24; --raise:#1e282e; --border:#2b363d;
    --text:#e9eef1; --muted:#8b98a2; --dim:#5d6a73;
    --acc:#3ad17e; --acc-glow:rgba(58,209,126,.45);
    --imp1:#f2b13c; --imp2:#ff5d5d;
    --fs:16px;
    --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font); font-size:var(--fs); line-height:1.4; letter-spacing:-.01em; padding-bottom:env(safe-area-inset-bottom); transition:background .25s,color .25s;}
  button{font-family:var(--font);}

  header{position:sticky; top:0; z-index:30; background:var(--surface); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); padding:calc(9px + env(safe-area-inset-top)) 14px 9px;}
  .h-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .h-left{min-width:0;}
  .h-title{font-size:16px; font-weight:700;}
  .h-date{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:1px;}
  .h-day{color:var(--acc); font-weight:700;}
  .h-btns{display:flex; gap:7px; flex:none;}
  .icon-btn{width:38px; height:38px; border-radius:10px; background:var(--raise); border:1px solid var(--border); color:var(--text); font-size:17px; display:flex; align-items:center; justify-content:center;}
  .icon-btn.on{background:var(--acc); border-color:var(--acc); color:#0e1316;}
  .bar-wrap{margin-top:9px; display:flex; align-items:center; gap:10px;}
  .bar{flex:1; height:8px; background:rgba(0,0,0,.25); border-radius:6px; overflow:hidden; border:1px solid var(--border);}
  .bar-fill{height:100%; width:0; background:var(--acc); border-radius:6px; transition:width .35s; box-shadow:0 0 8px var(--acc-glow);}
  .bar-pct{font-family:var(--mono); font-size:12.5px; font-weight:700; min-width:50px; text-align:right;}
  .h-next{margin-top:7px; font-size:12px; color:var(--muted);}
  .h-next b{color:var(--imp1); font-family:var(--mono);}
  .filters{margin-top:8px; display:flex; gap:6px;}
  .shift-tabs{margin-top:8px; display:flex; gap:6px;}
  .stab{flex:1; min-width:0; padding:9px 1px; border-radius:11px; text-align:center; font-size:12.5px; font-weight:800; color:var(--muted); background:var(--raise); border:1.5px solid var(--border); position:relative; cursor:pointer; letter-spacing:-.03em;}
  .stab.sel{background:var(--acc); color:#fff; border-color:var(--acc);}
  .stab.today{border:2px solid #22C55E; box-shadow:0 0 0 2px rgba(34,197,94,.22);}
  .stab .today-dot{position:absolute; top:-8px; right:-3px; font-size:9px; background:#22C55E; color:#fff; padding:1.5px 6px; border-radius:8px; font-weight:800;}
  .rest-card{margin:22px 14px; padding:30px 16px; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:14px; color:var(--muted); font-size:14.5px; line-height:1.8;}
  .rest-card b{color:var(--text); font-size:16px;}
  .dawn-divider{margin:18px 14px 4px; display:flex; align-items:center; gap:9px; font-size:11.5px; font-weight:700; letter-spacing:.1em; color:#22C55E;}
  .dawn-divider::after{content:""; flex:1; height:1px; background:var(--border);}
  .chip{font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:20px; background:var(--raise); border:1px solid var(--border); color:var(--muted);}
  .chip.on{background:var(--acc); border-color:var(--acc); color:#0e1316;}

  .phase{margin:16px 14px 4px; display:flex; align-items:center; gap:9px; font-size:11.5px; font-weight:700; letter-spacing:.1em; color:var(--dim); text-transform:uppercase;}
  .phase::after{content:""; flex:1; height:1px; background:var(--border);}
  .phase.duty{color:var(--imp1);}

  .list{padding:0 10px;}
  .block{display:flex; gap:10px; padding:3px 0;}
  .rail{width:20px; display:flex; flex-direction:column; align-items:center; padding-top:15px;}
  .led{width:15px; height:15px; border-radius:50%; flex:none; background:rgba(0,0,0,.3); border:2px solid var(--dim); transition:all .3s;}
  .led.partial{border-color:var(--imp1); box-shadow:0 0 6px rgba(242,177,60,.4);}
  .led.done{background:var(--acc); border-color:var(--acc); box-shadow:0 0 10px var(--acc-glow);}
  .rail-line{flex:1; width:2px; background:var(--border); margin-top:5px; min-height:8px;}
  .block:last-child .rail-line{display:none;}

  .card{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:11px 12px 5px; margin-bottom:8px;}
  .card.now{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc-glow);}
  .c-head{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .c-time{font-family:var(--mono); font-size:16px; font-weight:700;}
  .c-name{font-size:12px; color:var(--muted); font-weight:600;}
  .c-alarm{font-size:12px; color:var(--imp1);}
  .now-tag{font-size:10px; font-weight:700; color:var(--acc); background:var(--acc-glow); padding:2px 7px; border-radius:20px; margin-left:auto;}
  .collapse-btn{margin-left:auto; color:var(--dim); font-size:13px; padding:2px 6px;}

  .item{display:flex; align-items:flex-start; gap:10px; padding:9px 2px; border-top:1px solid var(--border);}
  .item:first-of-type{border-top:none;}
  .item .tap{display:flex; gap:10px; flex:1; min-width:0; cursor:pointer;}
  .chk{width:24px; height:24px; border-radius:7px; border:2px solid #3a4750; flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .18s; background:rgba(0,0,0,.2);}
  .chk svg{width:14px; height:14px; opacity:0; transform:scale(.5); transition:all .18s;}
  .item.done .chk{background:var(--acc); border-color:var(--acc);}
  .item.done .chk svg{opacity:1; transform:scale(1);}
  .i-body{flex:1; min-width:0;}
  .i-text{font-size:15px; line-height:1.55; white-space:pre-line; word-break:keep-all; overflow-wrap:anywhere;}
  .item.done .i-text{color:var(--dim); text-decoration:line-through;}
  .i-meta{display:flex; align-items:center; gap:5px; margin-top:4px; flex-wrap:wrap;}
  .cat{font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px;}
  .day-badge{font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; color:var(--imp1); background:rgba(242,177,60,.13); font-family:var(--mono);}
  .imp{font-size:10.5px; font-weight:800; padding:1px 6px; border-radius:5px;}
  .imp1{color:var(--imp1); background:rgba(242,177,60,.14);}
  .imp2{color:#fff; background:var(--imp2);}
  .memo-btn{font-size:11px; color:var(--dim); padding:2px 6px; border-radius:6px;}
  .memo-btn.has{color:var(--imp1);}
  .item.na{opacity:.4;}
  .na-tag{font-size:10.5px; color:var(--dim); font-weight:600;}
  .item.imp2-row .i-text{font-weight:600;}
  .item.imp2-row{border-left:3px solid var(--imp2); margin-left:-2px; padding-left:8px;}

  .memo-box{padding:0 2px 8px 34px;}
  .memo-box textarea{width:100%; background:rgba(0,0,0,.2); border:1px solid var(--border); border-radius:9px; color:var(--text); font-family:var(--font); font-size:14px; padding:8px 10px; resize:none;}
  .memo-box textarea:focus{outline:none; border-color:var(--acc);}
  .hidden{display:none;}

  .steps{margin:2px 2px 8px 34px; background:rgba(0,0,0,.18); border:1px solid var(--border); border-radius:11px; overflow:hidden;}
  .steps-head{display:flex; align-items:center; gap:8px; padding:9px 11px; font-size:12.5px; font-weight:700; color:var(--imp2);}
  .steps-head .cnt{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted);}
  .step{display:flex; align-items:center; gap:10px; padding:8px 11px; border-top:1px solid var(--border);}
  .step-num{font-family:var(--mono); font-size:12px; color:var(--dim); width:15px; flex:none;}
  .step-chk{width:20px; height:20px; border-radius:6px; border:2px solid #3a4750; flex:none; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.2);}
  .step-chk svg{width:12px; height:12px; opacity:0;}
  .step.done .step-chk{background:var(--acc); border-color:var(--acc);}
  .step.done .step-chk svg{opacity:1;}
  .step-text{font-size:14px;}
  .step.done .step-text{color:var(--dim); text-decoration:line-through;}
  .chev{transition:transform .2s; color:var(--dim);}
  .chev.open{transform:rotate(90deg);}

  body.edit .card{border-style:dashed;}
  .edit-ctrls{display:none; gap:5px; align-items:center; margin-left:auto;}
  body.edit .edit-ctrls{display:flex;}
  body.edit .tap{pointer-events:none;}
  body.edit .memo-box,body.edit .steps{display:none;}
  .mini{width:30px; height:30px; border-radius:8px; background:var(--raise); border:1px solid var(--border); color:var(--text); font-size:14px; display:flex; align-items:center; justify-content:center;}
  .mini.del{color:var(--imp2);}
  .block-edit{display:none; gap:6px; margin:2px 0 8px; flex-wrap:wrap;}
  body.edit .block-edit{display:flex;}
  .be-btn{font-size:12px; font-weight:600; padding:7px 11px; border-radius:9px; background:var(--raise); border:1px solid var(--border); color:var(--text);}
  .be-btn.del{color:var(--imp2);}
  .add-block{display:none; width:calc(100% - 20px); margin:6px 10px 4px 30px; padding:12px; border-radius:12px; background:transparent; border:1.5px dashed var(--border); color:var(--acc); font-size:14px; font-weight:700;}
  body.edit .add-block{display:block;}

  footer{padding:16px 14px calc(30px + env(safe-area-inset-bottom)); text-align:center;}
  .reset{background:var(--raise); color:var(--muted); border:1px solid var(--border); border-radius:10px; padding:11px 20px; font-size:13.5px; font-weight:600;}
  .foot-note{margin-top:12px; font-size:11.5px; color:var(--dim); line-height:1.6;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:101; background:var(--surface); border-top:1px solid var(--border); border-radius:20px 20px 0 0; padding:8px 18px calc(24px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.3,1); max-height:88vh; overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .grab{width:38px; height:4px; background:var(--dim); border-radius:3px; margin:6px auto 14px;}
  .sheet h2{font-size:17px; margin:0 0 14px;}
  .sec{margin-bottom:20px;}
  .sec-t{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.05em; margin-bottom:9px; text-transform:uppercase;}
  .row-set{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border);}
  .row-set:last-child{border:none;}
  .swatches{display:flex; gap:9px; flex-wrap:wrap;}
  .sw{width:40px; height:40px; border-radius:11px; border:2px solid transparent; position:relative;}
  .sw.sel{border-color:var(--text);}
  .sw.sel::after{content:"\2713"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .base-opts{display:flex; gap:8px;}
  .base-opt{flex:1; padding:11px; border-radius:11px; border:1px solid var(--border); background:var(--raise); text-align:center; font-size:13px; font-weight:600;}
  .base-opt.sel{border-color:var(--acc); color:var(--acc);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .field input,.field textarea{width:100%; background:var(--raise); border:1px solid var(--border); border-radius:11px; color:var(--text); font-family:var(--font); font-size:16px; padding:12px;}
  .field input:focus,.field textarea:focus{outline:none; border-color:var(--acc);}
  .imp-opts,.cat-opts,.day-opts{display:flex; gap:7px; flex-wrap:wrap;}
  .opt{padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--raise); font-size:13.5px; font-weight:600;}
  .opt.sel{border-color:var(--acc); background:var(--acc-glow); color:var(--acc);}
  .day-opts .opt{padding:9px 0; width:42px; text-align:center;}
  .toggle{width:50px; height:30px; border-radius:16px; background:var(--border); position:relative; transition:.2s; flex:none;}
  .toggle.on{background:var(--acc);}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.2s;}
  .toggle.on::after{left:23px;}
  .big-btn{width:100%; padding:14px; border-radius:12px; background:var(--acc); color:#0e1316; font-size:15px; font-weight:700; border:none; margin-top:6px;}
  .big-btn.ghost{background:var(--raise); color:var(--text); border:1px solid var(--border);}
  .big-btn.danger{background:transparent; color:var(--imp2); border:1px solid var(--imp2);}
  .btn-row{display:flex; gap:9px;}
  .btn-row .big-btn{flex:1;}
  .toast{position:fixed; left:14px; right:14px; top:calc(12px + env(safe-area-inset-top)); z-index:200; background:var(--acc); color:#0e1316; padding:14px 16px; border-radius:13px; font-weight:700; font-size:14.5px; box-shadow:0 8px 24px rgba(0,0,0,.4); transform:translateY(-140%); transition:transform .3s; display:flex; align-items:center; gap:10px;}
  .toast.show{transform:translateY(0);}
  .set-desc{font-size:11.5px; color:var(--dim); line-height:1.5; margin-top:4px;}
  body.edit .c-head, body.edit .item{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}

  /* ===== 항목 사진 ===== */
  .ph-btn{font-size:12px; color:var(--muted); background:var(--raise); padding:3px 9px; border-radius:12px; cursor:pointer; font-weight:700;}
  .ph-btn.has{color:var(--acc);}
  .photo-panel{margin-top:9px; background:var(--raise); border:1px solid var(--border); border-radius:12px; padding:9px;}
  .ph-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .ph-thumb{position:relative; aspect-ratio:1; border-radius:9px; overflow:hidden; background:var(--surface); border:1px solid var(--border); cursor:pointer;}
  .ph-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .ph-thumb .cloud{position:absolute; top:4px; right:4px; font-size:9px; background:rgba(0,0,0,.55); color:#8fe3b5; padding:1px 5px; border-radius:7px;}
  .ph-add{aspect-ratio:1; border-radius:9px; border:1.6px dashed var(--border); background:none; color:var(--muted); font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer;}
  .ph-add .pl{font-size:20px; line-height:1;}
  .ph-cap{margin-top:7px; font-size:10.5px; color:var(--dim); text-align:right;}
  /* 라이트박스 */
  .lb-ov{position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:300; display:flex; flex-direction:column;}
  .lb-top{display:flex; justify-content:space-between; align-items:center; padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px; color:#fff;}
  .lb-cnt{font-size:13.5px; font-weight:700; font-family:var(--mono, monospace);}
  .lb-acts{display:flex; gap:14px;}
  .lb-acts button{background:none; border:none; color:#fff; font-size:19px; cursor:pointer;}
  .lb-body{flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0;}
  .lb-body img{max-width:100%; max-height:100%; object-fit:contain;}
  .lb-nav{position:absolute; top:0; bottom:0; width:34%; display:flex; align-items:center; color:rgba(255,255,255,.65); font-size:26px; cursor:pointer; user-select:none;}
  .lb-nav.prev{left:0; justify-content:flex-start; padding-left:14px;}
  .lb-nav.next{right:0; justify-content:flex-end; padding-right:14px;}
  /* 백업 섹션 */
  .ghsync{margin:14px 14px 0;}
  .gh-head{font-size:13.5px; font-weight:800; margin-bottom:8px; display:flex; align-items:baseline; gap:8px;}
  .gh-hint{font-size:10.5px; font-weight:600; color:var(--dim);}
  .gh-btns{display:flex; gap:7px;}
  .gh-btn{flex:1; padding:11px 6px; border-radius:11px; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer;}
  .gh-btn.primary{background:var(--acc); border-color:var(--acc); color:#0e1316; font-weight:800;}
  .gh-status{margin-top:7px; font-size:11px; color:var(--dim); line-height:1.55;}


  .shift-opts{display:flex; flex-wrap:wrap; gap:6px;}
  .sopt{padding:9px 13px; border-radius:11px; border:1.5px solid var(--border); background:var(--raise); color:var(--muted); font-size:13px; font-weight:700; cursor:pointer;}
  .sopt.sel{background:var(--acc); border-color:var(--acc); color:#0e1316;}
  /* ===== 업무 메모장 ===== */
  .workmemo{margin:18px 14px 6px;}
  .wm-head{font-size:13.5px; font-weight:800; color:var(--text); margin-bottom:8px; display:flex; align-items:baseline; gap:8px;}
  .wm-hint{font-size:10.5px; font-weight:600; color:var(--dim);}
  #workMemo{
    width:100%; min-height:120px; resize:vertical;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:13px; color:var(--text); font-size:14.5px; line-height:1.6; font-family:var(--sans, inherit);
  }
  #workMemo:focus{outline:none; border-color:var(--acc);}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div class="h-left">
      <div class="h-title">일일 업무 체크리스트</div>
      <div class="h-date"><span id="dateStr"></span> <span class="h-day" id="dayStr"></span></div>
    </div>
    <div class="h-btns">
      <button class="icon-btn" id="setBtn">⚙</button>
      <button class="icon-btn" id="editBtn">✏️</button>
    </div>
  </div>
  <div class="bar-wrap"><div class="bar"><div class="bar-fill" id="barFill"></div></div><div class="bar-pct" id="barPct">0/0</div></div>
  <div class="h-next" id="nextTask"></div>
  <div class="filters">
    <button class="chip" id="fltIncomplete">미완료만</button>
    <button class="chip" id="fltImportant">필수만</button>
  </div>
  <div class="shift-tabs" id="shiftTabs"></div>
</header>

<div class="list" id="list"></div>

<div class="workmemo">
  <div class="wm-head">📌 빠른 인수인계 메모 <span class="wm-hint">자동 저장 · 날짜가 바뀌어도 유지</span></div>
  <textarea id="workMemo" placeholder="인수인계, 특이사항, 잊지 말 것 등을 자유롭게 적어두세요"></textarea>
</div>

<div class="ghsync">
  <div class="gh-head">☁️ 깃허브 자동 백업 <span class="gh-hint">체크리스트 · 메모 · 사진 전체</span></div>
  <div class="gh-btns">
    <button class="gh-btn primary" onclick="ghBackup(true)">지금 백업</button>
    <button class="gh-btn" onclick="ghPull(true)">불러오기</button>
    <button class="gh-btn" onclick="ghConfigSheet()">⚙ 연결설정</button>
  </div>
  <div class="gh-status" id="ghStatus"></div>
</div>

<input type="file" id="photoInput" accept="image/*" multiple style="display:none">

<footer>
  <button class="reset" id="resetBtn">오늘 체크 초기화</button>
  <div class="foot-note">
    편집(✏️)으로 항목·시간·색상·순서·중요도·알람을 직접 바꿀 수 있습니다.<br>
    날짜가 바뀌면 체크는 자동으로 새로 시작됩니다.
  </div>
</footer>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const DAYS=['일','월','화','수','목','금','토'];

function dkey(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function shiftIdxOf(date){
  const ov=shiftOverrides()[dkey(date)];
  if(ov!==undefined&&ov!==null)return ov;
  const a=new Date(SHIFT_ANCHOR.getFullYear(),SHIFT_ANCHOR.getMonth(),SHIFT_ANCHOR.getDate());
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  const diff=Math.round((d-a)/86400000);
  return ((diff%4)+4)%4;
}

    // (어제가 주1/주2/비번이면 오늘은 그냥 오늘 스케줄대로 시작한다)
    const yday=new Date(eff); yday.setDate(yday.getDate()-1);
    if(shiftIdxOf(yday)===2) eff.setDate(eff.getDate()-1);
  }
  return shiftIdxOf(eff);
}
let curShift=todayShiftIdx();
function blkMins(b){const[h,m]=b.time.split(':').map(Number);return h*60+m;}
function blockShiftGroup(b){
  const t=blkMins(b);
  if(t>=480&&t<900) return 'day';     // 08:00~14:59 → 주1·주2
  if(t>=900) return 'dutyEve';        // 15:00~ → 당직(저녁)
  return 'dutyDawn';                  // ~07:59 → 당직(익일 새벽)
}
function itemInShift(it,shift){
  if(shift==='주1'&&(it.text||'').includes('주2'))return false;
  if(shift==='주2'&&(it.text||'').includes('주1'))return false;
  return true;
}
function blockInShift(b,shift){
  // 블록에 근무조가 직접 지정되어 있으면 최우선 적용
  if(Array.isArray(b.shifts)&&b.shifts.length) return b.shifts.includes(shift);
  // 금요일 업무 블록: 금요일 탭 항상 / 주1 탭은 '오늘이 금요일'일 때만
  if(b.fri){
    if(shift==='금요일') return true;
    if(shift==='주1') return now.getDay()===5;
    return false;
  }
  if(shift==='금요일') return false;
  const g=blockShiftGroup(b);
  if(shift==='당직') return g!=='day';
  if(shift==='비번') return false;
  if(g!=='day') return false;
  if(shift==='주1'&&(b.name||'').includes('주2'))return false;
  if(shift==='주2'&&(b.name||'').includes('주1'))return false;
  return b.items.some(it=>itemInShift(it,shift));
}
function renderShiftTabs(){
  const wrap=document.getElementById('shiftTabs'); if(!wrap)return;
  wrap.innerHTML='';
  const tIdx=todayShiftIdx();
  TABS.forEach((s,i)=>{
    const el=document.createElement('button');
    el.className='stab'+(i===curShift?' sel':'')+(i===tIdx?' today':'');
    el.innerHTML=s+(i===tIdx?'<span class="today-dot">오늘</span>':'');
    el.onclick=()=>{curShift=i; render();};
    wrap.appendChild(el);
  });
}
const collapsed={};

function hexRgba(hex,a){const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
function applyTheme(){
  const b=BASES[schema.settings.base]||BASES.dark;
  const acc=ACCENTS[schema.settings.accent]||ACCENTS.초록;
  const r=document.documentElement.style;
  r.setProperty('--bg',b.bg); r.setProperty('--surface',b.surface); r.setProperty('--raise',b.raise);
  r.setProperty('--border',b.border); r.setProperty('--text',b.text); r.setProperty('--muted',b.muted); r.setProperty('--dim',b.dim);
  r.setProperty('--acc',acc); r.setProperty('--acc-glow',hexRgba(acc,.4));
  r.setProperty('--fs',(schema.settings.fs||16)+'px');
}

function applies(it){return !it.days||it.days.includes(dow);}
function itemDone(it){
  if(!applies(it))return true;
  if(it.steps){const s=st.steps[it.id]||[]; return it.steps.every((_,i)=>s[i]);}
  return !!st.done[it.id];
}
function catCol(c){return CATCOLOR[c]||CATCOLOR['기타'];}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  applyTheme();
  renderShiftTabs();
  document.getElementById('dateStr').textContent=`${now.getMonth()+1}/${now.getDate()}`;
  document.getElementById('dayStr').textContent=`(${DAYS[dow]})`;
  const list=document.getElementById('list'); list.innerHTML='';
  let lastPhase=null;

  // 근무조별 표시 블록 구성 (편집모드에서도 동일 필터)
  const shiftName=TABS[curShift];
  let renderList=schema.blocks.map((b,bi)=>({b,bi}));
  let dawnStartIdx=-1;
  {
    if(shiftName==='비번'){
      const biList=renderList.filter(x=>Array.isArray(x.b.shifts)&&x.b.shifts.includes('비번'));
      if(!biList.length){
        const rest=document.createElement('div');
        rest.className='rest-card';
        rest.innerHTML=editMode
          ? '<b>비번 탭에 지정된 항목이 없습니다</b><br>다른 탭에서 블록의 <b>근무조</b>를 편집하면<br>비번에도 표시할 수 있습니다.'
          : '<b>오늘은 비번(휴무) 🛌</b><br>당직 마치고 푹 쉬는 날.<br>다음 근무 주기는 주1부터 다시 시작.';
        list.appendChild(rest);
        if(editMode){const ab=document.createElement('button'); ab.className='add-block'; ab.textContent='＋ 시간 블록 추가'; ab.onclick=addBlock; list.appendChild(ab);}
        updateProgress(); markNow();
        return;
      }
      renderList=biList.sort((a,c)=>blkMins(a.b)-blkMins(c.b));
    }
    if(shiftName==='당직'){
      const eve=renderList.filter(x=>blockShiftGroup(x.b)==='dutyEve').sort((a,c)=>blkMins(a.b)-blkMins(c.b));
      const dawn=renderList.filter(x=>blockShiftGroup(x.b)==='dutyDawn').sort((a,c)=>blkMins(a.b)-blkMins(c.b));
      renderList=[...eve,...dawn]; dawnStartIdx=eve.length;
    }else{
      renderList=renderList.filter(x=>blockInShift(x.b,shiftName)).sort((a,c)=>blkMins(a.b)-blkMins(c.b));
    }
  }

  renderList.forEach(({b,bi},ri)=>{
    if(!editMode&&ri===dawnStartIdx&&dawnStartIdx>0){
      const dv=document.createElement('div');
      dv.className='dawn-divider';
      dv.textContent='익일 새벽 · 당직 이어서';
      list.appendChild(dv);
    }
    if(editMode&&b.phase!==lastPhase){
      const ph=document.createElement('div');
      ph.className='phase'+(b.phase==='당직'?' duty':'');
      ph.textContent=b.phase==='당직'?'당직 · 오후 3시 출근':(b.phase||'주간');
      list.appendChild(ph); lastPhase=b.phase;
    }
    const applicable=b.items.filter(it=>applies(it)&&(editMode||itemInShift(it,shiftName)));
    const doneCnt=applicable.filter(itemDone).length;
    const led=doneCnt===0?'':(applicable.length&&doneCnt===applicable.length?'done':'partial');

    let visItems=b.items;
    if(!editMode&&filterIncomplete)visItems=visItems.filter(it=>applies(it)&&!itemDone(it));
    if(!editMode&&filterImportant)visItems=visItems.filter(it=>it.imp===2);
    if(!editMode&&(filterIncomplete||filterImportant)&&visItems.length===0)return;

    const block=document.createElement('div'); block.className='block'; block.dataset.bi=bi;
    block.innerHTML=`<div class="rail"><div class="led ${led}"></div><div class="rail-line"></div></div>`;
    const card=document.createElement('div'); card.className='card'; card.dataset.bid=b.id;
    const isCol=collapsed[b.id];

    const timeLabel=b.time2?`${b.time}~${b.time2}`:b.time;
    const head=document.createElement('div'); head.className='c-head';
    head.innerHTML=`<span class="c-time">${timeLabel}</span>${b.name?`<span class="c-name">${b.name}</span>`:''}${b.alarm?'<span class="c-alarm">⏰</span>':''}`;
    if(!editMode){
      const cb=document.createElement('span'); cb.className='collapse-btn'; cb.textContent=isCol?'▸ 펼치기':'▾';
      cb.onclick=()=>{collapsed[b.id]=!collapsed[b.id]; render();};
      head.appendChild(cb);
    }
    card.appendChild(head);

    const be=document.createElement('div'); be.className='block-edit';
    be.innerHTML=`<button class="be-btn" data-a="editblock">시간·이름·알람</button>
      <button class="be-btn" data-a="up">▲ 위로</button>
      <button class="be-btn" data-a="down">▼ 아래로</button>
      <button class="be-btn del" data-a="delblock">블록 삭제</button>`;
    be.querySelector('[data-a=editblock]').onclick=()=>editBlock(bi);
    be.querySelector('[data-a=up]').onclick=()=>moveBlock(bi,-1);
    be.querySelector('[data-a=down]').onclick=()=>moveBlock(bi,1);
    be.querySelector('[data-a=delblock]').onclick=()=>delBlock(bi);
    card.appendChild(be);

    if(!isCol||editMode){
      b.items.forEach((it,ii)=>{
        if(!editMode&&!itemInShift(it,shiftName))return;
        if(!editMode&&filterIncomplete&&(!applies(it)||itemDone(it)))return;
        if(!editMode&&filterImportant&&it.imp!==2)return;
        const na=!applies(it), done=!na&&itemDone(it);
        const row=document.createElement('div');
        row.className='item'+(done?' done':'')+(na?' na':'')+(it.imp===2?' imp2-row':''); row.dataset.bi=bi; row.dataset.ii=ii;
        const memo=st.memos[it.id]||'';
        let dayBadge='';
        if(it.days){dayBadge=it.days.length===1?`<span class="day-badge">${DAYS[it.days[0]]}</span>`:`<span class="day-badge">${DAYS[it.days[0]]}~${DAYS[it.days[it.days.length-1]]}</span>`;}
        const cc=catCol(it.cat);
        let impBadge=''; if(it.imp===1)impBadge='<span class="imp imp1">중요</span>'; if(it.imp===2)impBadge='<span class="imp imp2">필수</span>';
        row.innerHTML=`
          <div class="tap">
            <div class="chk">${CHECK_SVG}</div>
            <div class="i-body">
              <div class="i-text">${escapeHtml(it.text)}</div>
              <div class="i-meta">
                <span class="cat" style="color:${cc[0]};background:${cc[1]}">${it.cat}</span>
                ${impBadge}${dayBadge}
                ${na?'<span class="na-tag">오늘 해당 없음</span>':''}
                ${!na?`<span class="memo-btn ${memo?'has':''}">✎ 메모</span>`:''}
                ${!editMode?`<span class="ph-btn ${photoCount(it.id)>0?'has':''}" data-ph="${it.id}">📷${photoCount(it.id)>0?' '+photoCount(it.id):''} ${phOpen.has(it.id)?'▾':'▸'}</span>`:''}
              </div>
            </div>
          </div>
          <div class="edit-ctrls">
            <button class="mini" data-a="edititem">✏️</button>
            <button class="mini" data-a="iup">▲</button>
            <button class="mini" data-a="idown">▼</button>
            <button class="mini del" data-a="delitem">✕</button>
          </div>`;
        if(!na&&!editMode){
          row.querySelector('.tap').onclick=()=>toggleItem(it);
          const mb=row.querySelector('.memo-btn'); if(mb)mb.onclick=e=>{e.stopPropagation(); document.getElementById('memo-'+it.id).classList.toggle('hidden');};
          const pb=row.querySelector('.ph-btn'); if(pb)pb.onclick=e=>{e.stopPropagation(); if(phOpen.has(it.id))phOpen.delete(it.id); else phOpen.add(it.id); render();};
        }
        row.querySelector('[data-a=edititem]').onclick=()=>editItem(bi,ii);
        row.querySelector('[data-a=iup]').onclick=()=>moveItem(bi,ii,-1);
        row.querySelector('[data-a=idown]').onclick=()=>moveItem(bi,ii,1);
        row.querySelector('[data-a=delitem]').onclick=()=>delItem(bi,ii);
        card.appendChild(row);

        if(!na&&!editMode){
          const mbox=document.createElement('div'); mbox.className='memo-box'+(memo?'':' hidden'); mbox.id='memo-'+it.id;
          mbox.innerHTML=`<textarea rows="2" placeholder="메모 (이상 사항·특이점)">${escapeHtml(memo)}</textarea>`;
          mbox.querySelector('textarea').addEventListener('input',e=>{st.memos[it.id]=e.target.value; saveState(); const btn=row.querySelector('.memo-btn'); if(btn)btn.classList.toggle('has',!!e.target.value);});
          card.appendChild(mbox);
        }

        // 항목 사진 패널
        if(!editMode&&phOpen.has(it.id)){
          card.appendChild(buildPhotoPanel(it.id));
        }

        if(it.steps&&!na&&!editMode){
          const stp=st.steps[it.id]||[]; const cnt=it.steps.filter((_,i)=>stp[i]).length;
          const wrap=document.createElement('div'); wrap.className='steps';
          wrap.innerHTML=`<div class="steps-head"><span class="chev">▶</span>블로우다운 절차<span class="cnt">${cnt}/${it.steps.length}</span></div><div class="steps-body hidden"></div>`;
          const body=wrap.querySelector('.steps-body');
          it.steps.forEach((s,i)=>{
            const sd=!!stp[i]; const sr=document.createElement('div'); sr.className='step'+(sd?' done':'');
            sr.innerHTML=`<span class="step-num">${i+1}</span><div class="step-chk">${CHECK_SVG}</div><span class="step-text">${escapeHtml(s)}</span>`;
            sr.onclick=()=>{if(!st.steps[it.id])st.steps[it.id]=[]; st.steps[it.id][i]=!st.steps[it.id][i]; saveState(); render();};
            body.appendChild(sr);
          });
          const h=wrap.querySelector('.steps-head');
          h.onclick=()=>{body.classList.toggle('hidden'); h.querySelector('.chev').classList.toggle('open');};
          card.appendChild(wrap);
        }
      });
      if(editMode){const ai=document.createElement('button'); ai.className='be-btn'; ai.style.margin='4px 0 6px'; ai.textContent='＋ 항목 추가'; ai.onclick=()=>addItem(bi); card.appendChild(ai);}
    }
    block.appendChild(card); list.appendChild(block);
  });

  if(editMode){const ab=document.createElement('button'); ab.className='add-block'; ab.textContent='＋ 시간 블록 추가'; ab.onclick=addBlock; list.appendChild(ab);}
  updateProgress(); markNow();
}

function toggleItem(it){st.done[it.id]=!st.done[it.id]; saveState(); render();}

function updateProgress(){
  let tot=0,dn=0;
  const shiftName=TABS[curShift];
  schema.blocks.forEach(b=>{
    if(!editMode){
      if(shiftName==='비번')return;
      if(shiftName==='당직'){ if(blockShiftGroup(b)==='day')return; }
      else if(!blockInShift(b,shiftName))return;
    }
    b.items.forEach(it=>{
      if(!applies(it))return;
      if(!editMode&&!itemInShift(it,shiftName))return;
      tot++; if(itemDone(it))dn++;
    });
  });
  const pct=tot?Math.round(dn/tot*100):0;
  document.getElementById('barFill').style.width=pct+'%';
  document.getElementById('barPct').textContent=`${dn}/${tot}`;
}
function markNow(){
  const mins=now.getHours()*60+now.getMinutes(); let next=null;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('now'));
  const shiftName=TABS[curShift];
  schema.blocks.forEach((b)=>{
    if(!editMode){
      if(shiftName==='비번')return;
      if(shiftName==='당직'){ if(blockShiftGroup(b)==='day')return; }
      else if(!blockInShift(b,shiftName))return;
    }
    const bm=blkMins(b);
    const app=b.items.filter(it=>applies(it)&&(editMode||itemInShift(it,shiftName)));
    const allDone=app.length&&app.every(itemDone);
    if(bm>=mins-30&&!allDone&&!next)next={b};
  });
  const nt=document.getElementById('nextTask');
  if(next&&!editMode){
    const card=document.querySelector(`.card[data-bid="${next.b.id}"]`);
    if(card){card.classList.add('now'); const t=document.createElement('span'); t.className='now-tag'; t.textContent='다음'; card.querySelector('.c-head').appendChild(t);}
    nt.innerHTML=`다음 할 일 · <b>${next.b.time}</b> ${next.b.name||next.b.items[0].text}`;
  }else nt.innerHTML=editMode?'편집 모드 — 항목을 수정하세요':(shiftName==='비번'?'오늘은 휴무입니다':'완료 항목을 체크하세요');
}



function moveBlock(i,d){
  const list=visibleBlockIdx();
  const p=list.indexOf(i); if(p<0)return;
  const q=p+d; if(q<0||q>=list.length)return;
  const j=list[q];
  [schema.blocks[i],schema.blocks[j]]=[schema.blocks[j],schema.blocks[i]];
  saveSchema(); render();
}
function moveItem(bi,ii,d){
  const arr=schema.blocks[bi].items;
  const j=ii+d; if(j<0||j>=arr.length)return;
  [arr[ii],arr[j]]=[arr[j],arr[ii]];
  saveSchema(); render();
}
// 현재 탭에 보이는 블록의 원본 인덱스 목록 (같은 탭 안에서만 순서 이동)
function visibleBlockIdx(){
  const sh=TABS[curShift];
  return schema.blocks.map((b,i)=>({b,i}))
    .filter(x=> sh==='당직' ? blockShiftGroup(x.b)!=='day' : blockInShift(x.b,sh))
    .sort((a,c)=>blkMins(a.b)-blkMins(c.b)).map(x=>x.i);
}
function delBlock(i){appConfirm(`"${schema.blocks[i].time}" 블록을 삭제할까요?`,()=>{schema.blocks.splice(i,1); saveSchema(); render();});}
function delItem(bi,ii){appConfirm('이 항목을 삭제할까요?',()=>{schema.blocks[bi].items.splice(ii,1); saveSchema(); render();});}
function addItem(bi){schema.blocks[bi].items.push({id:uid(),cat:'기타',text:'새 항목',imp:0}); saveSchema(); render(); editItem(bi,schema.blocks[bi].items.length-1);}
function addBlock(){schema.blocks.push({id:uid(),time:'00:00',name:'',phase:'주간',alarm:false,items:[{id:uid(),cat:'기타',text:'새 항목',imp:0}]}); saveSchema(); render();}

const overlay=document.getElementById('overlay'), sheet=document.getElementById('sheet'), sheetBody=document.getElementById('sheetBody');
function openSheet(html){sheetBody.innerHTML=html; overlay.classList.add('show'); sheet.classList.add('show');}
function closeSheet(){overlay.classList.remove('show'); sheet.classList.remove('show');}
overlay.onclick=closeSheet;

function editItem(bi,ii){
  const it=schema.blocks[bi].items[ii];
  const catChips=CATS.map(c=>`<div class="opt ${it.cat===c?'sel':''}" data-cat="${c}">${c}</div>`).join('');
  const dayChips=DAYS.map((d,i)=>`<div class="opt ${it.days&&it.days.includes(i)?'sel':''}" data-day="${i}">${d}</div>`).join('');
  openSheet(`
    <h2>항목 편집</h2>
    <div class="field"><label>이름</label><textarea id="ei-text" rows="2">${escapeHtml(it.text)}</textarea></div>
    <div class="field"><label>중요도</label><div class="imp-opts">
      <div class="opt ${it.imp===0?'sel':''}" data-imp="0">보통</div>
      <div class="opt ${it.imp===1?'sel':''}" data-imp="1">중요</div>
      <div class="opt ${it.imp===2?'sel':''}" data-imp="2">필수</div></div></div>
    <div class="field"><label>분류</label><div class="cat-opts">${catChips}</div></div>
    <div class="field"><label>요일 조건 <span style="color:var(--dim)">(선택 없으면 매일)</span></label><div class="day-opts">${dayChips}</div></div>
    <div class="btn-row"><button class="big-btn ghost" onclick="closeSheet()">취소</button><button class="big-btn" id="ei-save">저장</button></div>
  `);
  let imp=it.imp, cat=it.cat, days=it.days?[...it.days]:[];
  sheetBody.querySelectorAll('[data-imp]').forEach(o=>o.onclick=()=>{imp=+o.dataset.imp; sheetBody.querySelectorAll('[data-imp]').forEach(x=>x.classList.toggle('sel',+x.dataset.imp===imp));});
  sheetBody.querySelectorAll('[data-cat]').forEach(o=>o.onclick=()=>{cat=o.dataset.cat; sheetBody.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('sel',x.dataset.cat===cat));});
  sheetBody.querySelectorAll('[data-day]').forEach(o=>o.onclick=()=>{const d=+o.dataset.day; if(days.includes(d))days=days.filter(x=>x!==d); else days.push(d); days.sort((a,b)=>a-b); o.classList.toggle('sel');});
  document.getElementById('ei-save').onclick=()=>{it.text=document.getElementById('ei-text').value.trim()||it.text; it.imp=imp; it.cat=cat; if(days.length===0||days.length===7)delete it.days; else it.days=days; saveSchema(); closeSheet(); render();};
}

function editBlock(bi){
  const b=schema.blocks[bi];
  openSheet(`
    <h2>시간 블록 편집</h2>
    <div class="field"><label>시작 시간</label><input type="time" id="eb-time" value="${b.time}"></div>
    <div class="field"><label>종료 시간 <span style="color:var(--dim)">(선택)</span></label><input type="time" id="eb-time2" value="${b.time2||''}"></div>
    <div class="field"><label>블록 이름 <span style="color:var(--dim)">(선택)</span></label><input type="text" id="eb-name" value="${escapeHtml(b.name||'')}" placeholder="예: 오전 검침"></div>
    <div class="field"><label>구분</label><div class="imp-opts">
      <div class="opt ${b.phase!=='당직'?'sel':''}" data-ph="주간">주간</div>
      <div class="opt ${b.phase==='당직'?'sel':''}" data-ph="당직">당직</div></div></div>
    <div class="field"><label>표시할 근무조 <span style="color:var(--dim)">(선택 안 하면 시간대로 자동 판단)</span></label>
      <div class="shift-opts">${['주1','주2','당직','비번','금요일'].map(s=>
        `<div class="sopt ${(b.shifts||[]).includes(s)?'sel':''}" data-sf="${s}">${s}</div>`).join('')}</div></div>
    <div class="row-set" style="border:none;padding:14px 0 4px"><div><div style="font-weight:600">시간 알람</div><div class="set-desc">앱이 열려 있을 때 알림·소리로 알려줍니다</div></div><div class="toggle ${b.alarm?'on':''}" id="eb-alarm"></div></div>
    <div class="btn-row"><button class="big-btn ghost" onclick="closeSheet()">취소</button><button class="big-btn" id="eb-save">저장</button></div>
  `);
  let ph=b.phase, alarm=b.alarm;
  const sfSel=new Set(b.shifts||[]);

function ensureNotif(ask){
  if(!('Notification'in window)){if(ask)toast('이 브라우저는 알림을 지원하지 않습니다'); return;}
  if(Notification.permission==='granted'){if(ask)toast('알림이 켜져 있습니다'); return;}
  if(Notification.permission!=='denied')Notification.requestPermission().then(p=>{if(p==='granted')toast('알림이 켜졌습니다'); else if(ask)toast('설정에서 알림을 허용해주세요');});
  else if(ask)toast('브라우저 설정에서 알림을 허용해주세요');
}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value=880; o.type='sine'; g.gain.setValueAtTime(.001,c.currentTime); g.gain.exponentialRampToValueAtTime(.3,c.currentTime+.02); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5); o.start(); o.stop(c.currentTime+.5);}catch(e){}}
function toast(msg){const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),4000);}
function fireAlarm(b){beep(); const label=`${b.time} ${b.name||b.items[0].text}`; toast('⏰ '+label); if('Notification'in window&&Notification.permission==='granted'){try{new Notification('업무 알람 ⏰',{body:label});}catch(e){}}}
setInterval(()=>{

  schema.blocks.forEach(b=>{if(b.alarm&&b.time===hm&&!st.fired[b.id]){st.fired[b.id]=true; saveState(); fireAlarm(b);}});
},15000);

function exportICS(){
  const dt=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//facility//checklist//KR\r\nCALSCALE:GREGORIAN\r\n';

  schema.blocks.forEach(b=>{if(!b.alarm)return; n++; const t=b.time.replace(':','')+'00'; const title=(b.name||b.items[0].text).replace(/[,;\\]/g,'');
    ics+=`BEGIN:VEVENT\r\nUID:${b.id}@facility\r\nDTSTART;TZID=Asia/Seoul:${dt}T${t}\r\nDURATION:PT5M\r\nRRULE:FREQ=DAILY\r\nSUMMARY:⏰ ${title}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nTRIGGER:PT0M\r\nDESCRIPTION:${title}\r\nEND:VALARM\r\nEND:VEVENT\r\n`;});
  ics+='END:VCALENDAR';

}

// --- IndexedDB ---
let _phdb=null;
function phdb(){
  if(_phdb)return _phdb;
  _phdb=new Promise((res,rej)=>{
    try{
      const rq=indexedDB.open('dailyPhotosDB',1);
      rq.onupgradeneeded=()=>{const db=rq.result; if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'key'});};
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
    }catch(e){rej(e);}
  });
  return _phdb;
}
async function phPut(rec){const db=await phdb(); return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').put(rec); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});}
async function phDel(key){const db=await phdb(); return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});}
async function phAll(){const db=await phdb(); return new Promise((res,rej)=>{const out=[]; const tx=db.transaction('photos','readonly'); const c=tx.objectStore('photos').openCursor(); c.onsuccess=e=>{const cu=e.target.result; if(cu){out.push(cu.value); cu.continue();}else res(out);}; c.onerror=()=>rej(c.error);});}

function rebuildMap(list){

function photoCount(id){return (phMap[id]||[]).length;}
function photoSrc(r){return r.dataURL||r.url||'';}

document.getElementById('photoInput').addEventListener('change', async (e)=>{
  const files=[...(e.target.files||[])]; e.target.value='';
  if(!phTarget||!files.length)return;
  const cur=photoCount(phTarget);
  const room=PH_MAX-cur;
  if(room<=0){toast('최대 '+PH_MAX+'장까지 저장됩니다'); return;}
  const take=files.slice(0,room);
  for(const f of take){
    try{
      const dataURL=await compressImage(f,1000,.82);
      const ts=Date.now()+Math.floor(Math.random()*99);
      const rec={key:`${phTarget}-${ts}`, itemId:phTarget, ts, dataURL, synced:false};
      await phPut(rec);
      (phMap[phTarget]=phMap[phTarget]||[]).push(rec);
    }catch(err){}
  }
  render();
  toast(take.length+'장 저장됨');
  if(ghCfg().token) ghAutoBackupSoon();
});
function compressImage(file,maxW,q){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const sc=img.width>maxW?maxW/img.width:1;
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',q));
      };
      img.onerror=rej; img.src=ev.target.result;
    };
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}

async function ghApi(path, opts){
  const c=ghCfg();
  const res=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`,{
    ...opts,
    headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json',...(opts&&opts.headers||{})}
  });
  return res;
}
let ghBusy=false, ghTimer=null;
function ghAutoBackupSoon(){clearTimeout(ghTimer); ghTimer=setTimeout(()=>ghBackup(false), 2500);}
async function ghBackup(manual){
  const c=ghCfg();
  if(!c.token){ if(manual){toast('먼저 ⚙ 연결설정을 해주세요'); ghConfigSheet();} return; }
  if(ghBusy)return; ghBusy=true;
  ghStatus('백업 중...');
  try{
    // 1) 미동기 사진 업로드
    const all=Object.values(phMap).flat();
    const pend=all.filter(r=>r.dataURL&&!r.synced);
    let up=0;
    for(const r of pend){
      const b64=r.dataURL.split(',')[1];
      const res=await ghApi(`photos/${r.key}.jpg`,{method:'PUT',body:JSON.stringify({message:`photo ${r.key}`,content:b64,branch:c.branch||'main'})});
      if(res.ok){
        r.synced=true;
        r.url=`https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch||'main'}/photos/${r.key}.jpg`;
        await phPut(r); up++;
      }else if(res.status===422){ // 이미 존재
        r.synced=true; r.url=`https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch||'main'}/photos/${r.key}.jpg`;
        await phPut(r);
      }else{
        const t=await res.text();
        throw new Error('업로드 실패 '+res.status);
      }
    }
    // 2) 매니페스트 갱신
    let wm=''; try{wm=localStorage.getItem('daily-workmemo-v1')||'';}catch(e){}
    let ovr={}; try{ovr=JSON.parse(localStorage.getItem('shift-overrides-v1'))||{};}catch(e){}
    const manifest={updated:new Date().toISOString(), items:{}, schema, workmemo:wm, overrides:ovr};
    Object.keys(phMap).forEach(id=>{
      manifest.items[id]=phMap[id].filter(r=>r.synced||r.url).map(r=>({key:r.key, ts:r.ts}));
    });
    let sha=null;
    const g=await ghApi('photos/manifest.json',{method:'GET'});
    if(g.ok){ sha=(await g.json()).sha; }
    const body={message:'update photo manifest', content:btoa(unescape(encodeURIComponent(JSON.stringify(manifest)))), branch:c.branch||'main'};
    if(sha)body.sha=sha;
    const mres=await ghApi('photos/manifest.json',{method:'PUT',body:JSON.stringify(body)});
    if(!mres.ok)throw new Error('매니페스트 실패');
    ghStatus(`백업 완료 ${up?'· 새 사진 '+up+'장':''} · ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`);
    if(manual)toast('☁ 깃허브 백업 완료');
    render();
  }catch(err){
    ghStatus('백업 실패: '+err.message+' (토큰·권한 확인)');
    if(manual)toast('백업 실패 — 연결설정 확인');
  }
  ghBusy=false;
}
async function ghPull(manual){
  const c=ghCfg();
  if(!c.token){ if(manual){toast('먼저 ⚙ 연결설정을 해주세요'); ghConfigSheet();} return; }
  try{
    const res=await ghApi('photos/manifest.json',{method:'GET',headers:{'Accept':'application/vnd.github.raw+json'}});
    if(!res.ok){ if(manual)toast('아직 백업된 사진이 없습니다'); return; }
    const man=await res.json();
    let added=0;
    const have=new Set(Object.values(phMap).flat().map(r=>r.key));
    Object.keys(man.items||{}).forEach(id=>{
      (man.items[id]||[]).forEach(m=>{
        if(!have.has(m.key)){
          const rec={key:m.key, itemId:id, ts:m.ts, url:`https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch||'main'}/photos/${m.key}.jpg`, synced:true};
          (phMap[id]=phMap[id]||[]).push(rec);
          phPut(rec).catch(()=>{});
          added++;
        }
      });
    });
    // 체크리스트·메모·근무표 수정 복원
    let restored=false;
    if(man.schema&&man.schema.blocks&&man.schema.blocks.length){
      if(manual){
        await new Promise(res=>{
          appConfirm(`백업된 체크리스트(${man.schema.blocks.length}개 블록)를 불러옵니다.\n지금 이 기기의 편집 내용은 덮어씌워집니다.\n진행할까요?`,()=>{
            schema=man.schema; saveSchema(); restored=true; res();
          });
          setTimeout(res,60000);
        });
      }
    }
    if(man.workmemo!==undefined&&restored){try{localStorage.setItem('daily-workmemo-v1',man.workmemo); const ta=document.getElementById('workMemo'); if(ta)ta.value=man.workmemo;}catch(e){}}
    if(man.overrides&&restored){try{localStorage.setItem('shift-overrides-v1',JSON.stringify(man.overrides));}catch(e){}}
    if(added||restored){Object.values(phMap).forEach(l=>l.sort((a,b)=>a.ts-b.ts)); render();}
    if(manual)toast(restored?`☁ 체크리스트 복원 · 사진 ${added}장`:(added?`☁ 사진 ${added}장 불러옴`:'모두 최신 상태'));
  }catch(err){ if(manual)toast('불러오기 실패 — 연결설정 확인'); }
}

phBoot();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>시설관리</title>
<style>
  :root{
    --bg:#0a0f1e; --surface:#131a30; --border:#28304f;
    --text:#e7ebf5; --muted:#8a93b0; --acc:#3ad17e;
  }
  body.light{
    --bg:#f4f6f9; --surface:#ffffff; --border:#dde3ea;
    --text:#1a2233; --muted:#5c6b7e; --acc:#18a45c;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; overflow:hidden;}
  .shell{display:flex; flex-direction:column; height:100%; height:100dvh;}
  .top-tabs{
    display:flex; gap:4px; align-items:stretch;
    padding:calc(10px + env(safe-area-inset-top,0px)) 8px 9px;
    background:var(--surface); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .ttab{
    flex:1; padding:8px 0; text-align:center;
    font-size:10px; font-weight:800; color:var(--muted);
    background:var(--bg); border:1.5px solid var(--border); border-radius:10px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    line-height:1; letter-spacing:-.02em;
  }
  .ttab .ic{font-size:14px;}
  .ttab.sel{background:var(--acc); border-color:var(--acc); color:#0a0f1e;}
  body.light .ttab.sel{color:#fff;}
  .theme-btn{
    flex:none; width:34px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--bg); color:var(--muted); font-size:14px; cursor:pointer;
  }
  .frames{flex:1; position:relative; min-height:0;}
  .frames iframe{
    position:absolute; inset:0; width:100%; height:100%;
    border:none; background:var(--bg); display:none;
  }
  .frames iframe.show{display:block;}
</style>
</head>
<body>
<div class="shell">
  <div class="top-tabs">
    <button class="ttab sel" id="tab-daily" onclick="show('daily')"><span class="ic">📋</span>일일업무</button>
    <button class="ttab" id="tab-patrol" onclick="show('patrol')"><span class="ic">🏢</span>순찰</button>
    <button class="ttab" id="tab-loc" onclick="show('loc')"><span class="ic">📍</span>위치</button>
    <button class="ttab" id="tab-cal" onclick="show('cal')"><span class="ic">📅</span>근무표</button>
    <button class="ttab" id="tab-act" onclick="show('act')"><span class="ic">🛠</span>조치사항</button>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌓</button>
  </div>
  <div class="frames">
    <iframe id="fr-daily" allow="web-share"></iframe>
    <iframe id="fr-patrol" allow="web-share"></iframe>
    <iframe id="fr-loc"></iframe>
    <iframe id="fr-cal"></iframe>
    <iframe id="fr-act" allow="web-share"></iframe>
  </div>
</div>

<script>
const LAST_KEY="unified-last-tab-v4";
const KEYS=["daily","patrol","loc","cal","act"];
const loaded={};
function decodePage(id){
  const b64=document.getElementById(id).textContent.trim();
  const bytes=Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
function show(which){
  if(!loaded[which]){
    document.getElementById("fr-"+which).srcdoc=decodePage("pg-"+which);
    loaded[which]=true;
  }
  KEYS.forEach(k=>{
    document.getElementById("fr-"+k).classList.toggle("show", k===which);
    document.getElementById("tab-"+k).classList.toggle("sel", k===which);
  });
  try{localStorage.setItem(LAST_KEY, which);}catch(e){}
}
function applyShellTheme(){
  let t=null;
  try{t=localStorage.getItem("app-theme");}catch(e){}
  document.body.classList.toggle("light", t==="light");
}
function toggleTheme(){
  let t="dark";
  try{t=localStorage.getItem("app-theme")||"dark";}catch(e){}
  const next = t==="light" ? "dark" : "light";
  try{localStorage.setItem("app-theme", next);}catch(e){}
  location.reload();
}
applyShellTheme();
let start="daily";
try{
  const last=localStorage.getItem(LAST_KEY);
  if(KEYS.includes(last)) start=last;
}catch(e){}
show(start);
</script>
</body>
